# Publica o site oficial (Firebase Hosting) e as regras do Firestore
# sempre que o ramo "producao" recebe mudanças. O ramo "main" continua no GitHub Pages, como site de testes.
name: Publicar no Firebase

on:
  push:
    branches: [producao]
  workflow_dispatch:

concurrency:
  group: firebase-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credencial do Firebase
        env:
          CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CHAVE" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT no repositório (Settings > Secrets and variables > Actions)."; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/chave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chave.json" >> "$GITHUB_ENV"
      - name: Criar o site logicacademy (se ainda não existir)
        run: npx --yes firebase-tools@13 hosting:sites:create logicacademy --project mapa-de-estudos-d6eca --non-interactive || echo "site já existe"
      - name: Autorizar o domínio no login (Google/Apple)
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          T=$(gcloud auth print-access-token)
          U=https://identitytoolkit.googleapis.com/admin/v2/projects/mapa-de-estudos-d6eca/config
          H=(-H "Authorization: Bearer $T" -H "x-goog-user-project: mapa-de-estudos-d6eca" -H "Content-Type: application/json")
          D=$(curl -sS -f "${H[@]}" "$U" | jq -c '.authorizedDomains')
          echo "domínios atuais: $D"
          if [ -z "$D" ] || [ "$D" = "null" ] || [ "$D" = "[]" ]; then echo "::warning::Não consegui ler os domínios autorizados; adicione o domínio à mão em Authentication > Configurações."; exit 0; fi
          if ! echo "$D" | jq -e 'index("logicacademy.web.app") and (index("logic-academy.web.app")|not)' >/dev/null; then
            N=$(echo "$D" | jq -c '. - ["logic-academy.web.app","logic-academy.firebaseapp.com"] + ["logicacademy.web.app","logicacademy.firebaseapp.com"] | unique')
            curl -sS -f -X PATCH "${H[@]}" "$U?updateMask=authorizedDomains" -d "{\"authorizedDomains\":$N}" | jq -c '.authorizedDomains' || echo "::warning::Não consegui autorizar o domínio; adicione à mão em Authentication > Configurações."
          fi
      - name: Publicar site e regras
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project mapa-de-estudos-d6eca --non-interactive --force
      - name: Apagar credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json"
