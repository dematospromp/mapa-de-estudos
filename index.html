<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Organizador de estudos: plano semanal, pomodoro e tópicos de provas e editais."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style><title>Mapa de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de produtividade — barra lateral fixa à esquerda com a navegação, área principal com cartões discretos; monocromático preto/branco */
:root{
  --bg:#fafafa; --surface:#ffffff; --sunken:#f4f4f5; --fg:#0a0a0a; --muted:#71717a; --line:#e4e4e7; --line-2:#d4d4d8;
  --inv-bg:#0a0a0a; --inv-fg:#fafafa; --hover:#f4f4f5; --ring:rgba(10,10,10,.12); --danger:#dc2626; --ok:#16a34a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.02);
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px; --side:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#111113; --sunken:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-2:#3f3f46;
  --inv-bg:#fafafa; --inv-fg:#09090b; --hover:#1c1c1f; --ring:rgba(250,250,250,.16); --danger:#f87171; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#111113; --sunken:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-2:#3f3f46;
  --inv-bg:#fafafa; --inv-fg:#09090b; --hover:#1c1c1f; --ring:rgba(250,250,250,.16); --danger:#f87171; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
#root{min-height:100%;display:grid}
a{color:inherit}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);
  padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:.9rem;box-shadow:var(--shadow);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.icon{padding:7px}
.btn.danger{color:var(--danger)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 11px;min-width:0;width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring);outline:none}
textarea{min-height:88px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:500;font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.sm{gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--muted)}
.pill.solid{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:.8rem;border-radius:5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.prog{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .3s}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunken);display:inline-grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--fg);border:1px solid var(--line);overflow:hidden}
.avatar.lg{width:88px;height:88px;font-size:1.6rem}
.avatar.sm{width:24px;height:24px;font-size:.66rem}
.empty-state{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
[hidden]{display:none!important}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 40px)}
.toast{background:var(--inv-bg);color:var(--inv-fg);padding:10px 16px;border-radius:var(--r-sm);font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.err{color:var(--danger);font-size:.86rem}

/* Login */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-l{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:28px;max-width:620px;margin-left:auto;width:100%}
.auth-r{background:var(--inv-bg);color:var(--inv-fg);padding:48px clamp(16px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.auth-r .feat{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.auth-r .feat span{width:36px;height:36px;border-radius:9px;border:1px solid color-mix(in srgb,var(--inv-fg) 25%,transparent);display:grid;place-items:center}
.auth-r p{opacity:.72;font-size:.9rem}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center}
.logo svg{width:16px;height:16px}
.auth-r .logo{background:var(--inv-fg);color:var(--inv-bg)}
.auth h1{font-size:clamp(1.9rem,3.6vw,2.6rem);font-weight:700;letter-spacing:-.03em}

/* Shell com barra lateral */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:14px 12px;gap:6px;overflow-y:auto}
.side .brand{padding:6px 8px 12px}
.nav-sec{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500;font-size:.9rem;cursor:pointer}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a.on{background:var(--sunken);color:var(--fg)}
.nav a .badge{margin-left:auto;font-size:.7rem;font-family:var(--f-mono)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer}
.me:hover{background:var(--hover)}
.me .nm{font-weight:600;font-size:.88rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .sub{font-size:.75rem;color:var(--muted)}
.mini-pomo{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);background:var(--inv-bg);color:var(--inv-fg);cursor:pointer;font-size:.84rem}
.mini-pomo b{font-family:var(--f-mono);font-size:1rem}
.main{min-width:0}
.topbar-m{display:none}
.page{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,3.5vw,36px);padding-block:28px 64px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-h p{color:var(--muted);margin-top:4px}

/* Estatísticas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stat .v{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}
.stat .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

/* Blocos de estudo */
.blist{display:flex;flex-direction:column}
.bitem{display:grid;grid-template-columns:auto 92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bitem:first-child{border-top:0}
.bitem.done .bt{text-decoration:line-through;color:var(--muted)}
.chk{width:18px;height:18px;accent-color:var(--fg);cursor:pointer}
.tipo{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.week-wrap{overflow-x:auto;padding-bottom:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(158px,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.day header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day.hoje{border-color:var(--fg)}
.day.hoje header{background:var(--inv-bg);color:var(--inv-fg);border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.day.hoje header .muted{color:var(--inv-fg);opacity:.7}
.day .lst{display:flex;flex-direction:column;gap:6px;padding:8px}
.blk{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;display:flex;flex-direction:column;gap:3px;font-size:.82rem;position:relative;background:var(--surface)}
.blk.t-revisão{background:var(--sunken)}
.blk.t-simulado{border-style:dashed;border-color:var(--fg)}
.blk .tm{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.blk .mt{font-weight:600;line-height:1.25;padding-right:20px;overflow-wrap:break-word}
.blk .tk{color:var(--muted);font-size:.78rem;line-height:1.35;overflow-wrap:anywhere}
.blk .chk{position:absolute;top:8px;right:8px;width:15px;height:15px}
.blk .play{align-self:flex-start;margin-top:4px}
.blk.done .mt,.blk.done .tk{text-decoration:line-through;opacity:.55}
.day .empty{padding:12px;color:var(--muted);font-size:.8rem}
.bars-h{display:flex;flex-direction:column;gap:10px}
.bars-h .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.86rem}
.bars-h .prog{grid-column:1/-1}

/* Questionário */
.wizard{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:32px 64px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;background:var(--line);border-radius:2px}
.steps span.on{background:var(--fg)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line-2);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,box-shadow .12s}
.opt:hover{border-color:var(--fg)}
.opt.on{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring)}
.opt b{font-size:.92rem}
.opt span{font-size:.78rem;color:var(--muted);line-height:1.35}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{background:transparent;border:1px dashed var(--line-2);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.sug:hover{border-color:var(--fg);color:var(--fg)}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mat .nm{font-weight:500;overflow-wrap:anywhere}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:5px}
.x:hover{background:var(--hover);color:var(--fg)}
.dayrow{display:grid;grid-template-columns:90px minmax(0,1fr) 60px 108px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--fg)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:7px;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 11px;cursor:pointer;font-size:.86rem;background:var(--surface)}
.checks input{accent-color:var(--fg)}
.navq{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}

/* Pomodoro */
.pomo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.pomo-main{display:flex;flex-direction:column;align-items:center;gap:22px;padding:32px 20px}
.ring{position:relative;width:min(300px,72vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .t{font-family:var(--f-mono);font-size:clamp(2.6rem,9vw,3.8rem);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--fg)}
.dots i.on{background:var(--fg)}

/* Tópicos */
.mat-acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.mat-acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:14px;align-items:center}
.mat-acc>summary::-webkit-details-marker{display:none}
.mat-acc[open]>summary{border-bottom:1px solid var(--line)}
.tops{padding:8px 16px 14px;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem}
.top:first-child{border-top:0}
.top.done span{color:var(--muted);text-decoration:line-through}
.top .chk{margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunken);cursor:pointer}
.drop.over{border-color:var(--fg)}
.loadbox{display:flex;flex-direction:column;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--line-2);border-top-color:var(--fg);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Chat e comunidade */
.chat{display:flex;flex-direction:column;height:min(640px,calc(100dvh - 210px));min-height:380px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.msg .h{display:flex;gap:8px;align-items:baseline;font-size:.84rem}
.msg .h b{font-weight:600}
.msg .h time{font-size:.72rem;color:var(--muted)}
.msg .b{overflow-wrap:anywhere;white-space:pre-wrap;font-size:.9rem}
.msg.mine .h b::after{content:" (você)";font-weight:400;color:var(--muted)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-family:var(--f-mono);width:26px;text-align:center;color:var(--muted);font-weight:500}
.li.me-row{background:var(--sunken);border-radius:var(--r-sm);padding-inline:8px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.podium .card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:10px}
.gcard .stack-av{display:flex}
.gcard .stack-av .avatar{margin-left:-8px;border:2px solid var(--surface)}
.gcard .stack-av .avatar:first-child{margin-left:0}
pre.prompt{white-space:pre-wrap;font-family:var(--f-mono);font-size:.76rem;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;max-height:420px;overflow:auto;margin:12px 0 0}
details>summary{cursor:pointer;font-weight:500}
.lock{max-width:520px;margin:40px auto}
.overlay{display:none}

@media (max-width:1100px){
  .cols,.pomo{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .shell.open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .topbar-m{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .auth{grid-template-columns:1fr}
  .auth-l{margin:0;max-width:none}
}
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
  .mat{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .mat .x{grid-row:1;grid-column:2}
  .dayrow{grid-template-columns:70px minmax(0,1fr) 54px;row-gap:4px}
  .dayrow input[type=time]{grid-column:2/-1}
  .bitem{grid-template-columns:auto minmax(0,1fr) auto}

/* ================= Validação de planos ================= */
function normalizarPlano(raw,nomesValidos){
  if(!raw||typeof raw!=="object")return null;
  let sem=raw.semana;
  if(Array.isArray(sem)){const o={};sem.forEach((d,i)=>{const k=norm(d&&d.dia||DIAS[i]&&DIAS[i].k).slice(0,3);o[k]=d.blocos||[]});sem=o}
  if(!sem||typeof sem!=="object")return null;
  const out={};let total=0;
  DIAS.forEach(x=>{
    out[x.k]=(Array.isArray(sem[x.k])?sem[x.k]:[]).map(b=>{
      const i=toMin(b.inicio),f=toMin(b.fim);if(i==null||f==null||f<=i)return null;
      let tipo=norm(b.tipo||"teoria");tipo=tipo.startsWith("exerc")?"exercícios":tipo.startsWith("revis")?"revisão":tipo.startsWith("simul")?"simulado":"teoria";
      const ok=nomesValidos.find(n=>norm(n)===norm(b.materia));
      return {id:uid(),inicio:toHHMM(i),fim:toHHMM(f),min:f-i,materia:ok||String(b.materia||"Estudo").slice(0,60),tipo,tarefa:String(b.tarefa||"").slice(0,180),feito:false};
    }).filter(Boolean).sort((a,b)=>toMin(a.inicio)-toMin(b.inicio));
    total+=out[x.k].length;
  });
  if(!total)return null;
  return {resumo:String(raw.resumo||""),semana:out,dicas:Array.isArray(raw.dicas)?raw.dicas.slice(0,6).map(String):[]};
}

/* ================= Algoritmo local (sem IA) ================= */
function planoLocal(p,prova){
  let mats=p.materias.map(m=>({nome:m.nome,dif:m.dif,peso:m.dif*(PRIO[m.prio]||1),tops:null}));
  if(prova){
    const {ed,tri}=prova,pct=tri.pct/100;
    const ex=ed.materias.filter(m=>!(tri.mats[m.id]||{}).fora).map(m=>{const dom=(tri.mats[m.id]||{dom:3}).dom;return {nome:m.nome,dif:6-dom,peso:(6-dom)*(1+(m.questoes||8)/20),tops:m.topicos.filter(t=>!t.feito).map(t=>t.t)}});
    mats=mats.filter(m=>!ex.some(e=>norm(e.nome)===norm(m.nome)));
    const sb=mats.reduce((a,m)=>a+m.peso,0)||1,se=ex.reduce((a,m)=>a+m.peso,0)||1;
    mats=pct>=1?ex:mats.map(m=>({...m,peso:m.peso/sb*(1-pct)})).concat(ex.map(m=>({...m,peso:m.peso/se*pct})));
  }
  if(!mats.length)mats=[{nome:"Estudo livre",dif:3,peso:1,tops:null}];
  mats.forEach((m,i)=>m.id=i);
  const somaPeso=mats.reduce((a,m)=>a+m.peso,0);
  const slots={};let totalSlots=0;
  DIAS.forEach(x=>{const min=Math.round((+p.horas[x.k]||0)*60);const n=Math.floor((min+p.pausa)/(p.bloco+p.pausa));const resto=min-(n*(p.bloco+p.pausa)-p.pausa);
    slots[x.k]={n,curto:n>0&&resto>=20+p.pausa?resto-p.pausa:(n===0&&min>=20?min:0)};totalSlots+=n});
  const alvo={},usados={},cont={},ptr={};mats.forEach(m=>{alvo[m.id]=somaPeso?m.peso/somaPeso*totalSlots:0;usados[m.id]=0;cont[m.id]=0;ptr[m.id]=0});
  const comProva=!!prova||p.temProva;const met=p.metodos||[];
  const tarefa=(m,t)=>{
    if(m.tops&&m.tops.length){const top=m.tops[ptr[m.id]%m.tops.length];
      if(t==="teoria"){ptr[m.id]++;return "Teoria: "+top}
      if(t==="exercícios")return "Questões sobre: "+m.tops[Math.max(0,ptr[m.id]-1)%m.tops.length];
      if(t==="revisão")return "Revisar: "+m.tops[Math.max(0,ptr[m.id]-1)%m.tops.length]}
    if(t==="teoria")return met.includes("videoaulas")?`Assistir aula de um tópico novo de ${m.nome} e anotar os pontos-chave`:met.includes("mapas")?`Estudar um tópico novo de ${m.nome} e montar um mapa mental`:`Estudar um tópico novo de ${m.nome} e fazer um resumo de 1 página`;
    if(t==="exercícios")return `Resolver 15–20 questões de ${m.nome} e refazer as que errou`;
    if(t==="revisão")return met.includes("flashcards")?`Revisar ${m.nome} com flashcards do que viu nos últimos dias`:`Revisar o resumo de ${m.nome} e responder de memória 5 perguntas`;
    return "Simulado cronometrado com questões das matérias da semana";
  };
  const semana={};
  DIAS.forEach((x,di)=>{
    const {n,curto}=slots[x.k];let t=toMin(p.inicio[x.k]);if(t==null)t=19*60;const sel=[];let ult=null;
    for(let s=0;s<n;s++){const c=mats.filter(m=>mats.length===1||m.id!==ult).sort((a,b)=>(alvo[b.id]-usados[b.id])-(alvo[a.id]-usados[a.id])||b.dif-a.dif)[0];usados[c.id]++;ult=c.id;sel.push(c)}
    sel.sort((a,b)=>b.dif-a.dif);
    for(let i=1;i<sel.length;i++){if(sel[i].id===sel[i-1].id){const j=sel.findIndex((e,k)=>k>i&&e.id!==sel[i].id);if(j>0)[sel[i],sel[j]]=[sel[j],sel[i]]}}
    const lista=[];
    sel.forEach((m,i)=>{
      let tipo;
      if(comProva&&di>=5&&n>=3&&i===n-1)tipo="simulado";
      else{const ciclo=m.dif>=4?["teoria","exercícios","exercícios","revisão"]:["teoria","exercícios","revisão"];tipo=ciclo[cont[m.id]%ciclo.length];cont[m.id]++}
      lista.push({id:uid(),inicio:toHHMM(t),fim:toHHMM(t+p.bloco),min:+p.bloco,materia:tipo==="simulado"?"Simulado geral":m.nome,tipo,tarefa:tarefa(m,tipo),feito:false});
      t+=+p.bloco+ +p.pausa;
    });
    if(curto){const m=mats.slice().sort((a,b)=>b.dif-a.dif)[di%mats.length];lista.push({id:uid(),inicio:toHHMM(t),fim:toHHMM(t+curto),min:curto,materia:m.nome,tipo:"revisão",tarefa:tarefa(m,"revisão"),feito:false})}
    semana[x.k]=lista;
  });
  const top=mats.slice().sort((a,b)=>b.peso-a.peso)[0];
  return {resumo:`O tempo foi dividido pelo peso de cada matéria${prova?" (para a prova: domínio e número de questões)":" (dificuldade × prioridade)"}. ${top.nome} recebe mais blocos e abre os dias em que aparece, quando você tem mais energia. Cada matéria passa por teoria, exercícios e revisão ao longo da semana.`,
    semana,dicas:["Comece pelo bloco mais difícil do dia e deixe as revisões para o fim.","Use o pomodoro: nas pausas, levante e fique longe do celular.","Anote as questões que errar; elas são o conteúdo da próxima revisão.",(p.temProva||prova)?"Nas duas semanas antes da prova, troque parte da teoria por simulados.":"Uma vez por semana, confira se o plano ainda cabe na sua rotina."]};
}

/* ================= Geração e ajuste do plano ================= */
function telaCarregando(titulo,sub){$("#main").innerHTML=`<div class="page"><div class="card loadbox" style="max-width:560px;margin:60px auto"><div class="row"><span class="spinner"></span><h2>${esc(titulo)}</h2></div><p class="muted" id="ld">${esc(sub)}</p><div class="prog"><i id="ldp" style="width:8%"></i></div></div></div>`}
async function pedirPlano(p,o){
  const nomes=p.materias.map(m=>m.nome).concat(o.prova?o.prova.ed.materias.map(m=>m.nome):[]).concat(["Simulado geral"]);
  let plano=null,aviso="";
  if(S.sample){
    try{
      const raw=await S.sample.json(montarPrompt(p,o),{modelTier:"default",cache:false,onText:({text})=>{const e=$("#ld"),b=$("#ldp");if(e)e.textContent=`A IA está escrevendo o plano… (${text.length} caracteres)`;if(b)b.style.width=Math.min(95,8+text.length/40)+"%"}});
      plano=normalizarPlano(raw,nomes);if(!plano)aviso="A resposta da IA veio incompleta; usei o algoritmo local.";
    }catch(e){aviso=e&&e.code==="not_granted"?"Você não autorizou o uso da IA; usei o algoritmo local.":e&&e.code==="rate_limited"?"Limite de uso da IA atingido; usei o algoritmo local.":"A IA não respondeu; usei o algoritmo local."}
  }
  if(plano)plano.geradoPor="ia";
  return {plano,aviso};
}
async function gerar(o){
  o=o||{};
  telaCarregando(o.pedido?"Ajustando seu plano":"Montando seu plano",S.sample?"A IA está distribuindo suas matérias pela semana…":"Calculando a distribuição das matérias…");
  let {plano,aviso}=await pedirPlano(S.perfil,{pedido:o.pedido,atual:o.pedido?S.plano:null,prova:S.plano&&S.plano.prova?provaCtx():null});
  if(!plano){
    if(o.pedido){toast(aviso||"O ajuste precisa da IA, que não está disponível aqui.");go("semana");return}
    plano=planoLocal(S.perfil,S.plano&&S.plano.prova?provaCtx():null);plano.geradoPor="local";
  }
  manterFeitos(plano);
  if(S.plano&&S.plano.prova&&S.edital)plano.prova=S.plano.prova;
  plano.criadoEm=new Date().toISOString();S.plano=plano;await gravar("plano",plano,true);
  go("semana");toast(aviso||(o.pedido?"Plano ajustado.":"Plano criado e salvo."));
}
function provaCtx(){return S.edital&&S.edital.tri?{ed:S.edital,tri:S.edital.tri}:null}
function manterFeitos(plano){if(!S.plano)return;DIAS.forEach(x=>(plano.semana[x.k]||[]).forEach(b=>{const v=(S.plano.semana[x.k]||[]).find(o=>o.inicio===b.inicio&&o.materia===b.materia);if(v&&v.feito)b.feito=true}))}

/* ================= Pomodoro ================= */
const P={modo:"foco",dur:{foco:50,curta:10,longa:20},rodando:false,fimEm:0,restante:50*60e3,ciclos:0,materia:"",bloco:null,tick:null,iniciadoEm:0,acumulado:0};
const MODOS={foco:"Foco",curta:"Pausa curta",longa:"Pausa longa"};
function pomoTotal(){return P.dur[P.modo]*60e3}
function pomoRestante(){return P.rodando?Math.max(0,P.fimEm-Date.now()):P.restante}
function iniciarPomo(){if(P.rodando)return;P.rodando=true;P.fimEm=Date.now()+P.restante;P.iniciadoEm=Date.now();clearInterval(P.tick);P.tick=setInterval(tickPomo,250);somPreparar();tickPomo()}
function pausarPomo(){if(!P.rodando)return;P.restante=pomoRestante();if(P.modo==="foco")P.acumulado+=Date.now()-P.iniciadoEm;P.rodando=false;clearInterval(P.tick);tickPomo()}
function resetPomo(modo){pausarPomo();if(modo)P.modo=modo;P.restante=pomoTotal();P.acumulado=0;tickPomo()}
function tickPomo(){
  const r=pomoRestante();
  if(P.rodando&&r<=0){concluirFase();return}
  const mm=String(Math.floor(r/60000)).padStart(2,"0"),ss=String(Math.floor(r/1000)%60).padStart(2,"0");
  const t=$("#pomo-t");if(t)t.textContent=mm+":"+ss;
  const c=$("#pomo-c");if(c){const L=2*Math.PI*46;c.style.strokeDasharray=L;c.style.strokeDashoffset=L*(1-r/pomoTotal())}
  const pb=$("#pomo-play");if(pb)pb.innerHTML=P.rodando?ico("pause")+"Pausar":ico("play")+(P.restante<pomoTotal()?"Continuar":"Iniciar");
  const mini=$("#mini-pomo");if(mini){mini.hidden=!(P.rodando||P.restante<pomoTotal());mini.innerHTML=`${ico(P.rodando?"timer":"pause")}<div style="min-width:0"><b>${mm}:${ss}</b><div style="font-size:.74rem;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${MODOS[P.modo]}${P.materia?" · "+esc(P.materia):""}</div></div>`}
  document.title=P.rodando?`${mm}:${ss} · ${MODOS[P.modo]} — Mapa de Estudos`:"Mapa de Estudos";
}
function concluirFase(){
  clearInterval(P.tick);P.rodando=false;bip();
  if(P.modo==="foco"){
    registrar(P.dur.foco,P.materia);P.ciclos++;
    if(P.bloco)marcarBloco(P.bloco,true);
    P.modo=P.ciclos%4===0?"longa":"curta";toast(`Sessão de foco concluída: +${P.dur.foco} min. Hora da ${MODOS[P.modo].toLowerCase()}.`);
  }else{P.modo="foco";toast("Pausa encerrada. Pronto para o próximo foco?")}
  P.restante=pomoTotal();P.acumulado=0;
  if(S.view==="pomodoro")renderPomodoro();else tickPomo();
  if($("#pomo-auto")&&$("#pomo-auto").checked||P.auto)iniciarPomo();
}
function encerrarRegistrar(){
  if(P.modo!=="foco")return;let ms=P.acumulado+(P.rodando?Date.now()-P.iniciadoEm:0);
  const min=Math.floor(ms/60000);pausarPomo();
  if(min>=1){registrar(min,P.materia);toast(`${min} min registrados.`)}else toast("Menos de 1 minuto: nada foi registrado.");
  resetPomo("foco");if(S.view==="pomodoro")renderPomodoro();
}
function registrar(min,materia){
  const hoje=dataISO(),L=S.pomoLog;L.dias[hoje]=L.dias[hoje]||{min:0,mat:{}};
  L.dias[hoje].min+=min;const k=materia||"Sem matéria";L.dias[hoje].mat[k]=(L.dias[hoje].mat[k]||0)+min;L.sessoes=(L.sessoes||0)+1;
  const ks=Object.keys(L.dias).sort();while(ks.length>120){delete L.dias[ks.shift()]}
  gravar("pomo",L,true);
  if(S.mode==="nuvem"){const dias={};for(let i=0;i<14;i++){const d=diasAtras(i);if(L.dias[d])dias[d]=L.dias[d].min}
    gravarPub("ranking",{dias,total:Object.values(L.dias).reduce((a,d)=>a+d.min,0),atualizado:Date.now()})}
}
let actx=null;
function somPreparar(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function bip(){try{if(!actx)return;[0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.2);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.22)})}catch(e){}}
function minutosDia(d){return S.pomoLog&&S.pomoLog.dias[d]?S.pomoLog.dias[d].min:0}
function sequencia(){let n=0;for(let i=0;i<120;i++){if(minutosDia(diasAtras(i))>0)n++;else if(i>0)break}return n}

      if(col==="perfis")S.pub=m[S.uid]||null;atualizarSocial(col)},()=>{}))}catch(e){}
  });

const nomeDe=id=>(S.soc.perfis[id]&&S.soc.perfis[id].nome)||"Estudante";

function todosGrupos(){const out={};Object.entries(S.soc.grupos).forEach(([dono,doc])=>Object.entries((doc&&doc.lista)||{}).forEach(([gid,g])=>{out[gid]={...g,id:gid,dono}}));return out}
function membrosDe(gid){return Object.entries(S.soc.membros).filter(([,d])=>d&&d.grupos&&d.grupos[gid]).map(([id])=>id)}
function meusGrupos(){const d=S.soc.membros[S.uid];return d&&d.grupos?Object.keys(d.grupos).filter(g=>d.grupos[g]):[]}
function minHoje(id){const r=S.soc.ranking[id];return r&&r.dias?(r.dias[dataISO()]||0):0}
function min7(id){const r=S.soc.ranking[id];if(!r||!r.dias)return 0;let s=0;for(let i=0;i<7;i++)s+=r.dias[diasAtras(i)]||0;return s}
async function enviarMsg(canal,texto){
  texto=texto.trim().slice(0,600);if(!texto)return;
  const doc=clone(S.soc.msgs[S.uid]||{global:[],grupos:{}});doc.global=doc.global||[];doc.grupos=doc.grupos||{};
  const m={id:uid(),t:texto,em:Date.now()};
  if(canal==="global"){doc.global.push(m);doc.global=doc.global.slice(-40)}else{(doc.grupos[canal]=doc.grupos[canal]||[]).push(m);doc.grupos[canal]=doc.grupos[canal].slice(-40)}
  S.soc.msgs[S.uid]=doc;renderMsgs();await gravarPub("msgs",doc);
}
function mensagens(canal){const out=[];Object.entries(S.soc.msgs).forEach(([autor,d])=>{const arr=canal==="global"?(d&&d.global):(d&&d.grupos&&d.grupos[canal]);(arr||[]).forEach(m=>{if(m&&typeof m.t==="string")out.push({...m,autor})})});return out.sort((a,b)=>a.em-b.em).slice(-150)}

function renderInicio(){
  const p=S.perfil,pl=S.plano,hi=hojeIdx(),hojeK=DIAS[hi].k;

function acharBloco(ref){const [k,id]=ref.split("|");return (S.plano&&S.plano.semana[k]||[]).find(b=>b.id===id)}

async function lerArquivos(files){
  if(!files.length)return;const info=$("#ed-info");
  const imgs=files.filter(f=>/^image\//.test(f.type)),f=files.find(f=>!/^image\//.test(f.type));
  if(imgs.length&&!f){analisarImagens(imgs);return}
  if(!f)return;
  info.innerHTML=`<div class="row muted"><span class="spinner"></span>Lendo ${esc(f.name)}…</div><div class="prog" style="margin-top:8px"><i id="rd-p" style="width:3%"></i></div>`;
  try{
    let texto="",pags=0;
    if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){
      if(!window.pdfjsLib)throw new Error("O leitor de PDF não carregou. Recarregue a página ou cole o texto.");
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;pags=doc.numPages;
      for(let i=1;i<=pags;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let last=null,line="";
        tc.items.forEach(it=>{const y=it.transform?Math.round(it.transform[5]):0;if(last!==null&&Math.abs(y-last)>2){texto+=line+"\n";line=""}line+=it.str+(it.hasEOL?"":" ");last=y});texto+=line+"\n\n";
        $("#rd-p").style.width=Math.round(i/pags*100)+"%"}
    }else{texto=await f.text()}
    texto=texto.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
    if(texto.length<200){info.innerHTML=`<p class="err">Não encontrei texto neste arquivo. Ele parece ser um PDF escaneado (imagem). ${S.sample?"Envie fotos das páginas do conteúdo programático ou":""} cole o texto na aba “Colar texto”.</p>`;return}
    S.editalTexto=texto;
    info.innerHTML=`<div class="row" style="justify-content:space-between"><div><b>${esc(f.name)}</b><div class="small muted">${pags?pags+" páginas · ":""}${texto.length.toLocaleString("pt-BR")} caracteres lidos</div></div><button class="btn primary" type="button" id="ed-go">${ico("spark")}Analisar edital inteiro com IA</button></div>`;
    $("#ed-go").onclick=()=>analisarTexto(texto,f.name);
  }catch(e){info.innerHTML=`<p class="err">${esc(e.message||"Não foi possível ler o arquivo.")} Tente colar o texto na aba “Colar texto”.</p>`}
}
function progressoEdital(t,s,p){$("#ed-body").innerHTML=`<div class="loadbox"><div class="row"><span class="spinner"></span><b>${esc(t)}</b></div><p class="small muted" id="ed-s">${esc(s)}</p><div class="prog"><i id="ed-p" style="width:${p}%"></i></div></div>`}
async function analisarTexto(texto,origem){
  if(!S.sample){toast("A análise do edital precisa da IA, que não está disponível nesta visualização.");return}
  const TAM=60000,SOB=800,partes=[];for(let i=0;i<texto.length;i+=TAM-SOB)partes.push(texto.slice(i,i+TAM));
  progressoEdital("Lendo o edital inteiro",`Dividi o edital em ${partes.length} ${partes.length>1?"partes":"parte"}. Analisando a parte 1…`,5);
  const res=[];let falhas=0;
  for(let i=0;i<partes.length;i++){
    $("#ed-s").textContent=`Analisando a parte ${i+1} de ${partes.length}…`;
    try{res.push(await S.sample.json(promptEditalTrecho(partes[i],i,partes.length),{modelTier:"default",cache:false}))}
    catch(e){if(e&&e.code==="not_granted"){toast("Você não autorizou o uso da IA.");renderEdital();return}if(e&&e.code==="rate_limited"){toast("Limite de uso da IA atingido. Tente de novo mais tarde.");renderEdital();return}falhas++}
    $("#ed-p").style.width=Math.round((i+1)/partes.length*100)+"%";
  }
  const ed=juntarEdital(res,{fonte:"edital",origem});
  if(!ed.materias.length){toast("Não encontrei o conteúdo programático. Confira se o arquivo é o edital completo.");renderEdital();return}
  if(falhas)toast(`${falhas} parte(s) do edital não puderam ser analisadas; confira os tópicos.`);
  salvarEdital(ed);
}
async function analisarImagens(imgs){
  const lim=await S.sample.limits().catch(()=>null);if(!lim||!lim.images){toast("Esta visualização não aceita imagens. Cole o texto do edital.");return}
  imgs=imgs.slice(0,lim.images.maxCount);progressoEdital("Lendo as fotos do edital",`${imgs.length} imagem(ns) enviada(s)…`,30);
  try{const r=await S.sample.json(promptEditalTrecho("(o conteúdo está nas imagens anexadas)",0,1),{images:imgs,modelTier:"default",cache:false});
    const ed=juntarEdital([r],{fonte:"edital",origem:"fotos"});if(!ed.materias.length){toast("Não encontrei tópicos nas imagens.");renderEdital();return}salvarEdital(ed)}
  catch(e){toast("A IA não conseguiu ler as imagens.");renderEdital()}
}
async function buscarPorNome(nome,extra){
  if(/esp\s*c\s*ex/i.test(nome)){
    const pr=PRESET_ESPCEX;salvarEdital({nome:"EsPCEx",banca:pr.banca,dataProva:"",cargo:"Curso de Formação de Oficiais",fonte:"pesquisa",referencia:pr.referencia,fonteUrl:pr.fonteUrl,confianca:"alta",
      materias:pr.materias.map(([n,q,ts])=>({id:uid(),nome:n,questoes:q,topicos:ts.map(t=>({id:uid(),t,feito:false}))}))});return}
  if(!S.sample){toast("Sem a IA, só a EsPCEx está disponível. Envie o edital quando tiver acesso à IA.");return}
  progressoEdital(`Buscando os tópicos de ${nome}`,"A IA está montando o conteúdo programático…",15);
  try{
    const r=await S.sample.json(promptPorNome(nome,extra),{modelTier:"complex",cache:false,onText:({text})=>{const p=$("#ed-p");if(p)p.style.width=Math.min(95,15+text.length/60)+"%"}});
    const ed=juntarEdital([r],{fonte:"ia",origem:nome});
    if(!ed.materias.length){$("#ed-body").innerHTML=`<div class="empty-state"><b>Não encontrei o conteúdo de “${esc(nome)}”.</b><span>${esc(r&&r.observacao||"A IA não conhece essa prova com segurança.")}</span><span>Envie o edital em PDF ou cole o texto dele.</span><button class="btn" type="button" id="ed-volta">Voltar</button></div>`;$("#ed-volta").onclick=renderEdital;return}
    ed.nome=ed.nome||nome;ed.referencia=String(r.referencia||"");ed.confianca=String(r.confianca||"media");ed.observacao=String(r.observacao||"");
    salvarEdital(ed);
  }catch(e){toast(e&&e.code==="not_granted"?"Você não autorizou o uso da IA.":"A IA não respondeu. Tente de novo.");renderEdital()}
}
function juntarEdital(partes,meta){
  const ed={nome:"",banca:"",dataProva:"",cargo:"",materias:[],...meta,criadoEm:new Date().toISOString()};const idx={};
  partes.forEach(r=>{if(!r||typeof r!=="object")return;const pv=r.prova||{};
    ["nome","banca","cargo"].forEach(k=>{if(!ed[k]&&pv[k])ed[k]=String(pv[k]).slice(0,120)});
    if(!ed.dataProva&&/^\d{4}-\d{2}-\d{2}$/.test(pv.dataProva||""))ed.dataProva=pv.dataProva;
    (Array.isArray(r.materias)?r.materias:[]).forEach(m=>{if(!m||!m.nome)return;const k=norm(m.nome);
      let alvo=idx[k];if(!alvo){alvo={id:uid(),nome:String(m.nome).slice(0,60),questoes:0,topicos:[]};idx[k]=alvo;ed.materias.push(alvo)}
      if(+m.questoes>alvo.questoes)alvo.questoes=Math.round(+m.questoes);
      (Array.isArray(m.topicos)?m.topicos:[]).forEach(t=>{t=String(t&&t.t||t||"").trim().slice(0,200);if(t&&!alvo.topicos.some(x=>norm(x.t)===norm(t)))alvo.topicos.push({id:uid(),t,feito:false})});
    })});
  ed.materias=ed.materias.filter(m=>m.topicos.length);
  return ed;
}

      <div class="card chat">${sou?`<div class="msgs" id="msgs" aria-live="polite"></div>
        <form class="composer" id="composer"><input type="text" id="msg-in" placeholder="Mensagem para o grupo" maxlength="600" autocomplete="off" aria-label="Mensagem"><button class="btn primary" type="submit" aria-label="Enviar">${ico("send")}</button></form>`
        :`<div class="empty-state" style="margin:20px">Entre no grupo para ver e mandar mensagens.</div>`}</div>
      <div class="card"><div class="card-h"><h3>Ranking do grupo · hoje</h3></div><div id="g-membros">${membrosHtml(g.id)}</div></div>
    </div></div>`;
  $("#g-voltar").onclick=()=>{S.grupoAberto=null;renderView()};
  const s=$("#g-sair");if(s)s.onclick=async()=>{await sairGrupo(g.id);renderView()};
  const en=$("#g-entrar");if(en)en.onclick=async()=>{await entrarGrupo(g.id);renderView()};
  if(sou)ligarChat(g.id);
}

/* ================= Chat ================= */
function renderChat(){
  if(S.mode!=="nuvem"){$("#main").innerHTML=bloqueado("Chat global");ligarBloqueado();return}
  $("#main").innerHTML=`<div class="page">${pageHead("Chat global","Converse com todos os estudantes que usam o site. Seja gentil.")}
    <div class="card chat"><div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="composer" id="composer"><input type="text" id="msg-in" placeholder="Escreva uma mensagem" maxlength="600" autocomplete="off" aria-label="Mensagem"><button class="btn primary" type="submit" aria-label="Enviar">${ico("send")}</button></form></div></div>`;
  ligarChat("global");
}
let canalAtual="global";
function ligarChat(canal){canalAtual=canal;renderMsgs();$("#composer").addEventListener("submit",e=>{e.preventDefault();const i=$("#msg-in");const v=i.value;i.value="";enviarMsg(canal,v);i.focus()})}
function renderMsgs(){
  const box=$("#msgs");if(!box)return;const perto=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  const ms=mensagens(canalAtual);
  box.innerHTML=ms.length?ms.map(m=>`<div class="msg ${m.autor===S.uid?"mine":""}">${avatar(m.autor)}<div style="min-width:0"><div class="h"><b>${esc(nomeDe(m.autor))}</b><time>${hora(m.em)}</time></div><div class="b">${esc(m.t)}</div></div></div>`).join("")
    :`<div class="empty-state" style="margin:auto">${ico("chat")}<span>Nenhuma mensagem ainda. Diga oi!</span></div>`;
  if(perto||box.dataset.init!=="1"){box.scrollTop=box.scrollHeight;box.dataset.init="1"}
}

/* ================= Ranking ================= */
function renderRanking(){
  if(S.mode!=="nuvem"){$("#main").innerHTML=bloqueado("Ranking");ligarBloqueado();return}
  const meus=meusGrupos(),gs=todosGrupos();
  let ids=Object.keys(S.soc.ranking);if(S.rankGrupo!=="todos")ids=ids.filter(id=>membrosDe(S.rankGrupo).includes(id));
  const val=S.rankTab==="hoje"?minHoje:min7;
  const lista=ids.map(id=>({id,m:val(id)})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m);
  const minha=lista.findIndex(x=>x.id===S.uid);
  $("#main").innerHTML=`<div class="page">
    ${pageHead("Ranking",S.rankTab==="hoje"?"Horas estudadas hoje, registradas pelo pomodoro. Zera à meia-noite.":"Horas estudadas nos últimos 7 dias.",
      `<div class="seg" role="group">${[["hoje","Hoje"],["semana","7 dias"]].map(([k,n])=>`<button type="button" data-rt="${k}" class="${S.rankTab===k?"on":""}">${n}</button>`).join("")}</div>
       <select id="rk-g" style="width:auto"><option value="todos">Todos os estudantes</option>${meus.filter(g=>gs[g]).map(g=>`<option value="${g}" ${S.rankGrupo===g?"selected":""}>${esc(gs[g].nome)}</option>`).join("")}</select>`)}
    ${lista.length?`
    <div class="podium">${lista.slice(0,3).map((x,i)=>`<div class="card">${avatar(x.id,"lg")}<span class="eyebrow">${i+1}º lugar</span><b style="overflow-wrap:anywhere">${esc(nomeDe(x.id))}</b><span class="mono" style="font-size:1.3rem;font-weight:600">${fmtH(x.m)}</span></div>`).join("")}</div>
    <div class="card"><div class="card-h"><h3>Classificação</h3><span class="small muted">${minha>=0?`Você está em ${minha+1}º`:"Você ainda não pontuou neste período"}</span></div>
      <div class="list">${lista.map((x,i)=>`<div class="li ${x.id===S.uid?"me-row":""}"><span class="pos">${i+1}</span><div class="row" style="flex-wrap:nowrap;min-width:0">${avatar(x.id)}<div style="min-width:0"><div class="nm">${esc(nomeDe(x.id))}</div><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((S.soc.perfis[x.id]||{}).objetivo||"")}</div></div></div><span class="mono">${fmtH(x.m)}</span></div>`).join("")}</div></div>`
    :`<div class="empty-state">${ico("trophy")}<b>Ninguém pontuou ainda</b><span>Conclua uma sessão de foco no pomodoro para entrar no ranking.</span><button class="btn primary" type="button" data-link="pomodoro">Abrir pomodoro</button></div>`}
  </div>`;
  $$("[data-rt]").forEach(b=>b.onclick=()=>{S.rankTab=b.dataset.rt;renderRanking()});
  $("#rk-g").onchange=e=>{S.rankGrupo=e.target.value;renderRanking()};
  $$("[data-link]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.link)}));
}

/* ================= Perfil ================= */
function renderPerfil(){
  const nuvem=S.mode==="nuvem",pub=S.pub||{};
  const total=Object.values(S.pomoLog.dias).reduce((a,d)=>a+d.min,0);
  $("#main").innerHTML=`<div class="page" style="max-width:860px">
    ${pageHead("Meu perfil",nuvem?"Nome, foto e bio aparecem para os outros estudantes no chat, nos grupos e no ranking.":"Como visitante, seu perfil fica só neste navegador.")}
    <form class="card stack" id="pf">
      <div class="row" style="gap:18px;align-items:center">
        <div id="pf-av">${nuvem?avatar(S.uid,"lg"):`<span class="avatar lg">${esc(((S.perfil.nome||"V")[0]).toUpperCase())}</span>`}</div>
        ${nuvem?`<div class="stack sm"><div class="row"><label class="btn sm" for="pf-foto">Trocar foto</label><button class="btn sm ghost" type="button" id="pf-rm" ${pub.foto?"":"hidden"}>Remover</button></div><input type="file" id="pf-foto" accept="image/*" hidden><span class="hint">A foto é reduzida para 160×160 antes de salvar.</span></div>`:""}
      </div>
      <div class="grid2">
        <div class="field"><label for="pf-nome">Nome de exibição</label><input type="text" id="pf-nome" maxlength="40" value="${esc(nuvem?(pub.nome||S.perfil.nome):S.perfil.nome)}" required></div>
        <div class="field"><label for="pf-obj">Objetivo</label><input type="text" id="pf-obj" maxlength="80" value="${esc(pub.objetivo||descObjetivo(S.perfil))}"></div>
      </div>
      ${nuvem?`<div class="field"><label for="pf-bio">Bio</label><textarea id="pf-bio" maxlength="160" placeholder="Ex.: 3º ano, quero passar na EsPCEx. Estudo melhor de manhã.">${esc(pub.bio||"")}</textarea></div>`:""}
      <div class="row"><button class="btn primary" type="submit">Salvar perfil</button><span class="hint" id="pf-st"></span></div>
    </form>
    <div class="stats" style="margin-top:16px">
      <div class="stat"><div class="eyebrow">Tempo total</div><div class="v">${fmtH(total)}</div></div>
      <div class="stat"><div class="eyebrow">Sessões</div><div class="v">${S.pomoLog.sessoes||0}</div></div>
      <div class="stat"><div class="eyebrow">Sequência</div><div class="v">${sequencia()}</div><div class="s">dias</div></div>
      <div class="stat"><div class="eyebrow">Grupos</div><div class="v">${nuvem?meusGrupos().length:"—"}</div></div>
    </div>
  </div>`;
  let foto=pub.foto||"";
  if(nuvem){
    $("#pf-foto").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{foto=await reduzirFoto(f);$("#pf-av").innerHTML=`<img class="avatar lg" src="${foto}" alt="">`;$("#pf-rm").hidden=false;$("#pf-st").textContent="Foto pronta. Clique em Salvar perfil."}catch(err){toast("Não consegui abrir essa imagem.")}};
    $("#pf-rm").onclick=()=>{foto="";$("#pf-av").innerHTML=`<span class="avatar lg">${esc((($("#pf-nome").value||"?")[0]).toUpperCase())}</span>`;$("#pf-rm").hidden=true};
  }
  $("#pf").addEventListener("submit",async e=>{e.preventDefault();const nome=$("#pf-nome").value.trim();if(!nome){$("#pf-nome").focus();return}
    S.perfil.nome=nome;gravar("perfil",S.perfil);
    if(nuvem){const d={...(S.pub||{}),nome,objetivo:$("#pf-obj").value.trim(),bio:$("#pf-bio").value.trim(),foto,atualizado:Date.now()};if(!d.desde)d.desde=Date.now();
      if(await gravarPub("perfis",d)){S.soc.perfis[S.uid]=d;S.pub=d;toast("Perfil salvo na nuvem.")}}
    else toast("Perfil salvo neste navegador.");
    renderSideUser();
  });
}
function reduzirFoto(file){return new Promise((ok,no)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=160,c=document.createElement("canvas");c.width=c.height=s;const x=c.getContext("2d");const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.82))};img.onerror=no;img.src=url})}

/* ================= Configurações ================= */
function renderConfig(){
  $("#main").innerHTML=`<div class="page" style="max-width:860px">
    ${pageHead("Configurações")}
    <div class="stack">
      <div class="card row" style="justify-content:space-between"><div><h3>Aparência</h3><p class="small muted">Tema atual: ${temaAtual()==="dark"?"preto":"branco"}</p></div>
        <div class="seg" role="group"><button type="button" data-tm="light" class="${temaAtual()==="light"?"on":""}">Branco</button><button type="button" data-tm="dark" class="${temaAtual()==="dark"?"on":""}">Preto</button></div></div>
      <div class="card row" style="justify-content:space-between"><div><h3>Suas respostas</h3><p class="small muted">${esc(descObjetivo(S.perfil))} · ${S.perfil.materias.length} matérias · ${fmtH(DIAS.reduce((a,x)=>a+(+S.perfil.horas[x.k]||0),0)*60)} por semana</p></div>
        <button class="btn" type="button" id="cf-tri">Refazer triagem</button></div>
      <div class="card row" style="justify-content:space-between"><div><h3>Armazenamento</h3><p class="small muted">${S.mode==="nuvem"?"Seus dados estão salvos na nuvem, ligados à sua conta.":"Seus dados estão só neste navegador. Entre com a conta para salvar na nuvem."}</p></div>
        <span class="pill ${S.mode==="nuvem"?"solid":""}"><span class="dot"></span>${S.mode==="nuvem"?"Nuvem":"Local"}</span></div>
      <div class="card"><details><summary>Ver o prompt que a IA recebe para montar a semana</summary><pre class="prompt">${esc(montarPrompt(S.perfil,{prova:S.plano&&S.plano.prova?provaCtx():null}))}</pre></details></div>
      <div class="card"><details><summary>Ver o prompt usado para ler editais</summary><pre class="prompt">${esc(promptEditalTrecho("[trecho do edital]",0,1))}</pre></details></div>
    </div></div>`;
  $$("[data-tm]").forEach(b=>b.onclick=()=>{if(temaAtual()!==b.dataset.tm)trocarTema();renderConfig()});
  $("#cf-tri").onclick=()=>{S.step=0;S.draft=migrar(clone(S.perfil));renderWizard();scrollTo(0,0)};
}

renderLogin();
})();
</script>
</body></html>
