/* ================= Validação de planos ================= */
function normalizarPlano(raw,nomesValidos){
  if(!raw||typeof raw!=="object")return null;
  let sem=raw.semana;
  if(Array.isArray(sem)){const o={};sem.forEach((d,i)=>{const k=norm(d&&d.dia||DIAS[i]&&DIAS[i].k).slice(0,3);o[k]=d.blocos||[]});sem=o}
  if(!sem||typeof sem!=="object")return null;
  const out={};let total=0;
  DIAS.forEach(x=>{
    out[x.k]=(Array.isArray(sem[x.k])?sem[x.k]:[]).map(b=>{
      const i=toMin(b.inicio),f=toMin(b.fim);if(i==null||f==null||f<=i)return null;
      let tipo=norm(b.tipo||"teoria");tipo=tipo.startsWith("exerc")?"exercícios":tipo.startsWith("revis")?"revisão":tipo.startsWith("simul")?"simulado":"teoria";
      const ok=nomesValidos.find(n=>norm(n)===norm(b.materia));
      return {id:uid(),inicio:toHHMM(i),fim:toHHMM(f),min:f-i,materia:ok||String(b.materia||"Estudo").slice(0,60),tipo,tarefa:String(b.tarefa||"").slice(0,180),feito:false};
    }).filter(Boolean).sort((a,b)=>toMin(a.inicio)-toMin(b.inicio));
    total+=out[x.k].length;
  });
  if(!total)return null;
  return {resumo:String(raw.resumo||""),semana:out,dicas:Array.isArray(raw.dicas)?raw.dicas.slice(0,6).map(String):[]};
}

/* ================= Algoritmo local (sem IA) ================= */
function planoLocal(p,prova){
  let mats=p.materias.map(m=>({nome:m.nome,dif:m.dif,peso:m.dif*(PRIO[m.prio]||1),tops:null}));
  if(prova){
    const {ed,tri}=prova,pct=tri.pct/100;
    const ex=ed.materias.filter(m=>!(tri.mats[m.id]||{}).fora).map(m=>{const dom=(tri.mats[m.id]||{dom:3}).dom;return {nome:m.nome,dif:6-dom,peso:(6-dom)*(1+(m.questoes||8)/20),tops:m.topicos.filter(t=>!t.feito).map(t=>t.t)}});
    mats=mats.filter(m=>!ex.some(e=>norm(e.nome)===norm(m.nome)));
    const sb=mats.reduce((a,m)=>a+m.peso,0)||1,se=ex.reduce((a,m)=>a+m.peso,0)||1;
    mats=pct>=1?ex:mats.map(m=>({...m,peso:m.peso/sb*(1-pct)})).concat(ex.map(m=>({...m,peso:m.peso/se*pct})));
  }
  if(!mats.length)mats=[{nome:"Estudo livre",dif:3,peso:1,tops:null}];
  mats.forEach((m,i)=>m.id=i);
  const somaPeso=mats.reduce((a,m)=>a+m.peso,0);
  const slots={};let totalSlots=0;
  DIAS.forEach(x=>{const min=Math.round((+p.horas[x.k]||0)*60);const n=Math.floor((min+p.pausa)/(p.bloco+p.pausa));const resto=min-(n*(p.bloco+p.pausa)-p.pausa);
    slots[x.k]={n,curto:n>0&&resto>=20+p.pausa?resto-p.pausa:(n===0&&min>=20?min:0)};totalSlots+=n});
  const alvo={},usados={},cont={},ptr={};mats.forEach(m=>{alvo[m.id]=somaPeso?m.peso/somaPeso*totalSlots:0;usados[m.id]=0;cont[m.id]=0;ptr[m.id]=0});
  const comProva=!!prova||p.temProva;const met=p.metodos||[];
  const tarefa=(m,t)=>{
    if(m.tops&&m.tops.length){const top=m.tops[ptr[m.id]%m.tops.length];
      if(t==="teoria"){ptr[m.id]++;return "Teoria: "+top}
      if(t==="exercícios")return "Questões sobre: "+m.tops[Math.max(0,ptr[m.id]-1)%m.tops.length];
      if(t==="revisão")return "Revisar: "+m.tops[Math.max(0,ptr[m.id]-1)%m.tops.length]}
    if(t==="teoria")return met.includes("videoaulas")?`Assistir aula de um tópico novo de ${m.nome} e anotar os pontos-chave`:met.includes("mapas")?`Estudar um tópico novo de ${m.nome} e montar um mapa mental`:`Estudar um tópico novo de ${m.nome} e fazer um resumo de 1 página`;
    if(t==="exercícios")return `Resolver 15–20 questões de ${m.nome} e refazer as que errou`;
    if(t==="revisão")return met.includes("flashcards")?`Revisar ${m.nome} com flashcards do que viu nos últimos dias`:`Revisar o resumo de ${m.nome} e responder de memória 5 perguntas`;
    return "Simulado cronometrado com questões das matérias da semana";
  };
  const semana={};
  DIAS.forEach((x,di)=>{
    const {n,curto}=slots[x.k];let t=toMin(p.inicio[x.k]);if(t==null)t=19*60;const sel=[];let ult=null;
    for(let s=0;s<n;s++){const c=mats.filter(m=>mats.length===1||m.id!==ult).sort((a,b)=>(alvo[b.id]-usados[b.id])-(alvo[a.id]-usados[a.id])||b.dif-a.dif)[0];usados[c.id]++;ult=c.id;sel.push(c)}
    sel.sort((a,b)=>b.dif-a.dif);
    for(let i=1;i<sel.length;i++){if(sel[i].id===sel[i-1].id){const j=sel.findIndex((e,k)=>k>i&&e.id!==sel[i].id);if(j>0)[sel[i],sel[j]]=[sel[j],sel[i]]}}
    const lista=[];
    sel.forEach((m,i)=>{
      let tipo;
      if(comProva&&di>=5&&n>=3&&i===n-1)tipo="simulado";
      else{const ciclo=m.dif>=4?["teoria","exercícios","exercícios","revisão"]:["teoria","exercícios","revisão"];tipo=ciclo[cont[m.id]%ciclo.length];cont[m.id]++}
      lista.push({id:uid(),inicio:toHHMM(t),fim:toHHMM(t+p.bloco),min:+p.bloco,materia:tipo==="simulado"?"Simulado geral":m.nome,tipo,tarefa:tarefa(m,tipo),feito:false});
      t+=+p.bloco+ +p.pausa;
    });
    if(curto){const m=mats.slice().sort((a,b)=>b.dif-a.dif)[di%mats.length];lista.push({id:uid(),inicio:toHHMM(t),fim:toHHMM(t+curto),min:curto,materia:m.nome,tipo:"revisão",tarefa:tarefa(m,"revisão"),feito:false})}
    semana[x.k]=lista;

function garantirTotais(L){ // totais de todo o tempo, que não se perdem quando os dias antigos são apagados

let actx=null;

   O som é um arquivo de áudio tocado como mídia (usa o volume de mídia e funciona com o iPhone no silencioso).
   O navegador só deixa tocar som depois de um toque: o arquivo é "destravado" quando a pessoa aperta Iniciar.
   Enquanto o pomodoro corre, um áudio inaudível fica tocando para o navegador não congelar o app em segundo plano. */
const ALARME={tocando:false,vib:null,fimAuto:null,el:null,mudo:null,destravado:false};
const ALARME_SEG=90; // toca por até 1 min 30 s se ninguém parar
function wavURL(n,taxa,f){const buf=new ArrayBuffer(44+n*2),v=new DataView(buf),txt=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  txt(0,"RIFF");v.setUint32(4,36+n*2,true);txt(8,"WAVE");txt(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,taxa,true);v.setUint32(28,taxa*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);txt(36,"data");v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,f(i/taxa)))*32767,true);

function criarSons(){if(ALARME.el)return;const taxa=22050;
  // bip-bip-bip (si, ré, si) a cada 1,6 s
  const bip=(t,ini,fr)=>{const x=t-ini;if(x<0||x>.17)return 0;const env=Math.min(1,x/.01)*Math.min(1,(.17-x)/.03);return env*(.62*Math.sin(2*Math.PI*fr*x)+.22*Math.sin(2*Math.PI*fr*3*x)+.1*Math.sin(2*Math.PI*fr*5*x))};
  ALARME.el=new Audio(wavURL(Math.round(1.6*taxa),taxa,t=>bip(t,0,988)+bip(t,.2,1175)+bip(t,.4,988)));ALARME.el.loop=true;ALARME.el.preload="auto";
  ALARME.mudo=new Audio(wavURL(taxa,8000,t=>Math.sin(2*Math.PI*30*t)*.0004));ALARME.mudo.loop=true;ALARME.mudo.preload="auto";
  try{ALARME.el.setAttribute("playsinline","");ALARME.mudo.setAttribute("playsinline","")}catch(e){}}

function bipWebAudio(){ // reserva, caso o navegador recuse o arquivo de áudio

/* ================= Ranking: publicação e "estudando agora" ================= */
function agoraEstudando(){
  if(C.rodando)return {desde:C.inicio-C.acum,materia:C.materia||"",modo:"cronometro"};
  if(P.rodando&&P.modo==="foco")return {desde:P.iniciadoEm-(P.acumulado||0),materia:P.materia||"",modo:"pomodoro"};
  return null;
}
function publicarRanking(){
  if(S.mode!=="nuvem"||!S.pomoLog||(FBM()&&!S.rankOk))return Promise.resolve();
  const L=garantirTotais(S.pomoLog),loc=docRankingLocal(),hoje=dataISO(),agora=Date.now();
  const prev=S.soc.ranking[S.uid];let total=Math.round(L.tot.min*100)/100,hojeMin=Math.min(LIMITE_DIA,Math.round(((L.dias[hoje]||{}).min||0)*100)/100);
  if(prev&&typeof prev.total==="number"){const folga=(agora-tsMs(prev.ref!=null?prev.ref:prev.atualizado))/60000+4;total=Math.max(prev.total,Math.min(total,Math.round((prev.total+folga)*100)/100));
    if(prev.hojeData===hoje&&typeof prev.hojeMin==="number")hojeMin=Math.min(hojeMin,Math.round((prev.hojeMin+(total-prev.total)+0.5)*100)/100)}
  else total=Math.min(total,700);
  let per=null;
  if(FBM()){ // início do dia, da semana e do mês (horário de Brasília), conferidos pelas regras do servidor
    const p=periodosBR(),base=c=>prev&&typeof prev.total==="number"?(prev[c]===p[c]&&typeof prev[c+"Base"]==="number"?prev[c+"Base"]:prev.total):0;
    per={...p,diaBase:base("dia"),semanaBase:base("semana"),mesBase:base("mes")};
    total=Math.min(total,per.diaBase+LIMITE_DIA);if(prev&&typeof prev.total==="number")total=Math.max(total,prev.total);
    hojeMin=Math.max(0,Math.min(hojeMin,Math.floor((total-per.diaBase)*100)/100))}
  const mudou=!prev||prev.total!==total;
  const doc={dias:loc.dias,total,hojeData:hoje,hojeMin,ult:loc.ult,agora:agoraEstudando(),...(per||{})};
  S.soc.ranking[S.uid]={...(prev||{}),...doc,atualizado:agora,ref:mudou?agora:(prev&&(prev.ref!=null?prev.ref:prev.atualizado))};
  if(FBM()){const SV=firebase.firestore.FieldValue.serverTimestamp();const env={...doc,atualizado:SV};if(mudou)env.ref=SV;
    S.envioRank=Date.now();return S.db.collection("ranking").doc(S.uid).set(env,{merge:true}).catch(e=>console.warn("ranking",e&&e.code))}
  return gravarPub("ranking",{...doc,atualizado:agora});
}
const estudandoAgora=id=>{const r=S.soc.ranking[id];const a=r&&r.agora;return a&&a.desde&&Date.now()-a.desde<8*3600e3?a:null};
const ponto=id=>estudandoAgora(id)?`<span title="Estudando agora" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle"></span>`:"";
function minPeriodo(id,dias){const r=S.soc.ranking[id];if(!r||!r.dias)return 0;let s=0;for(let i=0;i<dias;i++)s+=Math.min(LIMITE_DIA,r.dias[diasAtras(i)]||0);
  if(dias===1&&r.hojeData)s=r.hojeData===dataISO()?Math.min(LIMITE_DIA,r.hojeMin||0):0;if(typeof r.total==="number")s=Math.min(s,r.total);
  const a=estudandoAgora(id);if(a)s+=Math.min(480,Math.max(0,(Date.now()-a.desde)/60000));return s}
const visivelRanking=id=>{const p=S.soc.perfis[id];return !(p&&p.privacidade&&p.privacidade.ranking===false)};
const minTotalR=id=>{const r=S.soc.ranking[id];const a=estudandoAgora(id);return (r&&r.total||0)+(a?Math.min(480,(Date.now()-a.desde)/60000):0)};

/* ================= Revisões programadas (1, 7 e 30 dias) ================= */
const ETAPAS=[1,7,30];
function revisoesPendentes(){const hoje=dataISO();return ((S.revisoes&&S.revisoes.itens)||[]).filter(r=>!r.feita&&r.quando<=hoje).sort((a,b)=>a.quando<b.quando?-1:1)}
function revisoesProximas(dias){const lim=(()=>{const d=new Date();d.setDate(d.getDate()+dias);return dataISO(d)})(),hoje=dataISO();
  return ((S.revisoes&&S.revisoes.itens)||[]).filter(r=>!r.feita&&r.quando>hoje&&r.quando<=lim).sort((a,b)=>a.quando<b.quando?-1:1)}
function agendarRevisoes(assunto,materia){
  S.revisoes=S.revisoes&&S.revisoes.itens?S.revisoes:{itens:[]};const base=new Date();
  ETAPAS.forEach(n=>{const d=new Date(base);d.setDate(d.getDate()+n);S.revisoes.itens.push({id:uid(),assunto:assunto.slice(0,140),materia:materia||"",etapa:n,quando:dataISO(d),feita:false,criado:Date.now()})});
  S.revisoes.itens=S.revisoes.itens.filter(r=>!r.feita||Date.now()-(r.feitaEm||0)<60*864e5).slice(-400);
  gravar("revisoes",S.revisoes,true);
}
function marcarRevisao(id,v){const r=((S.revisoes&&S.revisoes.itens)||[]).find(x=>x.id===id);if(!r)return;r.feita=v;r.feitaEm=v?Date.now():0;gravar("revisoes",S.revisoes);verificarConquistas();atualizarBadgeDesafios()}
function revisaoLinha(r){const atras=r.quando<dataISO();return `<label class="li" style="grid-template-columns:auto minmax(0,1fr) auto;cursor:pointer"><input class="chk" type="checkbox" data-rev="${r.id}" ${r.feita?"checked":""}>
  <div style="min-width:0"><div class="nm">${esc(r.assunto)}</div><div class="small muted">${esc(r.materia||"Sem matéria")} · revisão de ${r.etapa} ${r.etapa===1?"dia":"dias"}</div></div>
  <span class="pill ${atras?"solid":""}">${atras?"atrasada":r.quando===dataISO()?"hoje":new Date(r.quando+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</span></label>`}
function ligarRevisoes(depois){$$("[data-rev]").forEach(c=>c.addEventListener("change",()=>{marcarRevisao(c.dataset.rev,c.checked);if(c.checked)toast("Revisão concluída.");if(depois)setTimeout(depois,250)}))}

function anelMeta(feito,meta){const p=Math.min(1,meta?feito/meta:0),L=2*Math.PI*30;
  return `<svg viewBox="0 0 72 72" width="72" height="72" aria-hidden="true" style="transform:rotate(-90deg);flex:none"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="36" cy="36" r="30" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p)}"/></svg>`}
function recordeSequencia(){const L=S.pomoLog;if(!L)return 0;const ds=Object.keys(L.dias).filter(d=>L.dias[d].min>0).sort();let best=0,cur=0,prev=null;
  ds.forEach(d=>{if(prev){const a=new Date(prev+"T12:00"),b=new Date(d+"T12:00");cur=Math.round((b-a)/864e5)===1?cur+1:1}else cur=1;best=Math.max(best,cur);prev=d});return best}

function assinarSocial(){
  (FBM()?["perfis","ranking","conquistas"]:["perfis","ranking","msgs","grupos","membros"]).forEach(col=>{
    try{S.unsub.push(S.db.collection(col).limit(1000).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(v)m[d.id]=v});
      if(col==="ranking"&&FBM()){S.rankOk=true;const eu=m[S.uid];if(eu&&eu.atualizado&&typeof eu.atualizado.toMillis==="function"&&S.envioRank&&Date.now()-S.envioRank<20000){S.dt=eu.atualizado.toMillis()-S.envioRank;S.envioRank=0}}
      if(col==="perfis"||col==="conquistas"){const prim=col==="perfis"&&!S.pubOk;if(col==="perfis"){S.soc.perfisBrutos=m;S.pubOk=true}else{S.soc.conquistas=m;S.soc.conquistasOk=true}
        const b=S.soc.perfisBrutos||{},v={};Object.keys(b).forEach(id=>v[id]=perfilVerificado(id,b[id]));S.soc.perfis=v;S.pub=v[S.uid]||null;atualizarSocial("perfis");
        if(prim)perfilCarregado();return}
      S.soc[col]=m;if(col==="perfis"){S.pubOk=true}atualizarSocial(col)},()=>{}))}catch(e){}
  });
}

  inp.addEventListener("paste",e=>{const fs=[...(e.clipboardData&&e.clipboardData.files||[])];if(fs.length){e.preventDefault();enviar(fs)}});
  if(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    const mic=document.createElement("button");mic.type="button";mic.className="btn icon ghost chat-mic";mic.title="Gravar áudio";mic.setAttribute("aria-label","Gravar áudio");mic.innerHTML=ico("mic");
    f.insertBefore(mic,f.querySelector("button[type=submit]"));mic.onclick=()=>gravarAudio(f,fs=>enviar(fs))}

// gravação de áudio: até 5 minutos; aparece uma barra no lugar da caixa de texto
const AUD={rec:null};
async function gravarAudio(f,enviar){
  if(AUD.rec)return;let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast("Permita o uso do microfone para gravar áudio.");return}
  const tipo=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  let rec;try{rec=new MediaRecorder(stream,tipo?{mimeType:tipo,audioBitsPerSecond:48000}:{})}catch(e){stream.getTracks().forEach(t=>t.stop());toast("Seu navegador não grava áudio.");return}
  const partes=[],t0=Date.now();let cancelado=false;AUD.rec=rec;
  const barra=document.createElement("div");barra.className="rec-barra";barra.setAttribute("role","status");
  barra.innerHTML=`<button type="button" class="btn icon ghost" data-rec="x" title="Cancelar" aria-label="Cancelar gravação">${ico("lixo")}</button><span class="rec-ponto" aria-hidden="true"></span><span class="mono" data-rec-t>0:00</span><span class="small muted rec-dica">Gravando… máximo 5 min</span><button type="button" class="btn primary sm" data-rec="ok">${ico("send")}Enviar</button>`;
  f.classList.add("gravando");f.appendChild(barra);
  const tick=setInterval(()=>{const s=(Date.now()-t0)/1000;barra.querySelector("[data-rec-t]").textContent=durTxt(s);if(s>=300)fim(false)},250);
  rec.ondataavailable=e=>{if(e.data&&e.data.size)partes.push(e.data)};
  rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(tick);barra.remove();f.classList.remove("gravando");AUD.rec=null;
    const dur=Math.round((Date.now()-t0)/1000);if(cancelado||!partes.length)return;if(dur<1){toast("Áudio curto demais.");return}
    const mime=(rec.mimeType||tipo||"audio/webm").split(";")[0],ext=mime.includes("mp4")?"m4a":mime.includes("ogg")?"ogg":"webm";
    const d=new Date(),file=new File(partes,`Áudio ${String(d.getHours()).padStart(2,"0")}h${String(d.getMinutes()).padStart(2,"0")}.${ext}`,{type:mime});file._audio=dur;enviar([file])};
  function fim(cancelar){cancelado=cancelar;if(rec.state!=="inactive")rec.stop()}
  barra.querySelector('[data-rec="x"]').onclick=()=>fim(true);barra.querySelector('[data-rec="ok"]').onclick=()=>fim(false);
  rec.start(1000);
}

const tamanhoTxt=n=>n>=1048576?(n/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(n/1024))+" KB";
const PARTE=640*1024,MAX_ARQ=50*1024*1024,MAX_ARQ_TXT="50 MB",MAX_ARQ_GLOBAL=20*1024*1024;
function blobB64(b){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=no;r.readAsDataURL(b)})}
// envia o arquivo em partes (4 ao mesmo tempo) para grupos/{id}/arquivos; devolve os dados do arquivo ou null
async function enviarArquivoFB(base,file,prog){
  const box=$("#g-up");if(file.size>MAX_ARQ){toast(`“${file.name}” passa de ${MAX_ARQ_TXT}.`);return null}
  if(!file.size){toast(`“${file.name}” está vazio.`);return null}
  const n=Math.max(1,Math.ceil(file.size/PARTE));const ref=base.collection("arquivos").doc();
  const pr=prog||(p=>{if(box&&box.isConnected)box.innerHTML=`<div class="card flat stack sm"><div class="row small"><span class="spinner"></span>Enviando ${esc(file.name)}… ${p}%</div><div class="prog"><i style="width:${p}%"></i></div></div>`});
  const info={id:ref.id,nome:file.name.slice(0,140),tipo:(file.type||"application/octet-stream").slice(0,100),tamanho:file.size};
  try{pr(0);await ref.set({nome:info.nome,tipo:info.tipo,tamanho:file.size,autor:S.uid,em:Date.now(),partes:n,completo:false});
    let prox=0,feitas=0;const trab=async()=>{while(prox<n){const i=prox++;await ref.collection("partes").doc(String(i).padStart(4,"0")).set({i,d:await blobB64(file.slice(i*PARTE,(i+1)*PARTE))});feitas++;pr(Math.round(feitas/n*100))}};
    await Promise.all(Array.from({length:Math.min(4,n)},trab));
    await ref.update({completo:true});if(!prog&&box)box.innerHTML="";return info}
  catch(e){if(!prog&&box)box.innerHTML="";toast("Falha ao enviar o arquivo ("+(e&&e.code||"erro")+").");try{await apagarArquivoFB(base,ref.id,true)}catch(_){}return null}
}
// envia arquivos pelo chat: aparecem como mensagem e também na aba Arquivos
async function enviarArquivosChat(base,files,op){

  const box=op.box||$("#gchat-up");
  if(op.max)files=files.filter(f=>{if(f.size>op.max){toast(`“${f.name}” passa de ${tamanhoTxt(op.max)} (limite deste chat).`);return false}return true});
  if(files.length&&op.antes){try{await op.antes(files)}catch(e){toast("Não foi possível enviar ("+(e&&e.code||"erro")+").");return}}
  for(const f of files){
    const el=document.createElement("div");el.className="msg mine arq-enviando";el.innerHTML=`${avatar(S.uid)}<div style="min-width:0"><div class="h"><b>Você</b><time>enviando…</time></div><div class="arq-msg"><span class="arq-ic">${ico("upload")}</span><div style="min-width:0;flex:1"><div class="nm">${esc(f.name)}</div><div class="small muted">${tamanhoTxt(f.size)} · <span data-p>0%</span></div><div class="prog" style="margin-top:6px"><i style="width:0%"></i></div></div></div></div>`;
    if(box)box.appendChild(el);

  }
}
// cache de prévias de imagem enviadas no chat
const PREVIAS={};

const baseArq=p=>S.db.doc(p.includes("/")?p:"grupos/"+p);
async function blobArquivo(p,id,tipo){const base=baseArq(p);const snap=await base.collection("arquivos").doc(id).collection("partes").orderBy("i").get();
  if(snap.empty)throw {code:"apagado"};
  return new Blob(snap.docs.map(d=>{const bin=atob(d.data().d);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}),{type:tipo||"application/octet-stream"})}
const ehAudio=a=>/^audio\//i.test(a.tipo||"")||!!a.audio;
const durTxt=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
function arqMsgHtml(m,gid){const a=m.arq||{};const img=/^image\/(png|jpe?g|gif|webp)$/i.test(a.tipo||"")&&a.tamanho<=4*1024*1024;
  if(ehAudio(a)&&a.tamanho<=8*1024*1024)return `<div class="arq-msg arq-audio" data-arq="${esc(a.id||"")}" data-arq-g="${esc(gid||"")}" data-arq-tipo="${esc(a.tipo||"")}" data-arq-nome="${esc(a.nome||"audio")}">
    <span class="arq-ic">${ico("mic")}</span><div class="arq-player" style="min-width:0;flex:1">${PREVIAS[a.id]?`<audio controls preload="metadata" src="${PREVIAS[a.id]}" onloadedmetadata="if(this.duration===Infinity){this.ontimeupdate=()=>{this.ontimeupdate=null;this.currentTime=0};this.currentTime=1e101}"></audio>`:`<div class="row small muted" style="gap:6px"><span class="spinner"></span>Áudio${a.audio>0?" · "+durTxt(a.audio):""}</div>`}</div></div>`;
  return `<div class="arq-msg" data-arq="${esc(a.id||"")}" data-arq-g="${esc(gid||"")}" data-arq-tipo="${esc(a.tipo||"")}" data-arq-nome="${esc(a.nome||"arquivo")}">
    ${img?`<button type="button" class="arq-img" data-arq-ver aria-label="Abrir ${esc(a.nome||"imagem")}">${PREVIAS[a.id]?`<img src="${PREVIAS[a.id]}" alt="">`:`<span class="spinner"></span>`}</button>`:`<span class="arq-ic">${ico("file")}</span>`}
    <div style="min-width:0;flex:1"><div class="nm">${esc(a.nome||"arquivo")}</div><div class="small muted">${tamanhoTxt(+a.tamanho||0)}</div></div>
    <button class="btn sm" type="button" data-arq-baixar>Baixar</button></div>`}
// áudio gravado no navegador (webm) vem sem duração: força o cálculo para a barra do player funcionar
function audioDuracao(au){if(!au)return;au.addEventListener("loadedmetadata",()=>{if(au.duration!==Infinity)return;const volta=()=>{au.removeEventListener("timeupdate",volta);au.currentTime=0};au.addEventListener("timeupdate",volta);au.currentTime=1e101},{once:true})}
function carregarPrevias(box){if(!box)return;
  $$(".arq-audio",box).forEach(async w=>{const id=w.dataset.arq,pl=w.querySelector(".arq-player");if(!id||!pl||pl.querySelector("audio")||w.dataset.carregando)return;w.dataset.carregando="1";
    try{if(!PREVIAS[id])PREVIAS[id]=URL.createObjectURL(await blobArquivo(w.dataset.arqG,id,w.dataset.arqTipo));if(pl.isConnected){pl.innerHTML=`<audio controls preload="metadata" src="${PREVIAS[id]}"></audio>`;audioDuracao(pl.querySelector("audio"))}}
    catch(e){if(pl.isConnected)pl.innerHTML=`<span class="small muted">Áudio indisponível.</span>`}});
  $$(".arq-img",box).forEach(async b=>{const w=b.closest("[data-arq]");const id=w.dataset.arq;if(!id||b.querySelector("img")||b.dataset.carregando)return;b.dataset.carregando="1";
  try{if(!PREVIAS[id])PREVIAS[id]=URL.createObjectURL(await blobArquivo(w.dataset.arqG,id,w.dataset.arqTipo));if(b.isConnected)b.innerHTML=`<img src="${PREVIAS[id]}" alt="">`}
  catch(e){if(b.isConnected){b.replaceWith(Object.assign(document.createElement("span"),{className:"arq-ic",innerHTML:ico("file")}))}}})}
document.addEventListener("click",async e=>{const bt=e.target.closest("[data-arq-baixar],[data-arq-ver]");if(!bt)return;const w=bt.closest("[data-arq]");if(!w||!w.dataset.arq||!S.db)return;e.stopPropagation();
  if(bt.hasAttribute("data-arq-ver")&&PREVIAS[w.dataset.arq]){window.open(PREVIAS[w.dataset.arq],"_blank","noopener");return}
  const txt=bt.textContent;bt.disabled=true;if(bt.matches("[data-arq-baixar]"))bt.textContent="Baixando…";
  try{const blob=await blobArquivo(w.dataset.arqG,w.dataset.arq,w.dataset.arqTipo);const url=URL.createObjectURL(blob);const l=document.createElement("a");l.href=url;l.download=w.dataset.arqNome;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  catch(err){toast(err&&err.code==="apagado"?"Este arquivo foi apagado.":"Não foi possível baixar ("+(err&&err.code||"erro")+").")}
  bt.disabled=false;if(bt.matches("[data-arq-baixar]"))bt.textContent=txt},true);
// arrastar e soltar arquivos em qualquer lugar da página do grupo
function ligarSoltarArquivos(area,enviar,txt){
  if(!area)return;let n=0;const ov=document.createElement("div");ov.className="soltar-ov";ov.hidden=true;ov.innerHTML=`<div>${ico("upload")}<b>${txt?txt[0]:"Solte para enviar ao grupo"}</b><span>${txt?txt[1]:`Até ${MAX_ARQ_TXT} por arquivo. Fica salvo na conversa e na aba Arquivos.`}</span></div>`;area.appendChild(ov);
  const temArq=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
  area.addEventListener("dragenter",e=>{if(!temArq(e))return;e.preventDefault();n++;ov.hidden=false});
  area.addEventListener("dragover",e=>{if(!temArq(e))return;e.preventDefault();e.dataTransfer.dropEffect="copy"});
  area.addEventListener("dragleave",e=>{if(!temArq(e))return;n=Math.max(0,n-1);if(!n)ov.hidden=true});
  area.addEventListener("drop",e=>{if(!temArq(e))return;e.preventDefault();n=0;ov.hidden=true;const fs=[...e.dataTransfer.files];if(fs.length)enviar(fs)});
}
async function baixarArquivoFB(base,a,btn){
  if(!a)return;const txt=btn.textContent;btn.disabled=true;btn.textContent="Baixando…";
  try{const snap=await base.collection("arquivos").doc(a.id).collection("partes").orderBy("i").get();
    const partes=snap.docs.map(d=>{const bin=atob(d.data().d);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u});
    const url=URL.createObjectURL(new Blob(partes,{type:a.tipo}));const l=document.createElement("a");l.href=url;l.download=a.nome;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  catch(e){toast("Não foi possível baixar ("+(e&&e.code||"erro")+").")}
  btn.disabled=false;btn.textContent=txt;
}
async function apagarArquivoFB(base,id,quieto){
  const ref=base.collection("arquivos").doc(id);
  try{const ps=await ref.collection("partes").get();for(const d of ps.docs)await d.ref.delete();await ref.delete();if(!quieto)toast("Arquivo apagado.")}
  catch(e){if(!quieto)toast("Não foi possível apagar ("+(e&&e.code||"erro")+").")}
}


/* ---- Presença: quem está online (cada aparelho avisa a cada minuto enquanto o site está aberto) ---- */
const PRES={dados:{},tick:null,ok:false,redesenho:null};
const mostraOnline=()=>!(S.pub&&S.pub.privacidade&&S.pub.privacidade.online===false);
function presencaEscrever(ativo){if(!FBM()||!S.uid)return;const on=mostraOnline();
  S.db.collection("presenca").doc(S.uid).set({visto:on?Date.now():0,ativo:on&&ativo}).catch(()=>{})}
function iniciarPresenca(){
  if(PRES.ok)return;PRES.ok=true;presencaEscrever(document.visibilityState==="visible");
  PRES.tick=setInterval(()=>{if(document.visibilityState==="visible")presencaEscrever(true)},60000);
  assinar("presenca",S.db.collection("presenca"),snap=>{snap.docChanges().forEach(c=>{if(c.type==="removed")delete PRES.dados[c.doc.id];else PRES.dados[c.doc.id]=c.doc.data()});
    $$("[data-online]").forEach(el=>{const st=statusOnline(el.dataset.online);el.className="on-dot "+st.k;el.title=st.t});
    if(S.view==="amigos"){clearTimeout(PRES.redesenho);PRES.redesenho=setTimeout(()=>{const a=document.activeElement;if(S.view==="amigos"&&!(a&&a.id==="am-busca"))renderAmigosFB()},400)}})}
function pararPresenca(){if(!PRES.ok)return;presencaEscrever(false);clearInterval(PRES.tick);PRES.ok=false;PRES.dados={}}
document.addEventListener("visibilitychange",()=>{if(PRES.ok)presencaEscrever(document.visibilityState==="visible")});
addEventListener("pagehide",()=>{if(PRES.ok)presencaEscrever(false)});
function tempoAtras(ms){const m=Math.round(ms/60000);if(m<60)return `há ${Math.max(1,m)} min`;const h=Math.round(m/60);if(h<24)return `há ${h} h`;const d=Math.round(h/24);return `há ${d} ${d===1?"dia":"dias"}`}
function statusOnline(id){if(id===S.uid)return mostraOnline()?{k:"on",t:"Online"}:{k:"off",t:"Invisível"};
  const p=PRES.dados[id];if(!p||!p.visto)return {k:"off",t:"Offline"};const dt=Date.now()-p.visto;
  if(p.ativo&&dt<150000)return {k:"on",t:"Online"};if(dt<150000)return {k:"aus",t:"Ausente (site em segundo plano)"};
  return {k:"off",t:"Offline · visto "+tempoAtras(dt)}}
const pontoOnline=id=>{const st=statusOnline(id);return `<span class="on-dot ${st.k}" data-online="${id}" title="${st.t}" aria-label="${st.t}"></span>`};

function renderAmigosFB(){
  const meus=new Set((S.pub&&S.pub.amigos)||[]);
  const todos=Object.entries(S.soc.perfis).filter(([id,p])=>id!==S.uid&&p&&p.nome);
  const q=norm(FBC.busca);
  const ordem=(a,b)=>{const o={on:0,aus:1,off:2};const sa=statusOnline(a[0]).k,sb=statusOnline(b[0]).k;return o[sa]-o[sb]||(PRES.dados[b[0]]||{}).visto-(PRES.dados[a[0]]||{}).visto||String(a[1].nome).localeCompare(b[1].nome)};
  const podeDM=p=>!((p.privacidade||{}).dm==="amigos"&&!(p.amigos||[]).includes(S.uid));
  const linha=([id,p])=>{const st=statusOnline(id);return `<div class="li amigo-li" data-perfil="${id}" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="av-on">${avatar(id)}${pontoOnline(id)}</span><div style="min-width:0"><div class="nm">${esc(p.nome)}${ponto(id)}</div><div class="small ${st.k==="on"?"txt-on":"muted"}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${estudandoAgora(id)?"Estudando agora":esc(st.t)}${p.objetivo?` · <span class="muted">${esc(p.objetivo)}</span>`:""}</div></div>
    <div class="row" style="flex-wrap:nowrap;gap:6px">${meus.has(id)?"":`<button class="btn sm primary" type="button" data-amigo="${id}">Adicionar</button>`}<button class="btn sm" type="button" data-dm="${id}" ${podeDM(p)?"":'disabled title="Só recebe mensagens de amigos"'} aria-label="Mensagem para ${esc(p.nome)}">${ico("chat")}</button><button class="btn sm ${st.k==="on"?"primary":""}" type="button" data-video="${id}" ${podeDM(p)?"":"disabled"} aria-label="Chamada de vídeo com ${esc(p.nome)}" title="Chamada de vídeo">${ico("video")}</button>${meus.has(id)?`<button class="btn sm ghost" type="button" data-amigo="${id}" title="Remover amigo" aria-label="Remover ${esc(p.nome)} dos amigos">✕</button>`:""}</div></div>`};
  const amigos=todos.filter(([id])=>meus.has(id)).sort(ordem),on=amigos.filter(([id])=>statusOnline(id).k!=="off"),off=amigos.filter(([id])=>statusOnline(id).k==="off");
  const achados=q?todos.filter(([,p])=>norm(p.nome).includes(q)||norm(p.objetivo).includes(q)).sort(ordem):[];
  const foco=document.activeElement&&document.activeElement.id==="am-busca";
  $("#main").innerHTML=`<div class="page" style="max-width:860px">${pageHead("Amigos","Veja quem está online, mande mensagem ou faça uma chamada de vídeo para estudar junto.")}
    <div class="field" style="margin-bottom:16px"><label for="am-busca">Buscar pessoas</label><input type="text" id="am-busca" placeholder="Nome ou objetivo (ex.: EsPCEx, ENEM)" value="${esc(FBC.busca)}" autocomplete="off"></div>
    ${q?`<div class="card"><div class="card-h"><h3>Resultados (${achados.length})</h3></div>${achados.length?`<div class="list">${achados.slice(0,60).map(linha).join("")}</div>`:`<p class="small muted">Ninguém encontrado com esse nome.</p>`}</div>`
    :`<div class="card"><div class="card-h"><h3><span class="on-dot on"></span> Online agora (${on.length})</h3><span class="small muted">${amigos.length} ${amigos.length===1?"amigo":"amigos"}</span></div>
        ${on.length?`<div class="list">${on.map(linha).join("")}</div>`:`<p class="small muted">${amigos.length?"Nenhum amigo online agora.":"Você ainda não adicionou amigos. Use a busca acima."}</p>`}</div>
      ${off.length?`<div class="card" style="margin-top:16px"><div class="card-h"><h3><span class="on-dot off"></span> Offline (${off.length})</h3></div><div class="list">${off.map(linha).join("")}</div></div>`:""}
      ${todos.length?`<div class="card" style="margin-top:16px"><div class="card-h"><h3>Pessoas no app</h3><span class="small muted">${todos.length} pessoas</span></div><div class="list">${todos.filter(([id])=>!meus.has(id)).sort(ordem).slice(0,20).map(linha).join("")}</div></div>`:""}`}
    ${mostraOnline()?"":`<p class="hint" style="margin-top:12px">Você está invisível: os outros veem você como offline. Mude em Meu perfil › Privacidade.</p>`}
  </div>`;
  const inp=$("#am-busca");if(foco){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
  inp.addEventListener("input",()=>{FBC.busca=inp.value;renderAmigosFB()});
  $$("[data-amigo]").forEach(b=>b.onclick=async()=>{const set=new Set((S.pub&&S.pub.amigos)||[]);const id=b.dataset.amigo;set.has(id)?set.delete(id):set.add(id);
    const d={...(S.pub||{nome:S.perfil.nome||"Estudante"}),amigos:[...set]};if(await gravarPub("perfis",d)){S.pub=d;S.soc.perfis[S.uid]=d;toast(set.has(id)?"Amigo adicionado.":"Amigo removido.");renderAmigosFB()}});
  $$("[data-dm]").forEach(b=>b.onclick=()=>abrirDM(b.dataset.dm));
  $$("[data-video]").forEach(b=>b.onclick=()=>chamadaLigar(b.dataset.video));
}

const V={canal:null,titulo:"",sessao:"",stream:null,pcs:{},parts:{},mudo:false,subs:[],hb:null,ctx:null,an:{},falando:{},laco:null,entrando:false,video:null,vtipo:null,max:8};
const vozDoc=c=>S.db.collection("voz").doc(c);
const VOZ_VIVO=180000;
document.addEventListener("visibilitychange",()=>{if(V.canal&&S.db)vozDoc(V.canal).collection("participantes").doc(S.uid).update({visto:Date.now(),mudo:V.mudo}).catch(()=>{})});
const vozCanalGrupo=gid=>"g_"+gid;
function vozNome(){return ((S.pub&&S.pub.nome)||(S.perfil&&S.perfil.nome)||"Estudante").slice(0,60)}
async function vozEntrar(canal,titulo,opts){opts=opts||{};
  if(!FBM()){toast("Entre com sua conta para usar os canais de voz.");return}
  if(V.entrando)return;if(V.canal===canal)return;if(V.canal)await vozSair(true);
  if(!navigator.mediaDevices||!window.RTCPeerConnection){toast("Este navegador não permite chamadas de voz.");return}
  V.entrando=true;vozUI();
  try{
    const atuais=await vozDoc(canal).collection("participantes").get();const vivos=atuais.docs.filter(d=>d.id!==S.uid&&Date.now()-(d.data().visto||0)<60000);
    const lim=canal.startsWith("dm_")?2:VOZ_MAX;
    if(vivos.length>=lim){toast(canal.startsWith("dm_")?"Essa chamada já está em andamento em outro aparelho.":`O canal está cheio (${VOZ_MAX} pessoas). Tente daqui a pouco.`);V.entrando=false;vozUI();return}
    V.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  }catch(e){V.entrando=false;vozUI();
    toast(e&&e.name==="NotAllowedError"?"Libere o microfone para o site (no cadeado ao lado do endereço) e tente de novo.":e&&e.name==="NotFoundError"?"Nenhum microfone encontrado.":"Não foi possível entrar no canal ("+(e&&(e.code||e.name)||"erro")+").");return}
  Object.assign(V,{canal,titulo,sessao:Math.random().toString(36).slice(2,12),pcs:{},parts:{},falando:{},mudo:false,video:null,vtipo:null,teveOutro:false});
  V.stream.getAudioTracks().forEach(t=>t.enabled=true);
  try{await vozDoc(canal).collection("participantes").doc(S.uid).set({nome:vozNome(),sessao:V.sessao,visto:Date.now(),mudo:false,entrou:Date.now(),cam:false,tela:false})}
  catch(e){V.stream.getTracks().forEach(t=>t.stop());V.stream=null;V.canal=null;V.entrando=false;vozUI();toast("Sem permissão para entrar neste canal ("+(e&&e.code||"erro")+").");return}
  V.entrando=false;vozAnalisar(S.uid,V.stream);
  V.subs.push(vozDoc(canal).collection("participantes").onSnapshot(vozParticipantes,err=>console.warn("voz part",err&&err.code)));
  V.subs.push(vozDoc(canal).collection("sinais").where("para","==",S.uid).onSnapshot(vozSinais,err=>console.warn("voz sinais",err&&err.code)));
  V.hb=setInterval(()=>{if(!V.canal)return;vozDoc(V.canal).collection("participantes").doc(S.uid).update({visto:Date.now(),mudo:V.mudo}).catch(()=>{});vozParticipantes(null);vozConferirAtividade()},20000);
  V.desde=Date.now();V.confirmado=Date.now();vozMidiaSessao();
  if(!opts.quieto)toast(`Você entrou no canal de voz ${titulo}.`);vozUI();vozPedirNotificacao();
  if(opts.video)vozCamera();
}
async function vozSair(silencioso){
  if(!V.canal)return;const canal=V.canal;
  V.subs.forEach(u=>{try{u()}catch(e){}});V.subs=[];clearInterval(V.hb);
  Object.keys(V.pcs).forEach(vozFecharPar);
  if(V.stream)V.stream.getTracks().forEach(t=>t.stop());
  if(V.video)V.video.stop();V.video=null;V.vtipo=null;
  Object.keys(V.an).forEach(k=>delete V.an[k]);clearInterval(V.laco);V.laco=null;
  Object.assign(V,{canal:null,titulo:"",stream:null,parts:{},falando:{},sessao:"",pergunta:0});vozFecharAviso();vozFecharPip();
  try{if("mediaSession" in navigator)["enterpictureinpicture","togglemicrophone","hangup"].forEach(a=>{try{navigator.mediaSession.setActionHandler(a,null)}catch(e){}})}catch(e){}
  try{await vozDoc(canal).collection("participantes").doc(S.uid).delete()}catch(e){}
  if(!silencioso)toast(canal.startsWith("dm_")?"Chamada encerrada.":"Você saiu do canal de voz.");vozUI();vozPalco();
  if(canal.startsWith("dm_")&&typeof chamadaCancelarAviso==="function")chamadaCancelarAviso();
}
function vozMudo(){if(!V.stream)return;V.mudo=!V.mudo;V.stream.getAudioTracks().forEach(t=>t.enabled=!V.mudo);
  vozDoc(V.canal).collection("participantes").doc(S.uid).update({mudo:V.mudo,visto:Date.now()}).catch(()=>{});vozUI()}
function vozEnviar(para,spara,tipo,dados){if(!V.canal)return;vozDoc(V.canal).collection("sinais").add({de:S.uid,para,sde:V.sessao,spara,tipo,dados:dados||"",em:Date.now()}).catch(e=>console.warn("voz sinal",e&&e.code))}
function vozFecharPar(uid){const p=V.pcs[uid];if(!p)return;try{p.pc.close()}catch(e){}if(p.audio){p.audio.srcObject=null;p.audio.remove()}delete V.pcs[uid];delete V.an[uid];delete V.falando[uid]}
function vozPar(uid,sess){
  let p=V.pcs[uid];if(p&&p.sessao===sess)return p;if(p)vozFecharPar(uid);
  const pc=new RTCPeerConnection({iceServers:VOZ_ICE});V.stream.getTracks().forEach(t=>pc.addTrack(t,V.stream));
  p=V.pcs[uid]={pc,sessao:sess,fila:[],audio:null,estado:"conectando",criado:Date.now(),vsender:null,vstream:null};
  if(S.uid<uid){const tv=pc.addTransceiver("video",{direction:"sendrecv"});p.vsender=tv.sender;if(V.video)tv.sender.replaceTrack(V.video).catch(()=>{})}
  pc.onicecandidate=e=>{if(e.candidate)vozEnviar(uid,sess,"ice",JSON.stringify(e.candidate))};
  pc.ontrack=e=>{if(e.track.kind==="video"){p.vstream=new MediaStream([e.track]);e.track.onunmute=()=>vozPalco();e.track.onmute=()=>vozPalco();vozPalco();return}
    const st=e.streams[0]||new MediaStream([e.track]);if(!p.audio){p.audio=document.createElement("audio");p.audio.autoplay=true;p.audio.setAttribute("playsinline","");p.audio.hidden=true;document.body.appendChild(p.audio)}
    p.audio.srcObject=st;p.audio.play().catch(()=>{});vozAnalisar(uid,st)};
  pc.onconnectionstatechange=()=>{p.estado=pc.connectionState;vozUI();
    if(pc.connectionState==="failed"&&V.pcs[uid]===p&&S.uid<uid){setTimeout(()=>{if(V.pcs[uid]===p&&V.parts[uid]){vozFecharPar(uid);vozOferecer(uid,V.parts[uid].sessao)}},1500)}};
  return p}
async function vozOferecer(uid,sess){const p=vozPar(uid,sess);try{const o=await p.pc.createOffer();await p.pc.setLocalDescription(o);vozEnviar(uid,sess,"offer",JSON.stringify(p.pc.localDescription))}catch(e){console.warn("voz oferta",e)}}
function vozParticipantes(snap){
  if(!V.canal)return;if(snap)V.ultimo=snap.docs.map(d=>({id:d.id,...d.data()}));
  // com a aba em segundo plano o navegador atrasa o aviso de presença (até ~1 min): quem ainda está conectado continua na chamada
  const vivos={};(V.ultimo||[]).forEach(d=>{if(d.id===S.uid)return;const p=V.pcs[d.id],con=p&&p.sessao===d.sessao&&p.estado==="connected";if(Date.now()-(d.visto||0)<VOZ_VIVO||con)vivos[d.id]=d});V.parts=vivos;
  // (a oferta pode chegar antes da lista atualizar: só fecha conexões novas se a sessão mudou)
  Object.keys(V.pcs).forEach(uid=>{const p=V.pcs[uid];if(vivos[uid]?vivos[uid].sessao!==p.sessao:Date.now()-p.criado>15000)vozFecharPar(uid)});
  // quem tem o id menor começa a conexão
  Object.values(vivos).forEach(d=>{if(!V.pcs[d.id]&&S.uid<d.id)vozOferecer(d.id,d.sessao)});
  if(V.canal&&V.canal.startsWith("dm_")){if(Object.keys(vivos).length){V.teveOutro=true;if(typeof chamadaAtendida==="function")chamadaAtendida()}else if(V.teveOutro){vozSair();return}}
  vozUI();vozPalco()}
async function vozSinais(snap){
  for(const ch of snap.docChanges()){if(ch.type!=="added")continue;const d=ch.doc.data(),ref=ch.doc.ref;ref.delete().catch(()=>{});
    if(!V.canal||d.spara!==V.sessao)continue;
    try{
      if(d.tipo==="offer"){const p=vozPar(d.de,d.sde);await p.pc.setRemoteDescription(JSON.parse(d.dados));
        const tv=p.pc.getTransceivers().find(t=>t.receiver&&t.receiver.track&&t.receiver.track.kind==="video");
        if(tv){tv.direction="sendrecv";p.vsender=tv.sender;if(V.video)await tv.sender.replaceTrack(V.video).catch(()=>{})}for(const c of p.fila.splice(0))await p.pc.addIceCandidate(c).catch(()=>{});
        const a=await p.pc.createAnswer();await p.pc.setLocalDescription(a);vozEnviar(d.de,d.sde,"answer",JSON.stringify(p.pc.localDescription))}
      else if(d.tipo==="answer"){const p=V.pcs[d.de];if(p&&p.sessao===d.sde&&p.pc.signalingState==="have-local-offer"){await p.pc.setRemoteDescription(JSON.parse(d.dados));for(const c of p.fila.splice(0))await p.pc.addIceCandidate(c).catch(()=>{})}}
      else if(d.tipo==="ice"){const p=V.pcs[d.de];if(p&&p.sessao===d.sde){const c=JSON.parse(d.dados);if(p.pc.remoteDescription)await p.pc.addIceCandidate(c).catch(()=>{});else p.fila.push(c)}}
    }catch(e){console.warn("voz sinal",d.tipo,e)}}}

// ---- vídeo: câmera ou tela vão no mesmo canal de vídeo de cada conexão (troca sem renegociar) ----
const podeTela=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)&&!/Android|iPhone|iPad/i.test(navigator.userAgent);
const mostraTela=()=>true;
async function vozDefinirVideo(track,tipo){
  if(V.video&&V.video!==track)V.video.stop();
  V.video=track||null;V.vtipo=track?tipo:null;
  Object.values(V.pcs).forEach(p=>{if(p.vsender)p.vsender.replaceTrack(V.video).catch(()=>{})});
  if(V.canal)vozDoc(V.canal).collection("participantes").doc(S.uid).update({cam:V.vtipo==="cam",tela:V.vtipo==="tela",visto:Date.now()}).catch(()=>{});
  vozUI();vozPalco()}
async function vozCamera(){if(!V.canal)return;if(V.vtipo==="cam"){vozDefinirVideo(null);return}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:360},frameRate:{ideal:15},facingMode:"user"}});const t=st.getVideoTracks()[0];t.onended=()=>{if(V.video===t)vozDefinirVideo(null)};vozDefinirVideo(t,"cam")}
  catch(e){toast(e&&e.name==="NotAllowedError"?"Libere a câmera para o site (no cadeado ao lado do endereço).":"Não foi possível ligar a câmera.")}}
async function vozTela(){if(!V.canal)return;if(V.vtipo==="tela"){vozDefinirVideo(null);return}
  if(!podeTela()){toast("Celulares e tablets não deixam o navegador compartilhar a tela. Use o computador (Chrome, Edge ou Firefox) para mostrar a sua tela; no celular você consegue ver a tela dos outros.");return}
  try{const st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:10}},audio:false});const t=st.getVideoTracks()[0];t.contentHint="detail";t.onended=()=>{if(V.video===t)vozDefinirVideo(null)};vozDefinirVideo(t,"tela")}
  catch(e){if(e&&e.name!=="NotAllowedError")toast("Não foi possível compartilhar a tela.")}}
// janela flutuante com os vídeos (dá para continuar usando o site)
function vozPalco(){
  const pdoc=V.pip&&!V.pip.closed?V.pip.document:null;
  let el=(pdoc&&pdoc.getElementById("voz-palco"))||$("#voz-palco");
  const tiles=[];if(V.canal&&V.video)tiles.push({id:S.uid,eu:true,st:new MediaStream([V.video]),tela:V.vtipo==="tela"});
  if(V.canal)Object.entries(V.pcs).forEach(([id,p])=>{const d=V.parts[id];if(p.vstream&&d&&(d.cam||d.tela)&&p.vstream.getVideoTracks()[0]&&!p.vstream.getVideoTracks()[0].muted)tiles.push({id,eu:false,st:p.vstream,tela:!!d.tela,nome:d.nome})});
  const dm=V.canal&&V.canal.startsWith("dm_"),chamando=dm&&!V.teveOutro;
  if(!V.canal||(!tiles.length&&!dm&&!pdoc&&!V.forcarPalco)){if(!V.canal)V.forcarPalco=false;if(el)el.remove();if(!V.canal)vozFecharPip();return}
  if(!el){el=document.createElement("div");el.id="voz-palco";el.className="voz-palco";document.body.appendChild(el);
    el.addEventListener("click",e=>{const b=e.target.closest("[data-palco]");if(!b)return;const a=b.dataset.palco;
      if(a==="cam")vozCamera();else if(a==="tela")vozTela();else if(a==="mudo")vozMudo();else if(a==="sair")vozSair();else if(a==="grande")el.classList.toggle("grande");else if(a==="min")el.classList.toggle("min");else if(a==="pip")V.pip&&!V.pip.closed?vozFecharPip():vozAbrirPip();else if(a==="ativo")vozConfirmarAtividade()})}
  const chave=tiles.map(t=>t.id+(t.tela?"t":"c")).join(",")+"|"+V.mudo+V.vtipo+chamando+V.titulo+Object.keys(V.parts).length+"|"+(V.pergunta||0)+!!pdoc;
  if(el.dataset.chave===chave){return}
  el.dataset.chave=chave;
  el.innerHTML=`<div class="vp-top"><b>${esc(V.titulo)}</b><span class="small">${chamando?"Chamando…":`${Object.keys(V.parts).length+1} na chamada`}</span>${pipPossivel()?`<button type="button" class="vp-b" data-palco="pip" title="${pdoc?"Voltar para o site":"Janela flutuante: continua por cima mesmo fora do site"}" aria-label="${pdoc?"Voltar a janela para o site":"Abrir em janela flutuante"}">${ico("pip")}</button>`:""}${pdoc?"":`<button type="button" class="vp-b" data-palco="min" title="Minimizar" aria-label="Minimizar">–</button><button type="button" class="vp-b" data-palco="grande" title="Aumentar" aria-label="Aumentar">⤢</button>`}</div>
    ${V.pergunta?`<div class="vp-aviso" role="alert"><b>Você ainda está estudando?</b><span class="small">A chamada termina sozinha em ${Math.max(1,Math.ceil((V.pergunta-Date.now())/60000))} min se ninguém responder.</span><button type="button" class="btn primary sm" data-palco="ativo">Sim, continuar</button></div>`:""}
    <div class="vp-grade n${Math.min(tiles.length,4)}">${tiles.length?tiles.map(t=>`<div class="vp-tile ${t.tela?"tela":""} ${t.eu?"eu":""}"><video autoplay playsinline autopictureinpicture ${t.eu?"muted":""} data-vt="${t.id}"></video><span class="vp-nome">${t.eu?"Você":esc(t.nome||nomeDe(t.id))}${t.tela?" · tela":""}</span></div>`).join(""):`<div class="vp-vazio">${chamando?`${ico("video")}<span>Chamando ${esc(V.titulo.replace(/^Chamada com /,""))}…</span>`:`${ico("videooff")}<span>Câmeras desligadas</span>`}</div>`}</div>
    <div class="vp-acoes"><button type="button" class="vp-c ${V.mudo?"off":""}" data-palco="mudo" title="${V.mudo?"Ativar microfone":"Silenciar"}" aria-label="${V.mudo?"Ativar microfone":"Silenciar"}">${ico(V.mudo?"micoff":"mic")}</button>
      <button type="button" class="vp-c ${V.vtipo==="cam"?"on":""}" data-palco="cam" title="Câmera" aria-label="${V.vtipo==="cam"?"Desligar câmera":"Ligar câmera"}">${ico(V.vtipo==="cam"?"video":"videooff")}</button>
      ${mostraTela()?`<button type="button" class="vp-c ${V.vtipo==="tela"?"on":""}" data-palco="tela" title="Compartilhar tela" aria-label="${V.vtipo==="tela"?"Parar de compartilhar a tela":"Compartilhar tela"}">${ico("tela")}</button>`:""}
      <button type="button" class="vp-c sai" data-palco="sair" title="Sair" aria-label="Sair da chamada">${ico("phoneoff")}</button></div>`;
  el.querySelectorAll("video[data-vt]").forEach(v=>{const t=tiles.find(x=>x.id===v.dataset.vt);if(t){v.srcObject=t.st;v.play().catch(()=>{})}});
}
// ---- janela flutuante por cima de tudo (Picture-in-Picture), inclusive quando a pessoa sai do site ----
const pipPossivel=()=>"documentPictureInPicture" in window||(document.pictureInPictureEnabled&&!!HTMLVideoElement.prototype.requestPictureInPicture);
async function vozAbrirPip(auto){
  if(!V.canal)return;
  if("documentPictureInPicture" in window){
    try{if(V.pip&&!V.pip.closed)return;
      const w=await documentPictureInPicture.requestWindow({width:360,height:300});V.pip=w;
      // leva o visual do site junto (estilos, tema e cor neon)
      [...document.querySelectorAll('style,link[rel="stylesheet"]')].forEach(n=>w.document.head.appendChild(n.cloneNode(true)));
      [...document.documentElement.attributes].forEach(a=>w.document.documentElement.setAttribute(a.name,a.value));
      w.document.body.className="pip-corpo";w.document.title=V.titulo||"Chamada";
      const el=$("#voz-palco");if(el){el.dataset.chave="";w.document.body.appendChild(el)}
      w.addEventListener("pagehide",()=>{const p=w.document.getElementById("voz-palco");V.pip=null;if(p){p.dataset.chave="";document.body.appendChild(p)}vozPalco()});
      vozPalco();return}catch(e){if(!auto)toast("Não foi possível abrir a janela flutuante.");}}
  // navegadores sem janela flutuante completa: só o vídeo flutua
  const v=[...document.querySelectorAll("#voz-palco video[data-vt]")].find(x=>!x.muted)||document.querySelector("#voz-palco video[data-vt]");
  if(v&&v.requestPictureInPicture){try{await v.requestPictureInPicture()}catch(e){if(!auto)toast("Ligue a câmera ou espere o vídeo aparecer para usar a janela flutuante.")}}
  else if(!auto)toast("Este navegador não tem janela flutuante. A chamada continua mesmo se você trocar de aba.");
}
function vozFecharPip(){if(V.pip&&!V.pip.closed)V.pip.close();V.pip=null;if(document.pictureInPictureElement)document.exitPictureInPicture().catch(()=>{})}
// Chrome abre a janela flutuante sozinho ao trocar de aba quando o site está usando câmera ou microfone
function vozMidiaSessao(){try{if(!("mediaSession" in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:V.titulo||"Chamada",artist:"Logic Academy"});
  navigator.mediaSession.setActionHandler("enterpictureinpicture",()=>vozAbrirPip(true))}catch(e){}
  try{navigator.mediaSession.setActionHandler("togglemicrophone",()=>vozMudo());navigator.mediaSession.setActionHandler("hangup",()=>vozSair())}catch(e){}}
// ---- "Você ainda está estudando?": a cada 1 hora na chamada; sem resposta em 5 minutos, a pessoa sai ----
const VOZ_PERGUNTA=60*60000,VOZ_PRAZO=5*60000;
function vozConferirAtividade(){if(!V.canal)return;const agora=Date.now();
  if(V.pergunta){if(agora>=V.pergunta){V.pergunta=0;vozFecharAviso();vozSair(true);toast("Você saiu da chamada porque não respondeu se ainda estava estudando.");
      try{if(window.Notification&&Notification.permission==="granted")new Notification("Logic Academy",{body:"A chamada foi encerrada por inatividade."})}catch(e){}}
    else vozMostrarAviso();return}
  if(agora-(V.confirmado||agora)>=VOZ_PERGUNTA){V.pergunta=agora+VOZ_PRAZO;vozMostrarAviso(true);
    try{if(document.hidden&&window.Notification&&Notification.permission==="granted")new Notification("Você ainda está estudando?",{body:"Volte ao site e confirme, ou a chamada termina em 5 minutos.",tag:"la-ativo"})}catch(e){}}}
function vozMostrarAviso(novo){
  let bg=$("#voz-ativo");const min=Math.max(1,Math.ceil((V.pergunta-Date.now())/60000));
  if(!bg){bg=document.createElement("div");bg.className="modal-bg";bg.id="voz-ativo";
    bg.innerHTML=`<div class="card stack modal" role="alertdialog" aria-modal="true" aria-labelledby="va-t"><span class="eyebrow">${esc(V.titulo)}</span><h3 id="va-t">Você ainda está estudando?</h3>
      <p class="small muted">Você está na chamada há mais de 1 hora. Confirme para continuar; sem resposta, a chamada termina em <b data-va>${min}</b> min.</p>
      <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn ghost" type="button" data-va-x>Sair da chamada</button><button class="btn primary" type="button" data-va-ok>Sim, continuar</button></div></div>`;
    document.body.appendChild(bg);bg.querySelector("[data-va-ok]").onclick=vozConfirmarAtividade;bg.querySelector("[data-va-x]").onclick=()=>{vozFecharAviso();vozSair()};
    setTimeout(()=>{const b=bg.querySelector("[data-va-ok]");if(b)b.focus()},50)}
  else{const b=bg.querySelector("[data-va]");if(b)b.textContent=min}
  if(novo)try{const AC=window.AudioContext||window.webkitAudioContext,c=V.ctx||new AC(),t=c.currentTime;[0,.3].forEach(o=>{const os=c.createOscillator(),g=c.createGain();os.frequency.value=740;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.15,t+o+.03);g.gain.exponentialRampToValueAtTime(.0001,t+o+.25);os.connect(g);g.connect(c.destination);os.start(t+o);os.stop(t+o+.3)})}catch(e){}
  const el=V.pip&&!V.pip.closed?V.pip.document.getElementById("voz-palco"):$("#voz-palco");if(el)el.dataset.chave="";vozPalco()}
function vozFecharAviso(){const bg=$("#voz-ativo");if(bg)bg.remove()}
function vozConfirmarAtividade(){V.pergunta=0;V.confirmado=Date.now();vozFecharAviso();vozPalco();toast("Boa! Continue firme nos estudos.")}

// indicador de quem está falando
function vozAnalisar(uid,stream){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;V.ctx=V.ctx||new AC();if(V.ctx.state==="suspended")V.ctx.resume().catch(()=>{});
  const src=V.ctx.createMediaStreamSource(stream),an=V.ctx.createAnalyser();an.fftSize=512;src.connect(an);V.an[uid]={an,buf:new Uint8Array(an.fftSize)};
  if(!V.laco)V.laco=setInterval(()=>{let mudou=false;Object.entries(V.an).forEach(([id,x])=>{x.an.getByteTimeDomainData(x.buf);let s=0;for(const v of x.buf){const d=(v-128)/128;s+=d*d}
    const f=Math.sqrt(s/x.buf.length)>.04&&!(id===S.uid&&V.mudo);if(!!V.falando[id]!==f){V.falando[id]=f;mudou=true}});
    if(mudou)$$("[data-voz-uid]").forEach(el=>el.classList.toggle("falando",!!V.falando[el.dataset.vozUid]))},150)}catch(e){}}

        :`<button class="btn primary" type="button" data-voz="entrar" data-canal="${canal}" data-titulo="${esc(titulo)}" ${V.entrando?"disabled":""}>${ico("mic")}${V.entrando?"Conectando…":outro?"Trocar para este canal":"Entrar no canal de voz"}</button>`}</div></div>
    ${lista.length?`<div class="voz-lista">${lista.map(([id,d,eu])=>vozPessoaHtml(id,d,eu)).join("")}</div>`:""}
    <p class="hint">${aqui?"Pode navegar pelo site (pomodoro, questões…) que a conversa continua. Use fone de ouvido para não dar eco.":`Até ${VOZ_MAX} pessoas por canal. O áudio vai direto entre os participantes e não é gravado.`}${outro?` Você está em <b>${esc(V.titulo)}</b>.`:""}</p></div>`}

  if(a==="entrar")vozEntrar(b.dataset.canal,b.dataset.titulo);else if(a==="sair")vozSair();else if(a==="mudo")vozMudo();else if(a==="cam")vozCamera();else if(a==="tela")vozTela();else if(a==="pip"){if(!$("#voz-palco")&&!(V.pip&&!V.pip.closed)){V.forcarPalco=true;vozPalco()}vozAbrirPip()}else if(a==="abrir"&&V.canal){if(V.canal.startsWith("dm_")){const o=V.canal.slice(3).split("_").find(x=>x!==S.uid);abrirDM(o)}else if(V.canal==="global")go("voz");else{S.grupoAberto=V.canal.slice(2);FBC.grupoTab="voz";go("grupos")}}},true);

/* ---- Chamada de vídeo entre amigos (canal "dm_<a>_<b>" + aviso em chamadas/{quem recebe}) ---- */
const CH={rec:null,toque:null,saindo:null,aviso:null,timeout:null};
const canalDM=o=>"dm_"+[S.uid,o].sort().join("_");
async function chamadaLigar(outro){
  if(!FBM()){toast("Entre com sua conta para fazer chamadas.");return}
  const p=S.soc.perfis[outro]||{};const nome=p.nome||nomeDe(outro),canal=canalDM(outro);
  if(V.canal===canal){vozPalco();return}
  try{await S.db.collection("chamadas").doc(outro).set({de:S.uid,nome:vozNome(),canal,em:Date.now(),video:true})}
  catch(e){toast(e&&e.code==="permission-denied"?`${nome} só recebe chamadas de amigos.`:"Não foi possível ligar ("+(e&&e.code||"erro")+").");return}
  CH.aviso=outro;
  await vozEntrar(canal,`Chamada com ${nome}`,{video:true,quieto:true});
  if(V.canal!==canal){chamadaCancelarAviso();return}
  if(statusOnline(outro).k==="off")toast(`${nome} parece estar offline. A chamada vai tocar quando abrir o site.`);
  // se a pessoa recusar, o aviso some antes de ela entrar
  const recusou=()=>{if(CH.saindo){CH.saindo();CH.saindo=null}setTimeout(()=>{if(V.canal===canal&&!V.teveOutro){toast(`${nome} recusou ou não pode atender agora.`);vozSair(true);vozPalco()}},8000)};
  // quando o aviso é apagado, a leitura passa a ser negada pelas regras: as duas coisas significam "não atendeu"
  CH.saindo=S.db.collection("chamadas").doc(outro).onSnapshot(sn=>{if(!sn.exists)recusou()},()=>recusou());
  clearTimeout(CH.timeout);CH.timeout=setTimeout(()=>{if(V.canal===canal&&!V.teveOutro){toast(`${nome} não atendeu.`);vozSair(true)}},45000);
}
function chamadaAtendida(){clearTimeout(CH.timeout);if(CH.saindo){CH.saindo();CH.saindo=null}if(CH.aviso){S.db.collection("chamadas").doc(CH.aviso).delete().catch(()=>{});CH.aviso=null}}
function chamadaCancelarAviso(){clearTimeout(CH.timeout);if(CH.saindo){CH.saindo();CH.saindo=null}if(CH.aviso&&S.db){S.db.collection("chamadas").doc(CH.aviso).delete().catch(()=>{});CH.aviso=null}}
function assinarChamadas(){
  assinar("chamadas",S.db.collection("chamadas").doc(S.uid),sn=>{
    const d=sn.exists?sn.data():null;
    if(!d||Date.now()-(d.em||0)>60000||V.canal===d.canal){chamadaFechar();return}
    if(CH.rec&&CH.rec.canal===d.canal)return;chamadaMostrar(d)})}
function chamadaMostrar(d){
  chamadaFechar();CH.rec=d;
  const bg=document.createElement("div");bg.className="modal-bg chamada-in";bg.id="chamada-in";
  bg.innerHTML=`<div class="card stack chamada-box" role="alertdialog" aria-modal="true" aria-label="Chamada de vídeo de ${esc(d.nome)}"><div class="chamada-av">${avatar(d.de,"lg")}</div><span class="eyebrow">Chamada de vídeo</span><h2>${esc(d.nome)}</h2><p class="muted small">está te chamando para estudar junto</p>
    <div class="row" style="justify-content:center;gap:18px"><button class="vp-c sai grande" type="button" data-ch="nao" aria-label="Recusar">${ico("phoneoff")}</button><button class="vp-c atende grande" type="button" data-ch="sim" aria-label="Atender">${ico("video")}</button></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click",async e=>{const b=e.target.closest("[data-ch]");if(!b)return;const r=CH.rec;chamadaFechar();
    if(b.dataset.ch==="sim"&&r)await vozEntrar(r.canal,`Chamada com ${r.nome}`,{video:true,quieto:true});
    S.db.collection("chamadas").doc(S.uid).delete().catch(()=>{})});
  // toque
  const AC=window.AudioContext||window.webkitAudioContext;
  const tocar=()=>{try{const c=CH.ctx=CH.ctx||new AC(),t=c.currentTime;[0,.25].forEach(o=>{const os=c.createOscillator(),g=c.createGain();os.frequency.value=o?660:880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.2,t+o+.03);g.gain.exponentialRampToValueAtTime(.0001,t+o+.22);os.connect(g);g.connect(c.destination);os.start(t+o);os.stop(t+o+.25)})}catch(e){}};
  tocar();CH.toque=setInterval(tocar,1600);
  if("Notification" in window&&Notification.permission==="granted"&&document.visibilityState!=="visible")try{new Notification("Chamada de vídeo",{body:`${d.nome} está te chamando no Logic Academy`,tag:"chamada"})}catch(e){}
  setTimeout(()=>{if(CH.rec===d)chamadaFechar()},Math.max(5000,60000-(Date.now()-d.em)));
}
function chamadaFechar(){clearInterval(CH.toque);CH.toque=null;CH.rec=null;const m=$("#chamada-in");if(m)m.remove()}

/* ================= Flashcards (aba Prova): baralhos próprios ou montados com IA, revisão espaçada ================= */

const FC_DIAS=[0,0,1,3,7,16],FC_MAX=1500;
const FC={doc:null,aberto:null,estudo:null,ia:null,editando:null};
async function fcDoc(){if(FC.doc)return FC.doc;let d=null;try{d=await ler("flashcards")}catch(e){}FC.doc=d&&d.b?d:{b:{}};return FC.doc}
const fcSalvar=()=>gravar("flashcards",FC.doc);
const fcHoje=()=>dataISO();
const fcVence=c=>!c.prox||c.prox<=fcHoje();
const fcTotal=()=>Object.values(FC.doc.b).reduce((a,b)=>a+b.c.length,0);
function fcSomarDias(n){const d=new Date();d.setDate(d.getDate()+n);return dataISO(d)}
function fcNovoBaralho(nome,mat){const id=uid();FC.doc.b[id]={nome:(nome||"Novo baralho").slice(0,80),mat:(mat||"").slice(0,60),em:Date.now(),c:[]};fcSalvar();return id}
function fcAdd(bid,f,v){const b=FC.doc.b[bid];if(!b)return false;f=String(f||"").trim().slice(0,500);v=String(v||"").trim().slice(0,1200);if(!f||!v)return false;
  if(fcTotal()>=FC_MAX){toast(`Limite de ${FC_MAX} cartões atingido. Apague alguns para criar novos.`);return false}
  b.c.push({id:uid(),f,v,cx:1,prox:fcHoje(),ok:0,er:0});return true}
function fcTopicosProva(){const out=[];if(S.edital&&S.edital.materias)S.edital.materias.forEach(m=>(m.topicos||[]).forEach(t=>out.push([m.nome||"",t.t])));return out}

async function fcGerarIA(bid){

  if(!tema&&!base){toast("Escreva um assunto ou cole um resumo.");$("#fc-tema").focus();return}

  const prova=S.edital?(S.edital.nome||""):(S.perfil&&S.perfil.nomeProva)||"";
  const pedido=`Crie exatamente ${qtd} flashcards em português do Brasil para um estudante${prova?` que se prepara para ${prova}`:" de vestibular/concurso"}.
Assunto: ${tema||"o texto abaixo"}.
${base?`Use SOMENTE as informações deste texto do estudante:\n"""${base.slice(0,6000)}"""\n`:""}Regras: frente curta (pergunta direta, conceito ou lacuna); verso com a resposta correta em até 2 frases; um fato por cartão; sem repetir; nada inventado; cobrir os pontos mais cobrados em prova.
Responda APENAS com um array JSON, sem texto antes ou depois, no formato: [{"f":"frente","v":"verso"}]`;
  try{const ia=await iaMentoria();const r=await ia([{role:"user",content:pedido}],{modelTier:"default",cache:false});
    const txt=(r&&r.text)||"",m=txt.match(/\[[\s\S]*\]/);let arr=[];try{arr=JSON.parse(m?m[0]:txt)}catch(e){}
    arr=(Array.isArray(arr)?arr:[]).map(x=>({f:String(x&&(x.f||x.frente||x.pergunta)||"").trim().slice(0,500),v:String(x&&(x.v||x.verso||x.resposta)||"").trim().slice(0,1200)})).filter(x=>x.f&&x.v);
    FC.ia={bid,tema,base,qtd,cards:arr,erro:arr.length?"":"A IA não devolveu cartões válidos. Tente de novo ou mude o assunto."}}
  catch(e){FC.ia={bid,tema,base,qtd,erro:e&&e.code==="rate_limited"?"Muitos pedidos seguidos. Espere um pouco e tente de novo.":e&&e.code==="ia_desativada"?"A IA ainda não foi ativada no Firebase deste site.":"Não foi possível gerar agora ("+(e&&e.code||"erro")+"). Tente de novo."}}
  if(S.view==="flashcards"&&FC.aberto===bid&&!FC.estudo)fcTelaBaralho()}

function fcEstudar(bid){

  let extra=false;if(!fila.length&&bid){FC.doc.b[bid].c.forEach(c=>fila.push([bid,c.id]));extra=true}   // tudo em dia: revisão livre
  if(!fila.length){toast("Nada para revisar hoje. Volte amanhã!");return}

function prepararPomo(k,b){if(P.rodando)return;P.materia=b.materia;P.bloco=k+"|"+b.id;P.modo="foco";P.dur.foco=Math.max(5,Math.min(120,b.min||P.dur.foco));P.restante=pomoTotal();P.acumulado=0;salvarPomoLocal()}
function ligarBlocos(){
  $$("[data-chk]").forEach(c=>c.addEventListener("change",()=>{if(c.checked){faisca(c);const it=c.closest(".bitem");if(it)it.classList.add("feito-agora");setTimeout(()=>marcarBloco(c.dataset.chk,true),380)}else marcarBloco(c.dataset.chk,false)}));

}

function cartaoDia(off){
  const pl=S.plano,hi=hojeIdx(),idx=((hi+off)%7+7)%7,x=DIAS[idx],bl=pl.semana[x.k]||[];
  const dt=new Date();dt.setDate(dt.getDate()+off);

  const m=bl.reduce((a,b)=>a+b.min,0),f=bl.filter(b=>b.feito).length,pct=bl.length?Math.round(f/bl.length*100):0;
  const rot=off===0?"Hoje":off===1?"Amanhã":off===-1?"Ontem":x.n;
  return `<article class="dia-card ${off===0?"hoje":""}" data-off="${off}">
      <header class="dia-h"><div style="min-width:0"><span class="eyebrow">${rot===x.n?esc(dt.toLocaleDateString("pt-BR",{day:"numeric",month:"long"})):x.n+" · "+esc(dt.toLocaleDateString("pt-BR",{day:"numeric",month:"long"}))}</span><h2>${rot}</h2></div>
        <div class="dia-num"><b class="mono">${m?fmtH(m):"Livre"}</b><span class="small muted">${bl.length?`${f} de ${bl.length} blocos`:"sem estudo"}</span></div></header>

        <div class="lst">${bl.length?bl.map(b=>`

// troca de dia com efeito de embaralhar cartas
function mudarDia(novo,dir){
  if(S.editDia){toast("Salve ou cancele a edição do dia antes de trocar.");return}
  novo=Math.max(-7,Math.min(13,novo));if(novo===S.diaOff)return bater(dir);
  const bar=$("#dia-baralho"),velho=bar&&bar.querySelector(".dia-card");
  if(velho){const fant=velho.cloneNode(true);fant.classList.add("fantasma",dir>0?"sai-esq":"sai-dir");fant.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));bar.appendChild(fant)}
  S.diaOff=novo;const fant=bar&&bar.querySelector(".fantasma");
  renderSemana();const nb=$("#dia-baralho");if(fant&&nb){nb.appendChild(fant);setTimeout(()=>fant.remove(),520)}
  const c=nb&&nb.querySelector(".dia-card:not(.fantasma)");if(c)c.classList.add(dir>0?"entra-dir":"entra-esq");
  const chip=$(".dia-chip.on");if(chip)chip.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
}
function bater(dir){const c=$("#dia-baralho .dia-card");if(!c)return;c.classList.remove("bate-esq","bate-dir");void c.offsetWidth;c.classList.add(dir>0?"bate-esq":"bate-dir")}
function ligarDiaSwipe(){
  $("#dia-ant").onclick=()=>mudarDia(S.diaOff-1,-1);$("#dia-prox").onclick=()=>mudarDia(S.diaOff+1,1);
  const vh=$("#dia-hoje");if(vh)vh.onclick=()=>mudarDia(0,S.diaOff>0?-1:1);
  $$("[data-dsel]").forEach(b=>b.onclick=()=>{const o=+b.dataset.dsel;mudarDia(o,o>S.diaOff?1:-1)});
  const palco=$("#dia-palco");let x0=0,y0=0,dx=0,arr=false,id=null;
  const carta=()=>$("#dia-baralho .dia-card:not(.fantasma)");
  palco.addEventListener("pointerdown",e=>{if(S.editDia||e.target.closest("button,input,a,label,select,fieldset"))return;x0=e.clientX;y0=e.clientY;dx=0;arr=false;id=e.pointerId});
  palco.addEventListener("pointermove",e=>{if(id!==e.pointerId)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!arr){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){arr=true;try{palco.setPointerCapture(id)}catch(_){}}else if(Math.abs(dy)>10){id=null;return}else return}
    const c=carta();if(c){c.style.transition="none";c.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`}});
  const fim=e=>{if(id!==e.pointerId)return;id=null;const c=carta();if(c){c.style.transition="";c.style.transform=""}
    if(arr&&Math.abs(dx)>60)mudarDia(S.diaOff+(dx<0?1:-1),dx<0?1:-1)};
  palco.addEventListener("pointerup",fim);palco.addEventListener("pointercancel",fim);
}
document.addEventListener("keydown",e=>{if(S.view!=="semana"||semanaModo()!=="dia"||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"")||document.querySelector(".modal-bg,.alarme"))return;
  if(e.key==="ArrowRight"){e.preventDefault();mudarDia(S.diaOff+1,1)}else if(e.key==="ArrowLeft"){e.preventDefault();mudarDia(S.diaOff-1,-1)}});

async function lerArquivos(files){
  if(!files.length)return;const info=$("#ed-info");
  const imgs=files.filter(f=>/^image\//.test(f.type)),docs=files.filter(f=>!/^image\//.test(f.type));
  if(imgs.length&&!docs.length){escolherModo(()=>analisarImagens(imgs,imgs[0].name),`${imgs.length} ${imgs.length===1?"foto":"fotos"} · a IA vai ler as imagens`,imgs.length===1?imgs[0].name:"Fotos do edital");return}
  info.innerHTML=`<div class="row muted"><span class="spinner"></span>Lendo ${docs.length>1?docs.length+" arquivos":esc(docs[0].name)}…</div><div class="prog" style="margin-top:8px"><i id="rd-p" style="width:3%"></i></div>`;
  try{
    let texto="",pags=0,escaneados=[];
    for(const [n,f] of docs.entries()){let tx="";
      if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){
        if(!window.pdfjsLib)throw new Error("O leitor de PDF não carregou. Recarregue a página ou cole o texto.");
        const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;pags+=doc.numPages;
        for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let last=null,line="";
          let fimX=null;tc.items.forEach(it=>{const tr=it.transform||[0,0,0,0,0,0],y=Math.round(tr[5]),x=tr[4],h=Math.abs(tr[3])||10;
            if(last!==null&&Math.abs(y-last)>2){tx+=line+"\n";line="";fimX=null}
            if(fimX!==null&&x-fimX>h*.18&&!/\s$/.test(line)&&!/^\s/.test(it.str))line+=" ";
            line+=it.str;fimX=x+(it.width||0);last=y;if(it.hasEOL){tx+=line+"\n";line="";fimX=null;last=null}});tx+=line+"\n\n";
          const p=$("#rd-p");if(p)p.style.width=Math.round(((n+i/doc.numPages)/docs.length)*100)+"%"}
        if(tx.replace(/\s+/g,"").length<120)escaneados.push({f,doc})}
      else tx=await f.text();
      texto+=(docs.length>1?`\n\n=== ARQUIVO: ${f.name} ===\n`:"")+tx}
    texto=texto.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
    // PDF escaneado (só imagem): a IA lê as páginas como fotos
    if(texto.replace(/=== ARQUIVO:[^\n]*===/g,"").replace(/\s+/g,"").length<120){
      if(escaneados.length&&iaEditalDisponivel()){info.innerHTML=`<div class="row muted"><span class="spinner"></span>O PDF é escaneado. Preparando as páginas para a IA ler…</div>`;
        const cs=[];for(const x of escaneados)cs.push(...await paginasPdfImagens(x.doc,10-cs.length));escolherModo(()=>analisarImagens(cs,docs[0].name),`PDF escaneado: a IA vai ler ${cs.length} ${cs.length===1?"página":"páginas"} como imagem`,docs.map(f=>f.name).join(", "));return}
      info.innerHTML=`<p class="err">Não encontrei texto neste arquivo. Ele parece ser um PDF escaneado (imagem). Envie fotos das páginas ou cole o texto na aba “Colar texto”.</p>`;return}
    S.editalTexto=texto;
    escolherModo(()=>analisarTexto(texto,docs.map(f=>f.name).join(", ")),`${docs.length>1?docs.length+" arquivos · ":""}${pags?pags+" páginas · ":""}${texto.length.toLocaleString("pt-BR")} caracteres lidos`,docs.map(f=>f.name).join(", "));
  }catch(e){info.innerHTML=`<p class="err">${esc(e.message||"Não foi possível ler o arquivo.")} Tente colar o texto na aba “Colar texto”.</p>`}
}

function progressoEdital(t,s,p){$("#ed-body").innerHTML=`<div class="loadbox"><div class="row"><span class="spinner"></span><b>${esc(t)}</b></div><p class="small muted" id="ed-s">${esc(s)}</p><div class="prog"><i id="ed-p" style="width:${p}%"></i></div></div>`}
function nomeDoEdital(texto,origem){const m=/(CONCURSO P[ÚU]BLICO|PROCESSO SELETIVO|VESTIBULAR|EXAME DE ADMISS[ÃA]O)[^\n]{0,90}/i.exec(texto.slice(0,6000));
  return (m?m[0].replace(/\s+/g," ").trim():String(origem||"Edital").replace(/\.[a-z]+$/i,"")).slice(0,90)}
function lerSemIA(texto,origem){
  const r=extrairLocal(texto),ed=juntarEdital([r],{fonte:"leitura",origem});
  if(!ed.materias.length){toast("Não consegui separar as matérias deste edital. Cole só o conteúdo programático na aba “Colar texto”.");renderEdital();return}

async function analisarTexto(texto,origem){
  if(!iaEditalDisponivel()){progressoEdital("Lendo o edital","Procurando o conteúdo programático e separando as matérias…",50);setTimeout(()=>lerSemIA(texto,origem),50);return}
  const TAM=60000,SOB=800,partes=[];for(let i=0;i<texto.length;i+=TAM-SOB)partes.push(texto.slice(i,i+TAM));
  progressoEdital("Lendo o edital inteiro",`Dividi o edital em ${partes.length} ${partes.length>1?"partes":"parte"}. Analisando a parte 1…`,5);
  const res=[];let falhas=0;
  for(let i=0;i<partes.length;i++){
    $("#ed-s").textContent=`Analisando a parte ${i+1} de ${partes.length}…`;
    try{res.push(await iaJson(promptEditalTrecho(partes[i],i,partes.length)))}
    catch(e){if(e&&e.code==="not_granted"){toast("Você não autorizou o uso da IA.");renderEdital();return}
      if(e&&/rate_limited|ia_desativada|ia_appcheck/.test(e.code||"")){toast(iaErroTxt(e)+" Vou separar os tópicos sem IA.");lerSemIA(texto,origem);return}falhas++}
    $("#ed-p").style.width=Math.round((i+1)/partes.length*100)+"%";
  }
  const ed=juntarEdital(res,{fonte:"edital",origem});
  if(!ed.materias.length){if(!res.length){lerSemIA(texto,origem);return}const loc=extrairLocal(texto);if(loc.materias.length){lerSemIA(texto,origem);return}toast("Não encontrei o conteúdo da prova. Confira se o arquivo é o documento completo.");renderEdital();return}
  if(falhas)toast(`${falhas} parte(s) do edital não puderam ser analisadas; confira os tópicos.`);
  salvarEdital(ed);
}
// fotos do edital ou páginas de PDF escaneado: a IA lê as imagens (até 10 páginas)
function imagemParaIA(fonte){return new Promise((ok,no)=>{const fim=c=>{const u=c.toDataURL("image/jpeg",.82);ok({mime:"image/jpeg",b64:u.split(",")[1]})};
  if(fonte instanceof HTMLCanvasElement)return fim(fonte);
  const img=new Image(),url=URL.createObjectURL(fonte);img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);fim(c)};img.onerror=no;img.src=url})}
async function paginasPdfImagens(doc,max){const out=[];for(let i=1;i<=Math.min(doc.numPages,max);i++){const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),esc_=Math.min(2,1600/Math.max(v0.width,v0.height)),v=pg.getViewport({scale:esc_});
  const c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:v}).promise;out.push(c)}return out}
async function analisarImagens(imgs,origem){
  if(!iaEditalDisponivel()){toast("A leitura de fotos precisa da IA, que não está disponível aqui. Cole o texto do edital.");return}
  imgs=imgs.slice(0,10);progressoEdital("Lendo as páginas com IA",`${imgs.length} ${imgs.length===1?"imagem":"imagens"}…`,30);
  try{let r;
    if(S.sample){const lim=await S.sample.limits().catch(()=>null);if(!lim||!lim.images){toast("Esta visualização não aceita imagens. Cole o texto do edital.");renderEdital();return}
      const arqs=await Promise.all(imgs.slice(0,lim.images.maxCount).map(x=>x instanceof HTMLCanvasElement?new Promise(ok=>x.toBlob(bl=>ok(new File([bl],"pagina.jpg",{type:"image/jpeg"})),"image/jpeg",.82)):x));
      r=await iaJson(promptEditalTrecho("(o conteúdo está nas imagens anexadas)",0,1),{arquivos:arqs})}
    else r=await iaJson(promptEditalTrecho("(o conteúdo está nas imagens anexadas, em ordem)",0,1),{imagens:await Promise.all(imgs.map(imagemParaIA))});
    const ed=juntarEdital([r],{fonte:"edital",origem:origem||"fotos"});if(!ed.materias.length){toast("Não encontrei tópicos nas imagens.");renderEdital();return}salvarEdital(ed)}
  catch(e){toast(iaErroTxt(e));renderEdital()}
}
function ambiguo(r){return r.length>1&&r[1].score>=r[0].score-.01&&r[0].e.id.replace(/\d$/,"")===r[1].e.id.replace(/\d$/,"")&&!r[0].num}

async function buscarPorNome(nome,extra){
  if(!iaEditalDisponivel()){toast("A busca com IA não está disponível aqui. Envie o edital em PDF.");return}S.editalModo=null;
  progressoEdital(`Buscando os tópicos de ${nome}`,"A IA está montando o conteúdo programático…",15);
  try{
    const r=await iaJson(promptPorNome(nome,extra),{tier:"complex",onText:({text})=>{const p=$("#ed-p");if(p)p.style.width=Math.min(95,15+text.length/60)+"%"}});
    const ed=juntarEdital([r],{fonte:"ia",origem:nome});
    if(!ed.materias.length){$("#ed-body").innerHTML=`<div class="empty-state"><b>Não encontrei o conteúdo de “${esc(nome)}”.</b><span>${esc(r&&r.observacao||"A IA não conhece essa prova com segurança.")}</span><span>Envie o edital em PDF ou cole o texto dele.</span><button class="btn" type="button" id="ed-volta">Voltar</button></div>`;$("#ed-volta").onclick=renderEdital;return}
    ed.nome=ed.nome||nome;ed.referencia=String(r.referencia||"");ed.confianca=String(r.confianca||"media");ed.observacao=String(r.observacao||"");
    salvarEdital(ed);
  }catch(e){toast(iaErroTxt(e)+" Tente de novo.");renderEdital()}
}
function juntarEdital(partes,meta){
  const ed={nome:"",banca:"",dataProva:"",cargo:"",materias:[],...meta,criadoEm:new Date().toISOString()};const idx={};
  const obs=[];partes.forEach(r=>{if(!r||typeof r!=="object")return;const pv=r.prova||{};
    const ob=String(r.observacao||"").trim();if(ob&&!obs.includes(ob))obs.push(ob.slice(0,400));
    ["nome","banca","cargo"].forEach(k=>{if(!ed[k]&&pv[k])ed[k]=String(pv[k]).slice(0,120)});
    if(!ed.dataProva&&/^\d{4}-\d{2}-\d{2}$/.test(pv.dataProva||""))ed.dataProva=pv.dataProva;
    (Array.isArray(r.materias)?r.materias:[]).forEach(m=>{if(!m||!m.nome)return;const k=norm(m.nome);
      let alvo=idx[k];if(!alvo){alvo={id:uid(),nome:String(m.nome).slice(0,60),questoes:0,topicos:[]};idx[k]=alvo;ed.materias.push(alvo)}
      if(+m.questoes>alvo.questoes)alvo.questoes=Math.round(+m.questoes);
      (Array.isArray(m.topicos)?m.topicos:[]).forEach(t=>{t=String(t&&t.t||t||"").trim().slice(0,200);if(t&&!alvo.topicos.some(x=>norm(x.t)===norm(t)))alvo.topicos.push({id:uid(),t,feito:false})});
    })});
  ed.materias=ed.materias.filter(m=>m.topicos.length);
  if(obs.length&&!ed.orientacoes)ed.orientacoes=obs.join(" ").slice(0,700);
  return ed;
}
function juntarComAtual(ed){const at=S.edital;if(!at)return ed;const out=clone(at);
  ed.materias.forEach(m=>{const x=out.materias.find(y=>norm(y.nome)===norm(m.nome));if(!x){out.materias.push(m);return}
    m.topicos.forEach(t=>{if(!x.topicos.some(z=>norm(z.t)===norm(t.t)))x.topicos.push(t)});if(m.questoes>x.questoes)x.questoes=m.questoes});
  if(ed.orientacoes)out.orientacoes=[out.orientacoes,ed.orientacoes].filter(Boolean).join(" · ").slice(0,1400);
  if(ed.dataProva&&(!out.dataProva||ed.dataProva<out.dataProva))out.dataProva=ed.dataProva;
  if(out.tri)delete out.tri;return out}
function salvarEdital(ed){if(S.editalModo==="juntar"&&S.edital&&ed.fonte!=="catalogo"){ed=juntarComAtual(ed);S.editalModo=null}S.edital=ed;gravar("edital",ed,true);toast(`Tópicos de ${ed.nome||"prova"} organizados.`);go("topicos")}

function reduzirFoto(file,tam){return new Promise((ok,no)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=tam||160,c=document.createElement("canvas");c.width=c.height=s;const x=c.getContext("2d");const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.82))};img.onerror=no;img.src=url})}

/* ================= Perfil profissional ================= */
const CAPAS={grafite:"linear-gradient(135deg,#1f2937,#4b5563)",oceano:"linear-gradient(135deg,#0ea5e9,#1e3a8a)",floresta:"linear-gradient(135deg,#065f46,#84cc16)",aurora:"linear-gradient(135deg,#7c3aed,#06b6d4)",entardecer:"linear-gradient(135deg,#f97316,#db2777)",lavanda:"linear-gradient(135deg,#c4b5fd,#f0abfc)",areia:"linear-gradient(135deg,#d6c3a3,#a8a29e)",noite:"linear-gradient(135deg,#020617,#312e81)"};
function capaDe(p){return CAPAS[p&&p.capa]||(p&&CAPAS_ESP[p.capa]&&CAPAS_ESP[p.capa][1])||`linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--bg)))`}

function cartaoPerfil(id,p,opts){
  p=p||{};const priv=p.privacidade||{};const mostrarHoras=priv.horas!==false||id===S.uid;
  const meta=[p.objetivo,p.instituicao,p.cidade].filter(Boolean).map(esc);
  const foto=p.foto&&/^data:image\/(jpeg|png|webp);base64,/.test(p.foto)?`<img class="avatar lg" src="${p.foto}" alt="">`:`<span class="avatar lg" aria-hidden="true">${esc(((p.nome||"?").split(/\s+/).map(w=>w[0]||"").join("").slice(0,2)).toUpperCase())}</span>`;
  return `<div class="perfil-card"><div class="capa" style="background:${capaDe(p)}"></div><div class="corpo"><div class="row" style="justify-content:space-between;align-items:flex-end">${comMoldura(p.moldura,foto)}${p.nivel?`<span class="pill solid" style="margin-bottom:6px">Nível ${p.nivel}</span>`:""}</div>
