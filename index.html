<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="16x16" href="icones/favicon-16.png?v=3"><link rel="apple-touch-icon" href="icones/apple-touch-icon.png?v=3"><meta name="theme-color" content="#0a0a0a"><meta name="apple-mobile-web-app-title" content="Logic Academy"><meta name="application-name" content="Logic Academy"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Logic Academy: organizador de estudos com banco de questões oficiais do ENEM, plano semanal, pomodoro, cronômetro, desafios, revisões, estatísticas, grupos de estudo e leitura de editais."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style><title>Logic Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de produtividade — barra lateral fixa à esquerda com a navegação, área principal com cartões discretos; monocromático preto/branco */
:root{
  --bg:#fafafa; --surface:#ffffff; --sunken:#f4f4f5; --fg:#0a0a0a; --muted:#71717a; --line:#e4e4e7; --line-2:#d4d4d8;
  --inv-bg:#0a0a0a; --inv-fg:#fafafa; --hover:#f4f4f5; --ring:rgba(10,10,10,.12); --danger:#dc2626; --ok:#16a34a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.02);
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px; --side:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#111113; --sunken:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-2:#3f3f46;
  --inv-bg:#fafafa; --inv-fg:#09090b; --hover:#1c1c1f; --ring:rgba(250,250,250,.16); --danger:#f87171; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#111113; --sunken:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-2:#3f3f46;
  --inv-bg:#fafafa; --inv-fg:#09090b; --hover:#1c1c1f; --ring:rgba(250,250,250,.16); --danger:#f87171; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
#root{min-height:100%;display:grid}
a{color:inherit}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);
  padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:.9rem;box-shadow:var(--shadow);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.icon{padding:7px}
.btn.danger{color:var(--danger)}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 11px;min-width:0;width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring);outline:none}
textarea{min-height:88px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:500;font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.sm{gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--muted)}
.pill.solid{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:.8rem;border-radius:5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.prog{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .3s}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunken);display:inline-grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--fg);border:1px solid var(--line);overflow:hidden}
.avatar.lg{width:88px;height:88px;font-size:1.6rem}
.avatar.sm{width:24px;height:24px;font-size:.66rem}
.empty-state{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
[hidden]{display:none!important}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 40px)}
.toast{background:var(--inv-bg);color:var(--inv-fg);padding:10px 16px;border-radius:var(--r-sm);font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.err{color:var(--danger);font-size:.86rem}

/* Login */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-l{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:28px;max-width:620px;margin-left:auto;width:100%}
.auth-r{background:var(--inv-bg);color:var(--inv-fg);padding:48px clamp(16px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.auth-r .feat{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.auth-r .feat span{width:36px;height:36px;border-radius:9px;border:1px solid color-mix(in srgb,var(--inv-fg) 25%,transparent);display:grid;place-items:center}
.auth-r p{opacity:.72;font-size:.9rem}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center}
.logo svg{width:16px;height:16px}
.auth-r .logo{background:var(--inv-fg);color:var(--inv-bg)}
.auth h1{font-size:clamp(1.9rem,3.6vw,2.6rem);font-weight:700;letter-spacing:-.03em}

/* Shell com barra lateral */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:14px 12px;gap:6px;overflow-y:auto}
.side .brand{padding:6px 8px 12px}
.nav-sec{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500;font-size:.9rem;cursor:pointer}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a.on{background:var(--sunken);color:var(--fg)}
.nav a .badge{margin-left:auto;font-size:.7rem;font-family:var(--f-mono)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer}
.me:hover{background:var(--hover)}
.me .nm{font-weight:600;font-size:.88rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .sub{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.me>div{min-width:0}
.mini-pomo{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);background:var(--inv-bg);color:var(--inv-fg);cursor:pointer;font-size:.84rem}
.mini-pomo b{font-family:var(--f-mono);font-size:1rem}
.main{min-width:0}
.topbar-m{display:none}
.page{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,3.5vw,36px);padding-block:28px 64px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-h p{color:var(--muted);margin-top:4px}

/* Estatísticas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stat .v{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}
.stat .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

/* Blocos de estudo */
.blist{display:flex;flex-direction:column}
.bitem{display:grid;grid-template-columns:auto 92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bitem:first-child{border-top:0}
.bitem.done .bt{text-decoration:line-through;color:var(--muted)}
.chk{width:18px;height:18px;accent-color:var(--fg);cursor:pointer}
.tipo{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.week-wrap{overflow-x:auto;padding-bottom:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(158px,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.day header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day.hoje{border-color:var(--fg)}
.day.hoje header{background:var(--inv-bg);color:var(--inv-fg);border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.day.hoje header .muted{color:var(--inv-fg);opacity:.7}
.day .lst{display:flex;flex-direction:column;gap:6px;padding:8px}
.blk{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;display:flex;flex-direction:column;gap:3px;font-size:.82rem;position:relative;background:var(--surface)}
.blk.t-revisão{background:var(--sunken)}
.blk.t-simulado{border-style:dashed;border-color:var(--fg)}
.blk .tm{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.blk .mt{font-weight:600;line-height:1.25;padding-right:20px;overflow-wrap:break-word}
.blk .tk{color:var(--muted);font-size:.78rem;line-height:1.35;overflow-wrap:anywhere}
.blk .chk{position:absolute;top:8px;right:8px;width:15px;height:15px}
.blk .play{align-self:flex-start;margin-top:4px}
.blk.done .mt,.blk.done .tk{text-decoration:line-through;opacity:.55}
.day .empty{padding:12px;color:var(--muted);font-size:.8rem}
.bars-h{display:flex;flex-direction:column;gap:10px}
.bars-h .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.86rem}
.bars-h .prog{grid-column:1/-1}

/* Questionário */
.wizard{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:32px 64px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;background:var(--line);border-radius:2px}
.steps span.on{background:var(--fg)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line-2);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,box-shadow .12s}
.opt:hover{border-color:var(--fg)}
.opt.on{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring)}
.opt b{font-size:.92rem}
.opt span{font-size:.78rem;color:var(--muted);line-height:1.35}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{background:transparent;border:1px dashed var(--line-2);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.sug:hover{border-color:var(--fg);color:var(--fg)}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mat .nm{font-weight:500;overflow-wrap:anywhere}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:5px}
.x:hover{background:var(--hover);color:var(--fg)}
.dayrow{display:grid;grid-template-columns:90px minmax(0,1fr) 60px 108px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--fg)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:7px;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 11px;cursor:pointer;font-size:.86rem;background:var(--surface)}
.checks input{accent-color:var(--fg)}
.navq{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}

/* Pomodoro */
.pomo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.pomo-main{display:flex;flex-direction:column;align-items:center;gap:22px;padding:32px 20px}
.ring{position:relative;width:min(300px,72vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .t{font-family:var(--f-mono);font-size:clamp(2.6rem,9vw,3.8rem);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--fg)}
.dots i.on{background:var(--fg)}

/* Tópicos */
.mat-acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.mat-acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:14px;align-items:center}
.mat-acc>summary::-webkit-details-marker{display:none}
.mat-acc[open]>summary{border-bottom:1px solid var(--line)}
.tops{padding:8px 16px 14px;display:flex;flex-direction:column}
.qb-link{margin-left:auto;flex:none;gap:4px;font-size:.75rem}.qb-link .i{width:14px;height:14px}
.top{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem}
.top:first-child{border-top:0}
.top.done span{color:var(--muted);text-decoration:line-through}
.top .chk{margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunken);cursor:pointer}
.drop.over{border-color:var(--fg)}
.loadbox{display:flex;flex-direction:column;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--line-2);border-top-color:var(--fg);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Chat e comunidade */
.chat{display:flex;flex-direction:column;height:min(640px,calc(100dvh - 210px));min-height:380px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.msg .h{display:flex;gap:8px;align-items:baseline;font-size:.84rem}
.msg .h b{font-weight:600}
.msg .h time{font-size:.72rem;color:var(--muted)}
.msg .b{overflow-wrap:anywhere;white-space:pre-wrap;font-size:.9rem}
.msg.mine .h b::after{content:" (você)";font-weight:400;color:var(--muted)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-family:var(--f-mono);width:26px;text-align:center;color:var(--muted);font-weight:500}
.li.me-row{background:var(--sunken);border-radius:var(--r-sm);padding-inline:8px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.podium .card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:10px}
.gcard .stack-av{display:flex}
.gcard .stack-av .avatar{margin-left:-8px;border:2px solid var(--surface)}
.gcard .stack-av .avatar:first-child{margin-left:0}
pre.prompt{white-space:pre-wrap;font-family:var(--f-mono);font-size:.76rem;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;max-height:420px;overflow:auto;margin:12px 0 0}
details>summary{cursor:pointer;font-weight:500}
.lock{max-width:520px;margin:40px auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dm-cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dm-cols{grid-template-columns:1fr}}
.overlay{display:none}

@media (max-width:1100px){

}
@media (max-width:860px){

  .shell.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}

  .topbar-m{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}

  .bitem{grid-template-columns:auto minmax(0,1fr) auto}
  .bitem .tmc{grid-column:2;grid-row:2}
  .mat-acc>summary{grid-template-columns:minmax(0,1fr) auto}
  .mat-acc>summary .prog{grid-column:1/-1;grid-row:2}
  .podium{grid-template-columns:1fr}
}
@media (max-width:640px){ .week{grid-template-columns:1fr} }
@media (max-width:480px){ .stats{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ===== Personalização: cor de destaque, estilos de interface, texto, densidade e cantos ===== */
:root{--accent:var(--inv-bg);--accent-fg:var(--inv-fg);--accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);--f-head:var(--f-body)}
html{font-size:16px}
:root[data-fonte="p"]{font-size:14.5px} :root[data-fonte="g"]{font-size:17.5px} :root[data-fonte="xg"]{font-size:19px}
body{font-size:.906rem}
h1,h2,h3,h4{font-family:var(--f-head)}
:root[data-cantos="reto"]{--r:3px;--r-sm:2px} :root[data-cantos="arredondado"]{--r:18px;--r-sm:12px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pill.solid{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.prog i{background:var(--accent)}
.ring .fgc{stroke:var(--accent)}
.mini-pomo{background:var(--accent);color:var(--accent-fg)}
.day.hoje{border-color:var(--accent)} .day.hoje header{background:var(--accent);color:var(--accent-fg)} .day.hoje header .muted{color:var(--accent-fg)}
.nav a.on{background:var(--accent-soft);color:var(--fg)} .nav a.on svg{color:var(--accent)}
.chk,input[type=range],.checks input{accent-color:var(--accent)}
.tabs button.on{border-bottom-color:var(--accent)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.steps span.on{background:var(--accent)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* densidade compacta */
:root[data-densidade="compacto"] .card{padding:14px} :root[data-densidade="compacto"] .stat{padding:12px}
:root[data-densidade="compacto"] .page{padding-block:18px 48px} :root[data-densidade="compacto"] .li{padding-block:6px}
:root[data-densidade="compacto"] .nav a{padding-block:5px} :root[data-densidade="compacto"] .stack{gap:12px} :root[data-densidade="compacto"] .page-h{margin-bottom:16px}
/* Suave */
:root[data-estilo="suave"]{--f-body:"Nunito",ui-sans-serif,system-ui,sans-serif;--f-head:"Nunito",ui-sans-serif,system-ui,sans-serif;--r:18px;--r-sm:12px;--shadow:0 6px 24px rgba(0,0,0,.06)}
:root[data-estilo="suave"] body{background:color-mix(in srgb,var(--accent) 5%,var(--bg))}
:root[data-estilo="suave"] .card,:root[data-estilo="suave"] .stat,:root[data-estilo="suave"] .day{border-color:transparent}
:root[data-estilo="suave"] .btn{border-radius:999px} :root[data-estilo="suave"] h1{font-weight:800}
/* Vidro */
:root[data-estilo="vidro"] body{background:radial-gradient(1200px 600px at 0% 0%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 60%),radial-gradient(900px 500px at 100% 10%,color-mix(in srgb,#5b8def 22%,transparent),transparent 60%),radial-gradient(900px 600px at 50% 100%,color-mix(in srgb,#c06bff 16%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
:root[data-estilo="vidro"] .card,:root[data-estilo="vidro"] .stat,:root[data-estilo="vidro"] .day,:root[data-estilo="vidro"] .mat-acc,:root[data-estilo="vidro"] .side,:root[data-estilo="vidro"] .topbar-m,:root[data-estilo="vidro"] .composer{background:color-mix(in srgb,var(--surface) 58%,transparent);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-color:color-mix(in srgb,var(--fg) 10%,transparent)}
:root[data-estilo="vidro"]{--r:16px;--r-sm:10px}
/* Editorial */
:root[data-estilo="editorial"]{--f-head:"Fraunces",Georgia,"Times New Roman",serif;--f-body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;--r:4px;--r-sm:3px;--shadow:none}
:root[data-estilo="editorial"] h1{font-size:2.1rem;font-weight:600;letter-spacing:-.02em} :root[data-estilo="editorial"] h2,:root[data-estilo="editorial"] h3{font-weight:600}
:root[data-estilo="editorial"] .page-h{border-bottom:1px solid var(--fg);padding-bottom:14px}
/* Terminal */
:root[data-estilo="terminal"]{--f-body:"JetBrains Mono",ui-monospace,Menlo,monospace;--f-head:"JetBrains Mono",ui-monospace,Menlo,monospace;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--r:0px;--r-sm:0px;--shadow:none}
:root[data-estilo="terminal"] body{font-size:.84rem} :root[data-estilo="terminal"] .page-h h1::before{content:"> ";color:var(--accent)}
:root[data-estilo="terminal"] .card,:root[data-estilo="terminal"] .stat,:root[data-estilo="terminal"] .day,:root[data-estilo="terminal"] .btn{border-width:1.5px}
:root[data-estilo="terminal"] h1,:root[data-estilo="terminal"] h2,:root[data-estilo="terminal"] h3{letter-spacing:0}
/* Alto contraste */
:root[data-estilo="contraste"]{--muted:#2b2b2b;--line:#111;--line-2:#000;--shadow:none}
@media (prefers-color-scheme: dark){:root[data-estilo="contraste"]:not([data-theme="light"]){--muted:#e6e6e6;--line:#f5f5f5;--line-2:#fff;--bg:#000;--surface:#000;--sunken:#111}}
:root[data-estilo="contraste"][data-theme="dark"]{--muted:#e6e6e6;--line:#f5f5f5;--line-2:#fff;--bg:#000;--surface:#000;--sunken:#111}
:root[data-estilo="contraste"] .card,:root[data-estilo="contraste"] .stat,:root[data-estilo="contraste"] .day,:root[data-estilo="contraste"] .btn,:root[data-estilo="contraste"] input,:root[data-estilo="contraste"] select,:root[data-estilo="contraste"] textarea{border-width:2px}
:root[data-estilo="contraste"] :focus-visible{outline:3px solid var(--accent);outline-offset:3px} :root[data-estilo="contraste"] .page a{text-decoration:underline}
/* Página Aparência */
.estilos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.est{border:1.5px solid var(--line-2);border-radius:var(--r);padding:10px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.est.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.est .mock{height:84px;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:28% 1fr;border:1px solid rgba(127,127,127,.25)}
.est .mock i{display:block}
.cores{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cor{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-2);cursor:pointer;position:relative}
.cor.on{box-shadow:0 0 0 2.5px var(--fg)}
.cor.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--cf,#fff)}
/* Perfil */
.perfil-card{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.perfil-card .capa{height:110px}
.perfil-card .corpo{padding:0 20px 18px;margin-top:-44px;display:flex;flex-direction:column;gap:8px}
.perfil-card .avatar.lg{border:4px solid var(--surface);width:88px;height:88px}
.perfil-card .handle{color:var(--muted);font-size:.88rem}
.perfil-card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.84rem}
.perfil-card .nums{display:flex;gap:20px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.perfil-card .nums b{display:block;font-size:1.1rem}
.capas{display:flex;gap:8px;flex-wrap:wrap}
.capa-opt{width:54px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line-2)}
.capa-opt.on{border-color:var(--fg)}
.perfil-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.perfil-grid>.sticky{position:sticky;top:20px}
.sec-t{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:-4px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.tg{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg:checked{background:var(--accent)} .tg:checked::after{transform:translateX(18px)}
[data-perfil]{cursor:pointer}
@media (max-width:860px){.perfil-grid{grid-template-columns:1fr}.perfil-grid>.sticky{position:static}}

/* ===== Desafios e recompensas ===== */
.fr{display:inline-grid;place-items:center;border-radius:50%;padding:2px;flex:none;line-height:0}
.fr>.avatar{border:2px solid var(--surface)}
.desafios{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.desafio{display:flex;flex-direction:column;gap:10px}
.desafio.feito{opacity:.75}
.desafio.bloq .des-ic{opacity:.5}
.des-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.colecao{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface)}
.item.bloq .item-prev{filter:grayscale(1);opacity:.4}
.item.uso{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item-prev{min-height:60px;display:grid;place-items:center}
.nivel-card{background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface)}
.celebra{position:relative;overflow:hidden}
.confete{position:absolute;inset:0;pointer-events:none}
.confete i{position:absolute;top:-10px;left:50%;width:8px;height:12px;border-radius:2px;background:hsl(var(--h) 85% 60%);transform:translateX(var(--x));animation:cai 1.4s var(--d) ease-in forwards}
@keyframes cai{to{transform:translate(calc(var(--x)*3),360px) rotate(540deg);opacity:0}}
.titulo-pill{display:inline-flex;margin-top:4px}
.emblemas{display:flex;gap:6px;flex-wrap:wrap}

/* ===== Banco de questões ===== */
.qb-resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.qb-resumo .stat{padding:12px 14px}.qb-resumo .v{font-size:1.25rem}
.qb-filtros{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.qb-busca{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 12px;background:var(--surface)}
.qb-busca:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qb-busca .i{width:18px;height:18px;color:var(--muted);flex:none}
.qb-busca input{border:0;box-shadow:none!important;padding:10px 0;background:transparent;flex:1;min-width:0}
.qb-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.qb-chips::-webkit-scrollbar{display:none}
.qb-chip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:.86rem;cursor:pointer;white-space:nowrap}
.qb-chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.qb-sel{display:grid;grid-template-columns:1fr 1fr 2fr .8fr 1fr;gap:10px}
.qb-sel label{display:flex;flex-direction:column;gap:4px;min-width:0}
.qb-sel label>span{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.qb-sel select{width:100%;min-width:0}
.qb-cols{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:16px;align-items:start}
.qb-lista{display:flex;flex-direction:column;gap:8px;max-height:calc(100dvh - 120px);overflow-y:auto;position:sticky;top:16px;padding:2px 4px 2px 2px}
.qb-cont{padding:0 2px 2px}
.qb-item{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;font:inherit;color:var(--fg);transition:border-color .12s,box-shadow .12s}
.qb-item:hover{border-color:var(--line-2)}
.qb-item.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qb-item .pill{font-size:.72rem}
.qb-top{font-weight:600}
.qb-res{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qb-st{font-size:.75rem;font-weight:600;display:inline-flex;align-items:center;gap:3px;color:var(--muted)}
.qb-st .i{width:13px;height:13px}
.qb-st.ok{color:var(--ok,#16a34a)}.qb-st.no{color:var(--danger,#dc2626)}
.qb-vazio{align-items:center;text-align:center;padding:48px 24px;color:var(--muted)}
.qb-vazio .i{width:36px;height:36px}
.qb-det{display:flex;flex-direction:column;gap:14px}
.qb-det-top{gap:8px;align-items:center;flex-wrap:nowrap}
.qb-voltar{display:none}
.qb-texto,.qb-enun{line-height:1.65;overflow-wrap:anywhere}
.qb-texto p,.qb-enun p{margin:0 0 .7em}
.qb-texto img,.qb-at img{max-width:100%;height:auto;border-radius:6px;background:#fff;display:block;margin:6px 0}
.qb-enun{font-weight:600}
.qb-img-falha{border:1px dashed var(--line-2);border-radius:8px;padding:12px;margin:6px 0}
.qb-alts{display:flex;flex-direction:column;gap:8px}
.qb-alt{display:flex;align-items:stretch;gap:6px}
.qb-alt-b{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 12px;font:inherit;cursor:pointer;min-width:0}
.qb-alt-b:hover:not(:disabled){border-color:var(--line-2)}
.qb-alt-b:disabled{cursor:default}
.qb-l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;border:1.5px solid var(--line-2)}
.qb-at{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.qb-at p{margin:0}
.qb-alt.on .qb-alt-b{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qb-alt.on .qb-l{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.qb-alt.certa .qb-alt-b{border-color:#16a34a;background:color-mix(in srgb,#16a34a 10%,var(--surface))}
.qb-alt.certa .qb-l{background:#16a34a;border-color:#16a34a;color:#fff}
.qb-alt.errada .qb-alt-b{border-color:#dc2626;background:color-mix(in srgb,#dc2626 10%,var(--surface))}
.qb-alt.errada .qb-l{background:#dc2626;border-color:#dc2626;color:#fff}
.qb-alt.cortada .qb-at{text-decoration:line-through;opacity:.45}
.qb-cut{align-self:center;opacity:.55}.qb-cut:hover{opacity:1}
.qb-resultado{border-radius:var(--r-sm);padding:10px 14px;border:1px solid}
.qb-resultado.ok{border-color:#16a34a;background:color-mix(in srgb,#16a34a 10%,var(--surface))}
.qb-resultado.no{border-color:#dc2626;background:color-mix(in srgb,#dc2626 9%,var(--surface))}
.qb-acoes{gap:8px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:1100px){.qb-sel{grid-template-columns:1fr 1fr 1fr}.qb-sel-t{grid-column:1/-1;order:-1}}
@media (max-width:860px){
  .qb-cols{grid-template-columns:1fr}
  .qb-lista{position:static;max-height:none;overflow:visible;padding:0}
  .qb-com-sel .qb-lista,.qb-com-sel .qb-resumo,.qb-com-sel .qb-filtros,.qb-com-sel .page-h,.qb-com-sel>.hint{display:none}
  .qb-page:not(.qb-com-sel) .qb-det-wrap{display:none}
  .qb-voltar{display:inline-flex}
  .qb-det{border-radius:0;margin:0 -16px;border-left:0;border-right:0;padding:14px 16px}
  .qb-acoes{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--surface);margin:0 -16px -14px;padding:10px 16px}
}
@media (max-width:640px){.qb-resumo{grid-template-columns:1fr 1fr}.qb-sel{grid-template-columns:1fr 1fr}.qb-resumo .v{font-size:1.1rem}}
/* ===== Mentoria ===== */
.mentor-chat{display:flex;flex-direction:column;padding:0;overflow:hidden;height:calc(100dvh - 230px);min-height:360px}
.mentor-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.mt{max-width:min(640px,88%);padding:10px 14px;border-radius:16px;line-height:1.55;overflow-wrap:anywhere}
.mt p{margin:0 0 .5em}.mt p:last-child{margin:0}.mt ul,.mt ol{margin:.2em 0 .6em;padding-left:1.3em}.mt li{margin:.15em 0}
.mt.eu{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px;white-space:pre-wrap}
.mt.ia{align-self:flex-start;background:var(--sunken);border-bottom-left-radius:4px}
.mentor-vazio{margin:auto;align-items:center;text-align:center;max-width:460px;color:var(--fg)}
.mentor-vazio>.i{width:40px;height:40px}
.mentor-vazio .pill{cursor:pointer}
.mentor-comp{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding:10px;margin:0;border-radius:0}
.mentor-comp textarea{flex:1;resize:none;min-height:42px}
/* ===== Barra inferior no celular ===== */
.tabbar{display:none}
@media (max-width:860px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font:inherit;font-size:.68rem;color:var(--muted);text-decoration:none;background:none;border:0;border-radius:10px;cursor:pointer;position:relative;min-width:0}
  .tabbar .i{width:22px;height:22px}
  .tabbar .on{color:var(--fg);font-weight:600}
  .tabbar .on .i{color:var(--accent)}
  .tabbar .badge{position:absolute;top:2px;right:calc(50% - 20px);font-size:.62rem;padding:0 5px;min-width:16px}
  .tabbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
  .sr-mob{display:none}
}

/* ===== Matérias: dificuldade e prioridade (cartões que se ajustam a fontes grandes) ===== */
.mat.mat2{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mat.mat2.fora{opacity:.55}
.mat2-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mat2-h .nm{font-weight:600;min-width:0;overflow-wrap:break-word;hyphens:auto}
.mat2 .x{flex:none;width:2.2rem;height:2.2rem;border-radius:50%}
.mat2-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px 16px}
.mat2-c{display:flex;flex-direction:column;gap:6px;min-width:0}
.mat2-l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.mat2-l b{color:var(--fg);font-weight:600}
.escala{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.escala.e3{grid-template-columns:repeat(3,minmax(0,1fr))}
.escala button{min-height:2.5rem;min-width:0;border:0;background:transparent;border-radius:calc(var(--r-sm) - 2px);font:inherit;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.escala button:hover{color:var(--fg)}
.escala button.on{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow)}
/* fontes grandes: componentes segmentados quebram linha em vez de vazar */
.seg{flex-wrap:wrap;max-width:100%}
.seg button{min-height:2rem}

/* fontes grandes: cartões de números se reorganizam em vez de espremer */
.stat-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stat-meta>div:last-child{min-width:0;flex:1 1 6rem}
.stat .v{overflow-wrap:anywhere}
@media (max-width:640px){.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr))}}
@media (max-width:860px){.tabbar a,.tabbar button{font-size:clamp(10px,.68rem,12.5px)}.tabbar .i{width:22px;height:22px;flex:none}}

.qb-niveis{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qb-niveis>span{font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;margin-right:2px}
.qb-chip.facil.on{background:#15803d;border-color:#15803d;color:#fff}
.qb-chip.medio.on{background:#b45309;border-color:#b45309;color:#fff}
.qb-chip.dificil.on{background:#b91c1c;border-color:#b91c1c;color:#fff}
.qb-nv{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid}
.qb-nv::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.qb-nv.facil{color:#15803d;border-color:color-mix(in srgb,#15803d 40%,transparent);background:color-mix(in srgb,#15803d 10%,transparent)}
.qb-nv.medio{color:#b45309;border-color:color-mix(in srgb,#b45309 40%,transparent);background:color-mix(in srgb,#b45309 10%,transparent)}
.qb-nv.dificil{color:#b91c1c;border-color:color-mix(in srgb,#b91c1c 40%,transparent);background:color-mix(in srgb,#b91c1c 10%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qb-nv.facil{color:#4ade80}:root:not([data-theme="light"]) .qb-nv.medio{color:#fbbf24}:root:not([data-theme="light"]) .qb-nv.dificil{color:#f87171}}
:root[data-theme="dark"] .qb-nv.facil{color:#4ade80}:root[data-theme="dark"] .qb-nv.medio{color:#fbbf24}:root[data-theme="dark"] .qb-nv.dificil{color:#f87171}
@media (max-width:640px){.qb-niveis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.qb-niveis>span{grid-column:1/-1}.qb-niveis .qb-chip{padding:7px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis}}

/* ===== Alarme do pomodoro ===== */
.alarme{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:alarme-in .2s ease-out}
.alarme-box{width:min(420px,100%);background:var(--surface);color:var(--fg);border-radius:calc(var(--r) + 8px);padding:28px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.alarme-box h2{font-size:1.5rem}.alarme-box p{color:var(--muted);margin:0}
.alarme-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);animation:alarme-pulso 1s ease-in-out infinite}
.alarme-ic .i{width:38px;height:38px}
.alarme-parar{width:100%;min-height:3.2rem;font-size:1.05rem;margin-top:8px;justify-content:center}
@keyframes alarme-pulso{0%,100%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{transform:scale(1.08) rotate(-6deg);box-shadow:0 0 0 18px transparent}}
@keyframes alarme-in{from{opacity:0}to{opacity:1}}

/* ===== Minha semana: um dia por vez ===== */
.dias-tira{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.dia-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--muted);font:inherit;cursor:pointer;position:relative;min-width:0;transition:transform .15s,background .15s,color .15s}
.dia-chip span{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.dia-chip b{font-size:1.15rem;color:var(--fg);line-height:1.1}
.dia-chip i{width:6px;height:6px;border-radius:50%;background:transparent;position:absolute;bottom:4px}
.dia-chip i.tem{background:var(--line-2)}.dia-chip i.ok{background:#16a34a}
.dia-chip.hoje{border-color:var(--accent)}
.dia-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);transform:translateY(-2px);box-shadow:var(--shadow)}
.dia-chip.on b{color:var(--accent-fg)}.dia-chip.on i.tem{background:color-mix(in srgb,var(--accent-fg) 60%,transparent)}
.dia-palco{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dia-seta{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.dia-baralho{position:relative;min-width:0;display:grid}
.dia-baralho::before,.dia-baralho::after{content:"";position:absolute;left:14px;right:14px;top:10px;bottom:-8px;border-radius:calc(var(--r) + 6px);background:var(--surface);border:1px solid var(--line);z-index:0}
.dia-baralho::after{left:28px;right:28px;bottom:-16px;opacity:.6}
.dia-card{grid-area:1/1;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);min-width:0;transition:transform .25s ease;will-change:transform}
.dia-card.hoje{border-color:var(--accent)}
.dia-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dia-h h2{font-size:1.7rem;margin-top:2px}
.dia-num{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.dia-num b{font-size:1.2rem}
.dia-card .lst{display:flex;flex-direction:column;gap:10px}
.dia-card .blk{font-size:.95rem;padding:12px 14px;gap:4px;border-radius:var(--r)}
.dia-card .blk .tm{font-size:.8rem}.dia-card .blk .tk{font-size:.88rem}
.dia-card .blk .chk{width:22px;height:22px;top:12px;right:12px}
.dia-card .blk .mt{font-size:1.05rem;padding-right:30px}
.dia-aviso{margin:0;padding:8px 12px;border-radius:var(--r-sm);background:var(--sunken)}
.dia-vazio{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 10px;text-align:center}
.dia-vazio .i{width:32px;height:32px;color:var(--muted)}
.dia-dica{text-align:center;margin-top:22px}
/* efeito de embaralhar: o cartão antigo sai girando para o lado e o novo entra por baixo do baralho */
.dia-card.fantasma{z-index:2;pointer-events:none}
.dia-card.sai-esq{animation:sai-esq .5s cubic-bezier(.4,0,.2,1) forwards}
.dia-card.sai-dir{animation:sai-dir .5s cubic-bezier(.4,0,.2,1) forwards}
.dia-card.entra-dir{animation:entra-dir .5s cubic-bezier(.2,.8,.2,1)}
.dia-card.entra-esq{animation:entra-esq .5s cubic-bezier(.2,.8,.2,1)}
.dia-card.bate-esq{animation:bate .35s}.dia-card.bate-dir{animation:bate .35s reverse}
@keyframes sai-esq{0%{transform:none;opacity:1}45%{transform:translateX(-62%) rotate(-9deg) scale(.96);opacity:1}100%{transform:translateX(-12%) translateY(14px) rotate(-3deg) scale(.86);opacity:0}}
@keyframes sai-dir{0%{transform:none;opacity:1}45%{transform:translateX(62%) rotate(9deg) scale(.96);opacity:1}100%{transform:translateX(12%) translateY(14px) rotate(3deg) scale(.86);opacity:0}}
@keyframes entra-dir{0%{transform:translateY(16px) scale(.9) rotate(2deg);opacity:.2}60%{transform:translateY(-3px) scale(1.01)}100%{transform:none;opacity:1}}
@keyframes entra-esq{0%{transform:translateY(16px) scale(.9) rotate(-2deg);opacity:.2}60%{transform:translateY(-3px) scale(1.01)}100%{transform:none;opacity:1}}
@keyframes bate{0%,100%{transform:none}30%{transform:translateX(-18px)}60%{transform:translateX(8px)}}
@media (max-width:640px){
  .dia-palco{grid-template-columns:minmax(0,1fr)}.dia-seta{display:none}
  .dia-card{padding:16px}.dia-h h2{font-size:1.45rem}
  .dias-tira{gap:4px}.dia-chip{padding:6px 0 9px}.dia-chip b{font-size:1rem}
}
/* ===== Horas da semana (editor) ===== */
.horas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr));gap:10px}
.hora-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface);transition:opacity .15s}
.hora-card.livre{opacity:.7;background:var(--sunken)}
.hora-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hora-ini{display:flex;align-items:center;gap:6px}.hora-ini input{width:auto;padding:4px 6px}
.hora-ctl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.hora-ctl .btn{width:2.75rem;height:2.75rem;font-size:1.3rem;justify-content:center;border-radius:50%}
.hora-ctl output{text-align:center;font-size:1.25rem;font-weight:700}
.hora-card input[type=range]{width:100%}
.ed-abas{align-self:flex-start}
/* ===== Tablet e celular ===== */
@media (min-width:861px) and (max-width:1180px){:root{--side:216px}.page{padding-inline:24px}}
@media (max-width:860px){
  .page{padding-block:18px 32px}
  .btn{min-height:2.5rem}.btn.sm{min-height:2.1rem}
  .page-h{flex-wrap:wrap;gap:10px}.page-h>.row{flex-wrap:wrap}
  .modal{max-height:calc(100dvh - 24px)}
  input,select,textarea{font-size:max(16px,1rem)} /* evita o zoom automático do iPhone */
}
@media (min-width:600px) and (max-width:860px){.dia-card{padding:24px}.page{padding-inline:28px}}

/* ===== Editar o dia ===== */
.dia-editar{align-self:flex-start;margin-top:4px}
.dia-ed{display:flex;flex-direction:column;gap:12px}
.ed-blk{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.ed-l1{display:flex;gap:8px;align-items:flex-end}
.ed-mat{flex:1;min-width:0}
.ed-ord{display:flex;gap:2px;flex:none}
.ed-ord .btn{width:2.4rem;height:2.4rem;justify-content:center}
.ed-l2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7.5rem),1fr));gap:8px}
.ed-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.ed-f>span{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ed-f select,.ed-f input{width:100%;min-width:0}
.ed-add{align-self:stretch;justify-content:center;border-style:dashed}
.ed-rod{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;position:sticky;bottom:0;background:var(--surface)}
@media (max-width:860px){.ed-rod{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Grupos: foto, capa, bio e papel de parede ===== */
.gav{display:inline-grid;place-items:center;flex:none;border-radius:14px;color:#fff;font-weight:700;object-fit:cover;width:40px;height:40px;font-size:.9rem}
.gav.md{width:48px;height:48px;font-size:1rem}.gav.lg{width:84px;height:84px;font-size:1.6rem;border-radius:20px;border:4px solid var(--surface);box-shadow:var(--shadow)}.gav.xl{width:96px;height:96px;font-size:1.8rem;border-radius:22px}
.g-hero{padding:0;overflow:hidden;margin-bottom:14px}
.g-capa{height:120px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--bg)))}
.g-hero-c{display:flex;gap:16px;align-items:flex-end;padding:0 20px 16px;margin-top:-42px;flex-wrap:wrap}
.g-hero-c h1{font-size:1.6rem;overflow-wrap:anywhere}
.g-acoes{margin-left:auto}
.g-bio{border-top:1px solid var(--line);padding:12px 20px}
.g-bio summary{cursor:pointer;font-weight:600}.g-bio p{white-space:pre-wrap;margin:8px 0 0;color:var(--muted)}
.fundos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.fundo-op{display:flex;flex-direction:column;gap:6px;align-items:center;border:2px solid transparent;border-radius:var(--r);padding:6px;background:none;cursor:pointer;font:inherit;color:var(--fg)}
.fundo-op span{width:100%;height:64px;border-radius:calc(var(--r) - 4px);border:1px solid var(--line);display:grid;place-items:center}
.fundo-op.on{border-color:var(--accent)}.fundo-op small{font-size:.75rem}
.fundo-img{background:var(--sunken)}
.chat.com-fundo .msgs{background:linear-gradient(color-mix(in srgb,var(--surface) 78%,transparent),color-mix(in srgb,var(--surface) 78%,transparent)),var(--g-fundo);background-attachment:local}
.chat.com-fundo .msg>div:last-child{background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:12px;padding:6px 10px}
.msg{position:relative}
.msg-del{position:absolute;top:0;right:0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.75rem;opacity:0;padding:2px 6px;border-radius:6px}
.msg:hover .msg-del,.msg-del:focus,.msg-del.conf{opacity:1}.msg-del.conf{color:var(--danger,#dc2626);font-weight:600}
@media (hover:none){.msg-del{opacity:.55}}
@media (max-width:640px){.g-hero-c{padding:0 14px 14px}.g-acoes{margin-left:0;width:100%}.g-acoes .btn{flex:1;justify-content:center}}

/* celular e app instalado: sem o efeito elástico que arrasta a tela inteira e mostra o fundo vazio */
html,body{overscroll-behavior:none;background:var(--bg)}
.msgs,.qb-lista,.mentor-msgs,.side,.modal{overscroll-behavior:contain}

.aviso-visit{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;border-style:dashed;padding:12px 14px}
.aviso-visit>span{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem}.aviso-visit .i{width:18px;height:18px}

/* selo do reCAPTCHA escondido (o aviso exigido pelo Google fica na tela da mentoria) */
.grecaptcha-badge{visibility:hidden}

.faixa-teste{position:sticky;top:0;z-index:70;background:#f59e0b;color:#111;font-size:.8rem;text-align:center;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px))}
.faixa-teste a{color:#111;font-weight:700}

/* ===== Barra lateral retrátil ===== */
.side{overflow:hidden;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.side .brand{justify-content:space-between;gap:6px}
.side .brand>span:first-child{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.side-toggle{flex:none;color:var(--muted)}
.nav{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
button.nav-sec{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;cursor:pointer;border-radius:6px;text-align:left}
button.nav-sec:hover{color:var(--fg)}
button.nav-sec .i{width:14px;height:14px;transition:transform .2s;transform:rotate(90deg)}
button.nav-sec[aria-expanded="false"] .i{transform:none}
.nav-grp{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.nav-grp>div{overflow:hidden;min-height:0}
.nav-grp.fech{grid-template-rows:0fr}
.nav a span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{flex:none}
@media (min-width:861px){
  .shell{transition:grid-template-columns .22s ease}
  .shell.rec{grid-template-columns:68px minmax(0,1fr)}
  .shell.rec .side{padding-inline:10px}
  .shell.rec .side .brand{flex-direction:column;padding:4px 0 10px}
  .shell.rec .side .brand .brand-nm,.shell.rec .nav a>span,.shell.rec .nav a .badge,.shell.rec .side-foot .btn>span,.shell.rec .me>div,.shell.rec .mini-pomo>:not(svg){display:none}
  .shell.rec button.nav-sec{justify-content:center;padding:8px 0 4px;font-size:0}
  .shell.rec button.nav-sec::before{content:"";display:block;width:22px;height:1px;background:var(--line)}
  .shell.rec button.nav-sec .i{display:none}
  .shell.rec .nav-grp.fech{grid-template-rows:1fr}
  .shell.rec .nav a{justify-content:center;padding:9px 0}
  .shell.rec .side-foot .btn{justify-content:center!important}
  .shell.rec .me{justify-content:center;padding:6px 0}
  .shell.rec .mini-pomo{justify-content:center;padding:8px 0}
  .shell.rec .side-toggle .i{transform:scaleX(-1)}
}
@media (max-width:860px){
  .side-toggle .i{display:none}.side-toggle::before{content:"✕";font-size:1rem;line-height:1}
  .shell.open{touch-action:pan-y}
  body.menu-aberto{overflow:hidden}
}

/* ===== Neon: cor viva nas bordas, com uma luz que corre devagar ===== */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes neon-gira{to{--ang:360deg}}
@keyframes neon-pulsa{0%,100%{opacity:.55}50%{opacity:1}}
:root[data-neon]{--neon-txt:color-mix(in srgb,var(--neon) 62%,var(--fg));--neon-soft:color-mix(in srgb,var(--neon) 22%,transparent);--neon-glow:0 0 0 1px color-mix(in srgb,var(--neon) 30%,transparent),0 0 18px -4px color-mix(in srgb,var(--neon) 55%,transparent)}
:root[data-neon] .card,:root[data-neon] .stat{position:relative;border-color:color-mix(in srgb,var(--neon) 28%,var(--line));box-shadow:0 0 22px -10px color-mix(in srgb,var(--neon) 70%,transparent),var(--shadow)}
:root[data-neon] .card::after,:root[data-neon] .stat::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 62%,var(--neon) 74%,var(--neon2) 80%,transparent 90% 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:neon-gira 9s linear infinite;filter:drop-shadow(0 0 3px var(--neon))}
:root[data-neon] .card:nth-child(2n)::after,:root[data-neon] .stat:nth-child(2n)::after{animation-duration:11s;animation-delay:-4s}
:root[data-neon] .card:nth-child(3n)::after,:root[data-neon] .stat:nth-child(3n)::after{animation-duration:13s;animation-delay:-7s}
:root[data-neon][data-neon-mov="off"] .card::after,:root[data-neon][data-neon-mov="off"] .stat::after{animation:none;background:linear-gradient(135deg,var(--neon),transparent 35% 65%,var(--neon2))}
:root[data-neon] .modal.card::after,:root[data-neon] .card.flat::after{display:none}
:root[data-neon] .side{border-right-color:color-mix(in srgb,var(--neon) 45%,var(--line));box-shadow:1px 0 18px -8px var(--neon)}
:root[data-neon] .nav a.on{background:var(--neon-soft);box-shadow:inset 3px 0 0 var(--neon),0 0 14px -6px var(--neon);color:var(--fg)}
:root[data-neon] .nav a.on svg{color:var(--neon);filter:drop-shadow(0 0 4px var(--neon))}
:root[data-neon] .btn.primary{box-shadow:0 0 16px -3px color-mix(in srgb,var(--neon) 75%,transparent)}
:root[data-neon] .btn.primary:hover{box-shadow:0 0 24px -2px var(--neon);opacity:1}
:root[data-neon] .prog i{background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 10px var(--neon)}
:root[data-neon] .brand .logo{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#06060a;box-shadow:0 0 14px -2px var(--neon)}
:root[data-neon] .page-h h1{background:linear-gradient(90deg,var(--fg) 35%,var(--neon-txt));-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-neon] .tabbar .on .i{color:var(--neon);filter:drop-shadow(0 0 4px var(--neon))}
:root[data-neon] .topbar-m{border-bottom-color:color-mix(in srgb,var(--neon) 40%,var(--line))}
:root[data-neon] .ring .fgc{filter:drop-shadow(0 0 4px var(--neon))}
:root[data-neon] .tabs button.on{border-bottom-color:var(--neon);text-shadow:0 0 12px color-mix(in srgb,var(--neon) 60%,transparent)}
.neons{display:flex;flex-wrap:wrap;gap:10px}
.neon-op{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 8px 8px;width:86px;cursor:pointer;font:inherit;font-size:.78rem;color:var(--fg)}
.neon-op i{width:38px;height:38px;border-radius:50%;display:block;background:var(--c);box-shadow:0 0 14px var(--c),0 0 4px var(--c)}
.neon-op.off i{background:var(--sunken);box-shadow:none;border:1px dashed var(--line-2)}
.neon-op.on{border-color:var(--c,var(--fg));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--fg)) 25%,transparent)}

/* ===== Cartão Hoje ===== */
.hoje-card{display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hoje-card::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(420px 120px at 0% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);pointer-events:none;border-radius:inherit}
.hoje-card{position:relative}
.hoje-top{display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative}
.hoje-tit{font-size:1.25rem;margin:2px 0 4px}
.hoje-anel{position:relative;flex:none;width:64px;height:64px;display:grid;place-items:center}
.hoje-anel svg{position:absolute;inset:0}.hoje-anel b{font-size:.9rem;font-variant-numeric:tabular-nums}
.hoje-anel .arco{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.hoje-prox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-radius:var(--r);padding:14px;text-align:left;font:inherit;color:var(--fg);width:100%;position:relative}
button.hoje-prox{cursor:pointer}
.hoje-prox>div:not(.hoje-acoes),.hoje-prox>span:not(.hoje-play){display:flex;flex-direction:column;gap:2px}
.hoje-prox b{font-size:1.05rem}
.hoje-play{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent);animation:hoje-pulso 2.4s ease-out infinite}
.hoje-play .i{width:20px;height:20px}
@keyframes hoje-pulso{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hoje-acoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.hoje-ir{padding:10px 18px;font-size:.95rem}
.hoje-relogio{font-size:1.6rem;letter-spacing:.02em}
.hoje-atalhos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.hoje-atalhos::-webkit-scrollbar{display:none}
.hoje-chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 13px;font:inherit;font-size:.84rem;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.hoje-chip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));transform:translateY(-1px)}
.hoje-chip .i{width:16px;height:16px;color:var(--accent)}
.hoje-n{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px;font-size:.72rem}
.hoje-seq{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:9px 12px;border-radius:var(--r-sm);background:color-mix(in srgb,#f97316 10%,var(--surface));border:1px solid color-mix(in srgb,#f97316 30%,var(--line))}
.hoje-seq .i{color:#f97316;flex:none}
.hoje-seq.ok{background:color-mix(in srgb,var(--ok) 9%,var(--surface));border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
.hoje-seq.ok .i{color:var(--ok)}
.hoje-blocos>summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;list-style:none;padding:4px 0}
.hoje-blocos>summary::-webkit-details-marker{display:none}
.hoje-blocos>summary>span:first-child::before{content:"▸ ";display:inline-block;transition:transform .15s}
.hoje-blocos[open]>summary>span:first-child::before{transform:rotate(90deg)}
.hoje-card.completo .hoje-anel .arco{stroke:var(--ok)}
.bitem{transition:background .2s,opacity .3s}
.bitem:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.bitem.feito-agora{opacity:.55}.bitem.feito-agora .bt{text-decoration:line-through}
.chk{transition:transform .15s}.chk:checked{animation:chk-pop .35s}
@keyframes chk-pop{50%{transform:scale(1.35)}}
.faisca{position:fixed;z-index:90;pointer-events:none;width:0;height:0}
.faisca i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);left:-3px;top:-3px;animation:faisca .6s ease-out forwards;transform:rotate(var(--a)) translateY(0)}
.faisca i:nth-child(3n){background:#facc15;box-shadow:0 0 6px #facc15}
@keyframes faisca{to{transform:rotate(var(--a)) translateY(calc(-1 * var(--d)));opacity:0}}
@media (max-width:640px){.hoje-acoes{width:100%;margin-left:0}.hoje-ir{flex:1}.hoje-tit{font-size:1.1rem}}

/* ===== XP no estilo de jogo ===== */
.xp-card{display:flex;gap:18px;align-items:center;background:radial-gradient(500px 160px at 0% 50%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--surface)}
.xp-escudo{position:relative;flex:none;width:84px;height:84px;display:grid;place-items:center}
.xp-escudo svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 55%,transparent))}
.xp-escudo b{position:relative;font-size:1.9rem;font-weight:800;color:var(--accent-fg);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.xp-orbita{position:absolute;inset:-6px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);animation:xp-gira 18s linear infinite}
@keyframes xp-gira{to{transform:rotate(360deg)}}
.xp-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.xp-num{font-size:.9rem;color:var(--muted)}.xp-num b{color:var(--fg);font-size:1.15rem}
.xp-barra{position:relative;height:18px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);overflow:hidden}
.xp-barra>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--neon2,color-mix(in srgb,var(--accent) 60%,#facc15)));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xp-barra>em{position:absolute;top:3px;bottom:3px;width:1px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.xp-brilho{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:xp-brilho 2.8s ease-in-out infinite;mix-blend-mode:overlay;pointer-events:none}
@keyframes xp-brilho{0%{background-position:150% 0}100%{background-position:-100% 0}}
.xp-ganho{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.72rem;font-weight:800;color:var(--fg);animation:xp-ganho 1.6s ease-out forwards;text-shadow:0 0 6px var(--surface)}
@keyframes xp-ganho{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-140%)}}
.xp-rec{color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.xp-stats{gap:14px}.xp-stats span{display:inline-flex;align-items:center;gap:4px}
.xp-link{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;text-decoration:none}
.xp-link .i{width:14px;height:14px}
.xp-card.xp-sobe .xp-escudo{animation:xp-sobe .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes xp-sobe{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
@media (max-width:560px){.xp-card{flex-direction:column;align-items:stretch;text-align:left}.xp-escudo{align-self:center}}
/* comemoração de nível */
.nivel-up{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 35%,rgba(0,0,0,.6)),rgba(0,0,0,.78));animation:nu-entra .25s ease-out;z-index:95}
.nivel-up.saindo{animation:nu-entra .2s ease-in reverse forwards}
@keyframes nu-entra{from{opacity:0}}
.nu-caixa{position:relative;width:min(420px,100%);text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 12px}
.nu-caixa h2{font-size:2rem;color:#fff}.nu-caixa p{opacity:.85}
.nu-eyebrow{font-size:.85rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);text-shadow:0 0 12px var(--accent);animation:nu-pulsa 1.2s ease-in-out infinite}
@keyframes nu-pulsa{50%{opacity:.6}}
.nu-escudo{position:relative;width:150px;height:150px;display:grid;place-items:center;animation:nu-escudo .9s cubic-bezier(.2,1.6,.4,1) both}
.nu-escudo svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 24px var(--accent))}
.nu-escudo b{position:relative;font-size:3.6rem;font-weight:900;color:var(--accent-fg)}
@keyframes nu-escudo{0%{transform:scale(0) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
.nu-raios{position:absolute;left:50%;top:150px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 35%,transparent) 0 8deg,transparent 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 65%);mask:radial-gradient(circle,#000 10%,transparent 65%);animation:xp-gira 14s linear infinite;pointer-events:none;z-index:-1}
.nu-itens{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.nivel-up .btn:not(.primary){background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}

/* ===== Ranking do grupo ===== */
.grank-dica{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.grank-dica>.i{color:var(--accent)}
.gpodio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:560px;margin:6px auto 0;width:100%}
.gpodio-c{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;min-width:0}
.gpodio-c .nm{font-size:.88rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpodio-coroa{height:22px;color:#facc15;filter:drop-shadow(0 0 6px #facc15)}
.gpodio-base{width:100%;border-radius:var(--r-sm) var(--r-sm) 0 0;display:grid;place-items:start center;padding-top:8px;font-weight:800;font-size:1.3rem;color:var(--accent-fg);background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--surface)));animation:gpodio-sobe .7s cubic-bezier(.2,1.2,.4,1) both}
.gpodio-c.p1 .gpodio-base{height:110px;box-shadow:0 0 22px -6px var(--accent)}
.gpodio-c.p2 .gpodio-base{height:80px;opacity:.85;animation-delay:.1s}
.gpodio-c.p3 .gpodio-base{height:60px;opacity:.7;animation-delay:.2s}
@keyframes gpodio-sobe{from{transform:scaleY(0);transform-origin:bottom}}
.grank-li{grid-template-columns:auto minmax(0,1fr) auto}
.grank-bar{margin-top:6px;height:5px}

/* ===== Arquivos no chat do grupo ===== */
.arq-msg{display:flex;align-items:center;gap:10px;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);max-width:420px}
.msg.mine .arq-msg{margin-left:auto}
.arq-msg .nm{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arq-ic{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--sunken));color:var(--accent)}
.arq-img{flex:none;width:96px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunken);padding:0;cursor:zoom-in;display:grid;place-items:center}
.arq-img img{width:100%;height:100%;object-fit:cover;display:block}
.arq-enviando{opacity:.85}
.gchat-up{display:flex;flex-direction:column;gap:8px;padding:0 14px}.gchat-up:not(:empty){padding:10px 14px;border-top:1px solid var(--line)}
.soltar-ov{position:fixed;inset:12px;z-index:80;border:3px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;pointer-events:none}
.soltar-ov>div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px}
.soltar-ov .i{width:44px;height:44px;color:var(--accent);animation:soltar 1s ease-in-out infinite}
.soltar-ov b{font-size:1.2rem}
@keyframes soltar{50%{transform:translateY(-6px)}}
.composer label.btn{flex:none}

/* ===== Mini gráficos do Início ===== */
:root{--c-certa:#2563eb;--c-errada:#ea580c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-certa:#3b82f6}}
:root[data-theme="dark"]{--c-certa:#3b82f6}
.mini-g{display:flex;flex-direction:column}
.mini-g .v{font-size:1.35rem}
.mg-barras{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:64px;margin-top:10px}
.mg-col{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:4px;outline-offset:1px;min-width:0}
.mg-area{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.mg-area>i{display:block;width:100%;max-width:18px;background:color-mix(in srgb,var(--accent) 45%,var(--sunken));border-radius:4px 4px 0 0}
.mg-area>i.hoje{background:var(--accent)}
.mg-col:hover .mg-area>*,.mg-col:focus .mg-area>*{filter:brightness(1.15)}
.mg-col>span{font-size:.62rem;color:var(--muted);line-height:1}
.mg-pilha{width:100%;max-width:18px;display:flex;flex-direction:column;gap:2px}
.mg-pilha b{display:block;min-height:3px}
.mg-pilha b:first-child{border-radius:4px 4px 0 0}
.mg-pilha .ok,.mg-leg i.ok{background:var(--c-certa)}
.mg-pilha .er,.mg-leg i.er{background:var(--c-errada) repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.35) 3px 4.5px)}
.mg-leg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:8px}
.mg-leg span{display:inline-flex;align-items:center;gap:4px}
.mg-leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.mg-leg a{margin-left:auto;color:var(--fg);font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.mg-leg a .i{width:13px;height:13px}
.mg-qv{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.mg-qv .mg-c,.mg-qv .mg-e{font-variant-numeric:tabular-nums}
.mg-qv .mg-e{margin-left:6px}
.mg-pct{font-size:.72rem;font-weight:600;color:var(--fg);white-space:nowrap}
.tip-flut{position:fixed;z-index:120;background:var(--inv-bg);color:var(--inv-fg);font-size:.76rem;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2)}
/* ===== Mentoria em destaque no Início ===== */
.mentor-home{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;position:relative;overflow:hidden;
  background:radial-gradient(520px 200px at 100% 0%,color-mix(in srgb,var(--neon2,var(--accent)) 18%,transparent),transparent 70%),radial-gradient(420px 180px at 0% 100%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--surface);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mh-ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--neon2,color-mix(in srgb,var(--accent) 60%,#7c3aed)));color:var(--accent-fg);box-shadow:0 0 22px -4px var(--accent)}
.mh-ic .i{width:26px;height:26px}
.mh-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.mh-corpo h2{margin:0}
.mh-form{display:flex;gap:8px}
.mh-form input{flex:1;padding:11px 14px;border-radius:999px}
.mh-form .btn{border-radius:999px;padding-inline:16px}
.mh-sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.mh-sugs::-webkit-scrollbar{display:none}
@media (max-width:560px){.mentor-home{flex-direction:column;align-items:stretch}.mh-ic{width:44px;height:44px}.mh-form .btn{padding-inline:12px}}
@media (max-width:480px){.stats .mini-g{grid-column:1/-1;order:2}.mg-barras{height:72px}}
.mh-corpo>*{min-width:0}
/* ===== Caderno de erros ===== */
.qb-caderno{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;border-color:color-mix(in srgb,var(--c-errada) 40%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--c-errada) 8%,var(--surface)),var(--surface) 60%)}
.qb-caderno.zerado{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 8%,var(--surface)),var(--surface) 60%)}
.qb-cad-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qb-cad-top h3{margin:0 0 2px}
.qb-cad-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c-errada);color:#fff}
.qb-caderno.zerado .qb-cad-ic{background:var(--ok)}
.qb-cad-barra{height:8px;border-radius:999px;background:color-mix(in srgb,var(--c-errada) 22%,var(--sunken));overflow:hidden}
.qb-cad-barra i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .6s}
.qb-cad-mats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qb-cad-mats b{color:var(--fg)}
.qb-corr{display:flex;gap:8px;align-items:flex-start;border-radius:var(--r-sm);padding:9px 12px;border:1px solid color-mix(in srgb,var(--c-errada) 45%,var(--line));background:color-mix(in srgb,var(--c-errada) 8%,var(--surface))}
.qb-corr .i{color:var(--c-errada);flex:none;margin-top:2px}
.qb-corr.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.qb-corr.ok .i{color:var(--ok)}

/* ===== Canais de voz ===== */
.voz-painel{display:flex;flex-direction:column;gap:14px}
.voz-painel.ativo{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 14%,transparent)}
.voz-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.voz-top h3{margin:0}
.voz-ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--sunken));color:var(--accent)}
.voz-painel.ativo .voz-ic{background:var(--ok);color:#fff}
.voz-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

/* Interpretação do que a pessoa digitou: apelidos, números romanos/ordinais, erros de digitação e estado */
const STOP=new Set("a o os as de da do das dos e em para pra pro prova provas concurso concursos vestibular exame quero vou fazer estudar estudo estou me preparando preparar no na nos nas um uma modulo etapa fase serie ano edital cargo".split(" "));
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function tokens(s){
  s=norm(s).replace(/[^a-z0-9 ]/g," ").replace(/\b(\d)\s*[oaº°ª]\b/g,"$1").replace(/(\D)(\d)\b/g,"$1 $2");
  const map={i:"1",ii:"2",iii:"3",primeiro:"1",primeira:"1",segundo:"2",segunda:"2",terceiro:"3",terceira:"3",um:"1",dois:"2",tres:"3"};
  return s.split(/\s+/).filter(Boolean).map(t=>map[t]||t).filter(t=>!STOP.has(t));
}
function interpretar(q){
  const qt=tokens(q);if(!qt.length)return [];
  const num=qt.find(t=>/^[123]$/.test(t));const words=qt.filter(t=>!/^\d+$/.test(t));
  let uf=words.find(t=>UFS[t]&&t!=="pr"&&t!=="pe"||UFS[t]&&words.length>1);if(!uf)uf=Object.keys(UFS).find(k=>{const ws=norm(UFS[k]).split(" ").filter(w=>!STOP.has(w));return ws.length>0&&ws.every(w=>words.includes(w))});
  if(uf){const tira=new Set([uf,...norm(UFS[uf]).split(" ")]);const w2=words.filter(w=>!tira.has(w));if(w2.length)words.splice(0,words.length,...w2)}
  const res=[];
  CATALOGO.forEach(e=>{
    let best=0;
    e.al.forEach(a=>{const at=tokens(a).filter(t=>!/^\d+$/.test(t));if(!at.length||!words.length)return;
      let hit=0;words.forEach(w=>{if(at.includes(w))hit+=1;else if(w.length>=4&&at.some(x=>x.length>=4&&(lev(w,x)<=1||x.startsWith(w)||w.startsWith(x))))hit+=.85;else if(w.length>=3&&at.some(x=>x.startsWith(w)))hit+=.6});
      const cobre=hit/words.length,completo=hit/at.length;best=Math.max(best,cobre*.7+completo*.3)});
    if(e.gen&&uf&&best>=.4)best=Math.min(1,best+.2);
    if(uf&&e.uf&&e.uf!=="BR"&&e.uf.toLowerCase()!==uf)best*=.5;
    if(e.num){if(num)best=+num===e.num?best+.15:best*.35;}
    if(best>=.5)res.push({e,score:best});
  });
  res.sort((a,b)=>b.score-a.score||((a.e.num||0)-(b.e.num||0)));
  return res.slice(0,8).map(r=>({...r,uf:r.e.gen&&uf?uf:null,num}));
}
