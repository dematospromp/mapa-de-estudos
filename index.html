    ${(p.emblemas||[]).filter(k=>EMBLEMAS[k]).length?`<div class="emblemas">${p.emblemas.filter(k=>EMBLEMAS[k]).map(k=>`<span class="pill" style="gap:5px">${ib(EMBLEMAS[k][1],13)}${esc(EMBLEMAS[k][0])}</span>`).join("")}</div>`:""}
    ${meta.length?`<div class="meta">${meta.map(m=>`<span>${m}</span>`).join("")}</div>`:""}
    ${p.bio?`<p style="overflow-wrap:anywhere">${esc(p.bio)}</p>`:opts&&opts.preview?`<p class="small muted">Sua bio aparece aqui.</p>`:""}
    ${mostrarHoras?`<div class="nums"><div><b>${fmtH(minTotalR(id))}</b><span class="small muted">no total</span></div><div><b>${fmtH(minPeriodo(id,7))}</b><span class="small muted">7 dias</span></div><div><b>${sequenciaDe(id)}</b><span class="small muted">dias seguidos</span></div></div>`:`<p class="small muted">Esta pessoa prefere não mostrar o tempo de estudo.</p>`}
    ${opts&&opts.acoes||""}</div></div>`;

function iniciarConquistasSrv(){

async function criarConquistasSrv(ref){
  const zero={xp:0,n:0,nivel:1,itens:{},ultimo:""};try{await ref.set(zero)}catch(e){console.warn("conquistas",e&&e.code);return}
  if(!S.srv)S.srv={...zero};
  // migração: desafios já resgatados neste período (no aparelho) são conferidos de novo pelo servidor
  const ant=(S.conq&&S.conq.resgatados)||{},hoje=dataISO(),seg=segundaDaSemana(),mes=hoje.slice(0,7);
  Object.keys(ant).forEach(id=>{const [t,per,k]=id.split(":");if(!(t==="d"&&per===hoje||t==="w"&&per===seg||t==="m"&&per===mes))return;const def=DEF_SRV[t+"-"+k];if(!def)return;
    resgatarSrv(t,k,def.alvo?{alvo:def.alvoMin}:{}).catch(()=>{})});
  if(S.conq&&S.conq.xp)toast("Seus desafios agora são guardados e conferidos pelo servidor. Conquistas permanentes são reaplicadas a partir do tempo de estudo registrado.");
}
// um resgate por vez: o XP enviado precisa bater com o que está no servidor
function resgatarSrv(tipo,k,extra){
  const job=SRV.fila.then(async()=>{
    const def=DEF_SRV[tipo+"-"+k];if(!def)throw {code:"desafio-desconhecido"};if(!S.srv)throw {code:"sem-conquistas"};
    const p=periodosBR(),periodo=tipo==="d"?p.dia:tipo==="w"?p.semana:tipo==="m"?p.mes:0,rid=`${tipo}-${periodo}-${k}`;
    if(S.resg[rid])return {ja:true,rid};
    const antes=S.srv.xp||0,xp=antes+def.xp,nivel=nivelDe(xp),n=(S.srv.n||0)+1,FV=firebase.firestore.FieldValue;
    const doc={tipo,k,periodo,xp:def.xp,itens:def.itens,em:FV.serverTimestamp(),...(extra||{})},up={ultimo:rid,xp,n,nivel};def.itens.forEach(i=>up["itens."+i]=true);
    const b=S.db.batch();b.set(S.db.collection("resgates").doc(S.uid).collection("itens").doc(rid),doc);b.update(S.db.collection("conquistas").doc(S.uid),up);
    await b.commit();
    const novos=def.itens.filter(i=>!(S.srv.itens||{})[i]);
    S.srv={...S.srv,xp,n,nivel,ultimo:rid,itens:{...(S.srv.itens||{}),...Object.fromEntries(def.itens.map(i=>[i,true]))}};S.resg={...S.resg,[rid]:{...doc,em:Date.now()}};S.gCache=null;
    return {rid,novos,xp:def.xp,nivel,subiu:nivel>nivelDe(antes)};
  });
  SRV.fila=job.catch(()=>{});return job;
}
// conquistas permanentes e itens de nível: resgatados sozinhos quando o servidor já pode confirmar
function verificarConquistasSrv(silencioso){
  if(!S.srv||!S.resgOk||!S.rankOk||!S.pomoLog)return;
  const e=estatGamif(),r=S.soc.ranking[S.uid]||{},g=G(),agora=Date.now(),tarefas=[],livre=id=>!SRV.tentados[id]||agora-SRV.tentados[id]>120000;

  tarefas.forEach(([t,k,c])=>{SRV.tentados[t+"-"+k]=agora;

/* ================= Jogo limpo: anti-trapaça ================= */
const LIMITE_DIA=960; // 16 horas
const tsMs=v=>typeof v==="number"?v:v&&typeof v.toMillis==="function"?v.toMillis():v&&v.seconds?v.seconds*1000:Date.now();
function riscoDe(r,p){
  if(!r)return {score:0,nivel:"baixo",motivos:[]};
  const m=[];let sc=0;const dias=r.dias||{},vals=Object.values(dias).map(Number).filter(x=>!isNaN(x));
  const maxD=Math.max(0,...vals);
  if(maxD>LIMITE_DIA){sc+=60;m.push("Mais de 16 horas registradas em um único dia")}else if(maxD>720){sc+=25;m.push("Mais de 12 horas em um único dia")}
  let s7=0;for(let i=0;i<7;i++)s7+=dias[diasAtras(i)]||0;if(s7/7>600){sc+=30;m.push("Média acima de 10 horas por dia na semana")}
  const hoje=dias[dataISO()]||0;let prev=0,n=0;for(let i=1;i<=14;i++){const v=dias[diasAtras(i)]||0;prev+=v;if(v>0)n++}
  const media=n?prev/n:0;if(hoje>360&&media>0&&hoje>media*4){sc+=20;m.push("Salto de tempo muito acima da média da pessoa")}
  const soma=vals.reduce((a,b)=>a+b,0);if(soma>(r.total||0)+5){sc+=40;m.push("Soma dos dias maior do que o total registrado")}
  const ult=(r.ult||[]).map(u=>u.m||0);
  if(ult.some(x=>x>300)){sc+=25;m.push("Sessão única com mais de 5 horas")}
  if(ult.length>=5){let rep=1,maxRep=1;for(let i=1;i<ult.length;i++){if(ult[i]>=30&&Math.abs(ult[i]-ult[i-1])<0.5){rep++;maxRep=Math.max(maxRep,rep)}else rep=1}if(maxRep>=5){sc+=15;m.push("Várias sessões seguidas com duração idêntica")}}
  const desde=p&&p.desde;if(desde&&Date.now()-desde<3*864e5&&(r.total||0)>1500){sc+=20;m.push("Conta criada há poucos dias com muitas horas")}
  return {score:Math.min(100,sc),nivel:sc>=60?"alto":sc>=30?"medio":"baixo",motivos:m};
}
function docRankingLocal(){const L=garantirTotais(S.pomoLog),dias={};for(let i=0;i<35;i++){const d=diasAtras(i);if(L.dias[d])dias[d]=Math.round(L.dias[d].min*100)/100}
  return {dias,total:L.tot.min,ult:(L.hist||[]).slice(0,10).map(h=>({m:Math.round(h.min*10)/10,em:h.em}))}}
function riscoProprio(){if(!S.pomoLog)return {score:0,nivel:"baixo",motivos:[]};return riscoDe(docRankingLocal(),S.pub||{desde:Date.now()})}
function riscoConta(id){const base=riscoDe(S.soc.ranking[id],S.soc.perfis[id]);const ia=S.iaRisco&&S.iaRisco[id];
  if(ia&&ia.risco==="alto"&&base.nivel!=="alto")return {...base,nivel:"alto",motivos:base.motivos.concat("IA: "+ia.motivo)};
  if(ia&&ia.risco==="medio"&&base.nivel==="baixo")return {...base,nivel:"medio",motivos:base.motivos.concat("IA: "+ia.motivo)};return base}
const escudo=id=>{const r=riscoConta(id);return r.nivel==="medio"?`<span title="Em verificação: ${esc(r.motivos.join("; "))}" style="color:var(--muted);margin-left:6px;vertical-align:middle">${ib("target",13)}</span>`:""};

/* Verificação "Ainda estudando?" do cronômetro: a cada 60 minutos; sem resposta em 5 minutos, o tempo para de contar */
const CHECK_MIN=60,CHECK_TOL=5;
function checarPresenca(){
  if(!C.rodando)return;const due=(C.confirmado||C.inicio)+CHECK_MIN*60e3,agora=Date.now();
  if(agora>due+CHECK_TOL*60e3){C.acum+=Math.max(0,due-C.inicio);C.rodando=false;clearInterval(C.tick);C.confirmado=0;salvarCronoLocal();document.getElementById("crono-check")?.remove();
    toast("Cronômetro pausado: ninguém confirmou que estava estudando. O tempo sem confirmação não foi contado.");publicarRanking();tickCrono();return}
  if(agora>=due&&!document.getElementById("crono-check")){const bg=document.createElement("div");bg.className="modal-bg";bg.id="crono-check";
    bg.innerHTML=`<div class="card stack modal" role="alertdialog" aria-modal="true" style="text-align:center;align-items:center"><span class="des-ic">${ib("clock",22)}</span><h2>Ainda estudando?</h2>
      <p class="muted">Confirme para o cronômetro continuar contando. Sem resposta em ${CHECK_TOL} minutos, ele pausa e o tempo depois desta pergunta não conta.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" type="button" data-ck="sim">Sim, estou estudando</button><button class="btn" type="button" data-ck="pausar">Pausar</button></div></div>`;
    document.body.appendChild(bg);bg.addEventListener("click",e=>{const a=e.target.closest("[data-ck]");if(!a)return;bg.remove();
      if(a.dataset.ck==="sim"){C.confirmado=Date.now();salvarCronoLocal()}else{pausarCrono();if(S.view==="cronometro")renderCronometro()}})}
}

      <div class="card row" style="justify-content:space-between"><div><h3>Armazenamento</h3><p class="small muted">${S.mode==="nuvem"?"Seus dados estão salvos na nuvem, ligados à sua conta.":"Modo visitante: nada é salvo e tudo some ao fechar o app. Entre com uma conta para salvar na nuvem."}</p></div>
        <span class="pill ${S.mode==="nuvem"?"solid":""}"><span class="dot"></span>${S.mode==="nuvem"?"Nuvem":"Local"}</span></div>
      <div class="card"><details><summary>Ver o prompt que a IA recebe para montar a semana</summary><pre class="prompt">${esc(montarPrompt(S.perfil,{prova:S.plano&&S.plano.prova?provaCtx():null}))}</pre></details></div>
      <div class="card"><details><summary>Ver o prompt usado para ler editais</summary><pre class="prompt">${esc(promptEditalTrecho("[trecho do edital]",0,1))}</pre></details></div>
    </div></div>`;
  $$("[data-link]").forEach(a=>a.onclick=()=>go(a.dataset.link));
  $("#cf-crono").onclick=()=>go("cronometro");
  $("#cf-meta").onchange=e=>{S.perfil.metaDia=+e.target.value;gravar("perfil",S.perfil);toast("Meta diária salva.");renderConfig()};
  $("#cf-ed").onclick=abrirEditorEstudos;

}

aplicarUI(uiAtual());
// site de testes (GitHub Pages): avisa e aponta para o site oficial no Firebase
if(/github\.io$/.test(location.hostname)){const fx=document.createElement("div");fx.className="faixa-teste";
  fx.innerHTML='Versão de testes · o site oficial é <a href="https://logicacademy.web.app/">logicacademy.web.app</a>';document.body.prepend(fx)}
renderLogin();
})();
</script>
